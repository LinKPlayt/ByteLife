        const coworkers = state.relationships.filter(r => r.type === 'Coworker');
        h += `<div class="status"><b>${rank.title}</b> · ${j.track}<br>${fmt(j.salary)}/yr · ${rank.hours}hrs/wk · Stress ${rank.stress}/100 · ${j.years}yr on the job${coworkers.length ? `<br>Coworkers: ${coworkers.map(c=>c.name).join(', ')}` : ''}</div>`;
        h += '<div class="plabel">CAREER LADDER</div>';
        h += `<div class="invrow"><div class="owned">${track.map((r,i) => i === j.rank ? `<b>${r.title}</b>` : (i < j.rank ? `✓ ${r.title}` : r.title)).join(' &nbsp;→&nbsp; ')}</div></div>`;
        const nx = track[j.rank + 1], nxGap = nx ? rankGap(nx, j.track) : '';
        const wl = worldImpactLines().filter(l => /field|Military/.test(l));
        if(wl.length) h += `<div class="status">${wl.join('<br>')}</div>`;
        if(nx) h += `<div class="invrow"><div class="owned">Next: <b>${nx.title}</b> at about ${fmt(startingSalary(j.track, j.rank + 1))}${nxGap ? ' · <span class="down">needs ' + nxGap + '</span>' : ''}. Your education adds ${Math.round((eduPayMult(j.track) - 1) * 100)}% to pay in this field${relevantDegree(j.track) ? ', including a relevant degree' : ''}.</div></div>`;
        h += opt('Work extra hard', '−2 health', 'workHarder()', state.done.work);
        if(j.track !== 'Military' && j.track !== 'Politics') h += opt('Negotiate a raise', 'risk/reward', 'negotiateRaise()', state.done.negotiate);
        if(j.track !== 'Military' && j.track !== 'Politics') h += opt('Look for a better offer', j.years < 1 ? 'after a year in the role' : 'same role, new company', 'jobHunt()', state.done.hunt || j.years < 1);
        h += opt(j.track === 'Military' ? 'Leave the military' : inOffice() ? 'Resign from office' : 'Quit job', '', 'quitJob()', false);
        if(a >= 60) h += opt('Retire', 'pension about ' + fmt(Math.round(pensionFor() * (a < 65 ? 1 - 0.06 * (65 - a) : 1) / 100) * 100) + '/yr', 'retire()', false);
      } else if(state.retired){
        h += `<div class="status"><b>Retired</b><br>Pension ${fmt(state.pension)}/yr, adjusted for the cost of living each year.</div>`;
      } else {
        h += '<div class="status">Currently unemployed. Browse career tracks below — you\'ll start at the entry rank of whichever one you apply to.</div>';
        if(a >= 60) h += opt('Retire', 'pension about ' + fmt(Math.round(pensionFor() * (a < 65 ? 1 - 0.06 * (65 - a) : 1) / 100) * 100) + '/yr', 'retire()', false);
      }
      h += milHtml() + govHtml();
      h += '<div class="plabel">CAREER TRACKS</div>';
      for(const trackName in CAREERS){
        if(!trackOpen(trackName) || trackName === 'Military') continue;       // the military has its own section above
        const rank0 = CAREERS[trackName][0];
        const already = j && j.track === trackName;
        const barred = recordBlocks(trackName), gap = rankGap(rank0, trackName), info = TRACK_INFO[trackName] || {};
        const tooOld = info.maxAge && a >= info.maxAge - 4;
        const ineligible = barred || tooOld || state.retired || a > 66 || !!gap;
        const meta = barred ? 'needs a clean record' : tooOld ? 'too old to start' : (state.retired || a > 66) ? 'hiring is closed at your age' : gap ? 'needs ' + gap : (startRankFor(trackName) ? 'as ' + CAREERS[trackName][startRankFor(trackName)].title + ' · ' : '') + fmt(startingSalary(trackName, startRankFor(trackName))) + '/yr';
        h += opt(`${trackName} <span class="sub-meta">${rank0.title} → ${CAREERS[trackName][CAREERS[trackName].length - 1].title}${info.blurb ? ' · ' + info.blurb : ''}</span>`, meta, `applyJob('${trackName}')`, already || state.done['app_'+trackName] || ineligible);
      }
    }
  }
  p.innerHTML = head + h;
  // while a decision is waiting, the panels can be read but not acted on
  if(document.querySelector('#choices .choice-btn')){
    p.querySelectorAll('button:not(.panel-close), input').forEach(x => x.disabled = true);
    p.querySelector('.panel-head').insertAdjacentHTML('afterend', '<div class="status">Answer the decision above first.</div>');
  }
}

// ---- setup ----
function audioSupported(){ return typeof window !== "undefined" && !!(window.AudioContext || window.webkitAudioContext); }

function audioImpulse(ctx, secs, decay){

// ---- building blocks ----
function tone(freq, t, dur, vol, type, o){

  else { const r = o.release !== undefined ? o.release : 0.25; g.gain.setValueAtTime(vol, t + Math.max(a, dur)); end = t + Math.max(a, dur) + r; g.gain.exponentialRampToValueAtTime(0.0001, end); }

// which moments of a life make which sound, and how much they matter
const SFX_RULES = [
  [/jackpot|wins the lottery/i, "jackpot", 9], [/graduates/i, "fanfare", 9], [/ public! .{1,12} starts trading/i, "fanfare", 9],
  [/steps into a new chapter/i, "fanfare", 8], [/say yes|a wedding follows/i, "wedding", 9], [/welcome a new child/i, "baby", 8],
  [/earns a promotion|is promoted/i, "promotion", 8], [/recognized influencer|verified badge/i, "fanfare", 8], [/retires/i, "retire", 8],
  [/files for bankruptcy|forcing bankruptcy/i, "bad_big", 8], [/gets canceled/i, "bad_big", 8], [/goes viral/i, "viral", 7],
  [/is laid off/i, "sad", 7], [/passes away/i, "sad", 7], [/breaks up with|divorces|drift apart/i, "sad", 6],

function entrySfx(text, delta){
  for(const [re, name, pri] of SFX_RULES) if(re.test(text)) return {name, pri};
  const d = delta || {}, cum = (typeof state !== "undefined" && state && state.econ) ? state.econ.cumInflation : 1;
  if(d.money > 0) return {name: d.money >= 1000 * cum ? "coins" : "coin", pri:5};
  if(d.money < 0 && -d.money >= 250 * cum) return {name:"spend", pri:4};
  const net = (d.happy || 0) + (d.health || 0) + (d.smarts || 0) + (d.looks || 0);

}

function audioFlush(){
  const q = AUDIO.queue; if(!q.length) return;
  AUDIO.queue = [];
  if(!AUDIO.ctx || !AUDIO.prefs.sfx) return;
  const seen = new Set(), picks = [];
  q.map((x, i) => ({name:x.name, pri:x.pri, i})).sort((a, b) => b.pri - a.pri || a.i - b.i).forEach(x => { if(!seen.has(x.name) && picks.length < 3){ seen.add(x.name); picks.push(x); } });

function musicStyleKey(){
  const h = state.stats.happy, hp = state.stats.health;

  const pool = melodyPool(st), out = new Array(8).fill(null); let idx = Math.min(AUDIO.lastIdx, pool.length - 1);

    const r = Math.random(); idx += r < 0.18 ? -2 : r < 0.5 ? -1 : r < 0.62 ? 0 : r < 0.9 ? 1 : 2;

  if(st.perc > 0){
    for(let b = 0; b < 4; b++){
      const bt = t + b * beat;
      if(b % 2 === 0) tone(130, bt, 0.14, st.perc * 0.18, "sine", {slideTo:48, pluck:true, attack:0.003, bus});

// ---------- Consequences: big decisions start chains of events that play out over the years ----------

// decision can end in a fortune or in bankruptcy.
const threads = () => state.threads || (state.threads = []);
function seedThread(key, data, first, delay, step){
  const th = {id:'t' + (state.threadSeq = (state.threadSeq || 0) + 1), key, step: step || 'start', due: state.age + (delay === undefined ? 1 : delay), data: data || {}, start: state.age, path:[{age: state.age, text: first}]};

  return th;
}
const hasThread = key => threads().some(t => t.key === key);
function nextStep(th, step, delay, note){ th.step = step; th.due = state.age + Math.max(1, delay || 1); if(note) th.path.push({age: state.age, text: note}); }
function endThread(th, note, mood){
  if(note) th.path.push({age: state.age, text: note});

  state.threads = threads().filter(x => x !== th);
  state.storyDone = (state.storyDone || []).concat([th]).slice(-12);

const thRel = th => th.data.rel ? findRel(th.data.rel) : null;
// switching careers ends military service or public office the proper way
function leaveRoleFor(track){

  if(inOffice() && track !== 'Politics') leaveOffice(officeIdx());
}
function threadJob(track, rank){

  if(state.job) convertCoworkersToFriends();

}
// the core of bankruptcy, shared with the button in the Bank tab

  lend:{

          else { CR().heat = Math.min(100, CR().heat + 35); pushEntry(a, `${state.name}'s confrontation goes badly, and the police take an interest.`, {happy:-6}); endThread(th, 'A confrontation brought the police closer', 'bad'); }
        }},
        {label: 'Refuse to pay again', run: () => { if(Math.random() < 0.4){ CR().arrests++; pushEntry(a, `The blackmailer makes good on the threat. ${state.name} is arrested.`, {happy:-8}); arrest(c, 0); endThread(th, 'Refused, and was turned in', 'bad'); } else endThread(th, 'Refused, and the threats stopped', 'good'); }},
      ];

      presentCustom(`The blackmailer is back, asking for ${fmt(want)}.`, opts);

  gamble:{
    title: () => 'The casino',
    hooked(th, a, ask){
      if(!ask) return 'wait';
      th.data.stage = (th.data.stage || 1) + 1;
      if(Math.random() < 0.1){
        const win = inflR(rint(10, 50) * 1000, 500);

          {label: 'Quit while ahead', run: () => endThread(th, `Walked away ${fmt(win)} richer`, 'good')},
          {label: 'Let it ride', run: () => nextStep(th, 'hooked', 1, 'Won big and kept playing')},
        ]);
        return true;

      const lost = inflR(rint(3, 9) * 1000 * th.data.stage, 500);
      state.money -= lost; th.data.lost = (th.data.lost || 0) + lost;

      ];

      presentCustom(`${state.name} has lost ${fmt(th.data.lost)} so far. The urge to win it back is strong.`, opts);

    shark(th, a, ask){

      presentCustom(`${state.name} owes far more than they can pay, and the people they owe are dangerous.`, opts);
      return true;
    },
  },

      bondDelta(['Mother', 'Father', 'Sibling'], -6);
      pushEntry(a, `Far from family and old friends, ${state.name} feels lonely in the new city.`, {happy:-8});
      endThread(th, 'Got the job, but felt lonely far from home', 'mixed');
    },
    stayed(th, a){

  whistle:{
    title: th => 'The fraud at work',
    fallout(th, a, ask){
      if(Math.random() < 0.4){ pushEntry(a, `${state.name} is hailed as a hero when the fraud is exposed. Offers pour in.`, {happy:12, fame:8}); if(state.job) state.job.salary = Math.round(state.job.salary * 1.15); return endThread(th, 'Was hailed as a hero', 'good'); }
      if(!ask) return 'wait';
      const lost = state.job ? state.job.title : th.data.title;
      state.job = null; convertCoworkersToFriends();
      const fee = inflR(5000, 100);

      if(canPay(fee)) opts.unshift({label: `Sue for wrongful termination (${fmt(fee)})`, run: () => {
        pay(fee);
        if(Math.random() < 0.55){ const s = inflR(rint(150, 600) * 1000, 1000); pushEntry(a, `${state.name} wins a ${fmt(s)} settlement.`, {money: s, happy:15}); endThread(th, `Won a ${fmt(s)} settlement`, 'good'); }
        else { pushEntry(a, `${state.name} loses the lawsuit, and word gets around the industry.`, {happy:-8}); endThread(th, 'Lost the lawsuit and was blacklisted', 'bad'); }
      }});
      pushEntry(a, `${state.name} is fired from their job as ${lost} after reporting the fraud.`, {happy:-10});
      presentCustom(`The company fired ${state.name} for blowing the whistle.`, opts);
      return true;
    },
    scandal(th, a, ask){
      if(Math.random() < 0.5){
        const j = state.job; if(j && j.salary) j.salary = Math.round(j.salary * 1.1);
        pushEntry(a, `The fraud ${state.name} kept quiet about never comes out, and the boss rewards their loyalty.`, {happy:-1});
        return endThread(th, 'The secret held, and silence was rewarded', 'mixed');
      }

      if(Math.random() < 0.35){ const c = Object.assign({}, CRIMES.find(x => x.key === 'fraud'), {charge: 'conspiracy to commit fraud'}); CR().arrests++; pushEntry(a, `Investigators charge ${state.name} for staying silent.`, {happy:-8}); arrest(c, 0); endThread(th, 'Was charged for staying silent', 'bad'); return true; }
      endThread(th, still ? 'Lost their job when the company collapsed' : 'Watched the old company collapse from a safe distance', still ? 'bad' : 'mixed');
    },
  },
};

// how chains begin when no decision of the player's has started one

const OPENERS = [
  {key:'lend', min:18, max:85, w:1.2, cond:() => state.money + state.savings > inflR(4000, 100) && state.relationships.some(r => ['Friend', 'Sibling', 'Child'].includes(r.type) && r.age >= 18 && r.closeness >= 35), run(a){
    const r = pick(state.relationships.filter(r => ['Friend', 'Sibling', 'Child'].includes(r.type) && r.age >= 18 && r.closeness >= 35));
    const amt = Math.min(inflR(rint(2, 10) * 1000, 100), Math.round((state.money + state.savings) * 0.5 / 100) * 100);

      {label: 'Lend it', run: () => { pay(amt); pushEntry(a, `${state.name} lends ${r.name} ${fmt(amt)}.`, {}); seedThread('lend', {rel: r.id, who: r.name, amt}, `Lent ${r.name} ${fmt(amt)}`, rint(1, 3), 'due'); }},
      {label: 'Say no', run: () => { bump(r, -8); pushEntry(a, `${state.name} turns down ${r.name}'s request for money.`, {}); seedThread('lend', {rel: r.id, who: r.name, amt}, `Refused to lend ${r.name} money`, rint(1, 3), 'refused'); }},
    ]);
  }},
  {key:'startup', min:22, max:70, w:1, cond:() => state.money + state.savings > inflR(12000, 100), run(a){
    const co = pick(STARTUP_NAMES), small = inflR(5000, 100), big = inflR(25000, 500);
    const opts = [{label: `Invest ${fmt(small)}`, run: () => { pay(small); pushEntry(a, `${state.name} invests ${fmt(small)} in ${co}.`, {}); seedThread('startup', {co, amt: small}, `Invested ${fmt(small)} in ${co}`, rint(2, 3), 'round'); }},
      {label: 'Pass', run: () => { seedThread('startup', {co, amt: 0}, `Passed on investing in ${co}`, rint(3, 5), 'passed'); }}];
    if(canPay(big * 1.5)) opts.splice(1, 0, {label: `Invest ${fmt(big)}`, run: () => { pay(big); pushEntry(a, `${state.name} invests ${fmt(big)} in ${co}.`, {}); seedThread('startup', {co, amt: big}, `Invested ${fmt(big)} in ${co}`, rint(2, 3), 'round'); }});
    presentCustom(`A founder pitches ${state.name} on ${co}, a young startup looking for early investors.`, opts);
  }},

function consequencesYear(a, canAsk){
  let asked = false;
  for(const th of threads().slice()){
    if(th.due > a || state.crime.prison) continue;
    const ch = CHAINS[th.key], fn = ch && ch[th.step];
    if(!fn){ endThread(th); continue; }
    const before = th.step, r = fn.call(ch, th, a, canAsk && !asked);
    if(r === 'wait'){ th.due = a + 1; continue; }
    if(r === true) asked = true;
    else if(threads().includes(th) && th.step === before && th.due <= a) th.due = a + 1;
  }
  if(!asked && canAsk && threads().length < 3 && Math.random() < 0.12){
    const ok = OPENERS.filter(o => a >= o.min && a <= o.max && !hasThread(o.key) && (!state.lastOpener || state.lastOpener[o.key] === undefined || a - state.lastOpener[o.key] >= 8) && o.cond());

      for(const c of ok){ x -= c.w; if(x <= 0){ o = c; break; } }
      (state.lastOpener || (state.lastOpener = {}))[o.key] = a;
      o.run(a); asked = true;
    }
  }
  return asked;
}
function threadHtml(th, done){

  const icon = !done ? '⏳' : th.mood === 'good' ? '✅' : th.mood === 'bad' ? '❌' : '➖';
  return `<div class="chain${done ? ' ' + th.mood : ''}"><div class="chain-h"><span>${icon} <b>${title}</b></span><span class="chain-age">${done ? 'age ' + th.start + '–' + th.end : 'since age ' + th.start}</span></div>` +
    th.path.map((p, i) => `<div class="chain-step${i === th.path.length - 1 && done ? ' last' : ''}"><span class="tl-age">${p.age}</span>${p.text}</div>`).join('<div class="chain-arrow">↓</div>') +
    (done ? '' : '<div class="chain-arrow">↓</div><div class="chain-step pending"><span class="tl-age"></span>to be continued…</div>') + '</div>';
}

}

const proOf = r => r && r.pro ? PROFESSIONS.find(p => p.key === r.pro) : null;

function rollPro(boost){
  // the higher you rise, the more powerful the people in the room
  const lift = (boost || 0) + (state.job ? state.job.rank * 0.15 : 0) + Math.min(0.6, state.fame.level / 100) + (netWorth() / state.econ.cumInflation > 1e6 ? 0.4 : 0);
  const list = PROFESSIONS.map(p => [p, p.w * (p.tier === 3 ? 1 + lift : p.tier === 1 ? Math.max(0.3, 1 - lift / 2) : 1)]);
  let x = Math.random() * list.reduce((t, l) => t + l[1], 0);
  for(const [p, w] of list){ x -= w; if(x <= 0) return p.key; }
  return list[0][0].key;
}

  state.done['civic_' + kind] = true;
  const n = state.name;
  if(kind === 'volunteer'){
    if(Math.random() < 0.3 && state.relationships.length < 60){ const r = newRel('Contact', {age: clampAge(state.age + rint(-5, 15)), closeness: rint(40, 55), origin: 'on a campaign'}); r.pro = 'politician'; pushEntry(state.age, `${n} volunteers on a campaign and gets to know ${r.name}, a politician.`, {happy:3}); }
    else pushEntry(state.age, `${n} spends weekends knocking on doors for a campaign.`, {happy:2, smarts:1});
  } else if(kind === 'donate'){
    const c = inflR(1000, 100); if(!canPay(c)) return; pay(c);
    if(Math.random() < 0.4 && state.relationships.length < 60){ const r = newRel('Contact', {age: clampAge(state.age + rint(0, 20)), closeness: rint(40, 55), origin: 'at a fundraiser'}); r.pro = 'politician'; pushEntry(state.age, `${n} donates ${fmt(c)} and is invited to a fundraiser, where they meet ${r.name}, a politician.`, {}); }
    else pushEntry(state.age, `${n} donates ${fmt(c)} to a political campaign.`, {});
  } else if(kind === 'protest'){
    if(Math.random() < 0.12){ pushEntry(state.age, `${n}'s protest turns tense, and they are briefly detained.`, {happy:-3}); CR().heat = Math.min(100, CR().heat + 10); }
    else pushEntry(state.age, `${n} marches in a protest for a cause they believe in.`, {happy:4, rep:3});
  } else if(kind === 'townhall' && inOffice()){
    const P = POL(); P.approval = Math.min(100, P.approval + rint(1, 5)); pushEntry(state.age, `${n} holds a packed town hall and listens to voters.`, {happy:1});
  }
  render();
}

    const theirs = inForce.map(k => WORLD_LAWS.find(l => l.key === k)).filter(l => l && partySide && l.side !== partySide && l.side !== 'any');
    if(theirs.length){ const l = pick(theirs); list.push({w:2, prompt:`${state.name}'s party wants to repeal a law: ${l.head.toLowerCase()}.`, opts:[

      {label:'Leave it alone', run:() => {}}]}); }
    list.push({w:3, prompt:'The national budget is up for debate.', opts:[
      {label:'Cut taxes for everyone', run:() => { w.taxMult = Math.max(0.75, Math.round((w.taxMult - 0.05) * 100) / 100); P.approval += 6; headline('TAX CUTS SIGNED', `President ${state.name} lowers taxes across the board.`, 'policy', true); pushEntry(state.age, `${state.name} signs a tax cut.`, {happy:3}); }},

function politicsYear(a, canAsk){
  const P = POL();
  if(P.former && P.former.until >= a && !state.crime.prison){ const fee = inflR(P.former.fee, 1000); state.money += fee; if(a === P.former.from + 1) pushEntry(a, `As a former ${P.former.title}, ${state.name} earns ${fmt(fee)} a year from speeches and books.`, {}); }
  if(!inOffice()) return false;
  const i = officeIdx(), o = OFFICES[i], w = state.world, e = state.econ;
  // approval drifts back toward the middle and erodes with time in office
  P.approval = Math.max(0, Math.min(100, Math.round(P.approval + rint(-5, 3) + (o.exec ? (e.recession ? -6 : w.events.some(x => x.key === 'boom') ? 4 : 0) : 0) + (45 - P.approval) / 6)));
  // corruption catches up
  if(canAsk && P.bribes && Math.random() < 0.12 * P.bribes){
    P.bribes = 0; P.scandal = a;
    pushEntry(a, `Investigators uncover the bribes ${state.name} took in office.`, {happy:-10, image:-25, fame:6});
    convertCoworkersToFriends(); state.job = null;
    CR().arrests++; arrest({key:'bribery', charge:'bribery', ing:'taking bribes', felony:true, years:[2, 8]}, 0);
    return true;
  }
  if(P.approval < 20 && Math.random() < 0.5){
    pushEntry(a, `${state.name} is ${i === 5 ? 'impeached and removed from office' : 'recalled by angry voters'}.`, {happy:-15, fame:5});
    leaveOffice(i, true); return false;
  }
  // terms end (the presidency follows the national election calendar)
  if(i < 5 && a >= P.termEnd){
    if(!canAsk) return false;
    const c = inflR(o.cost[0] * 0.5, 100), chance = reelectChance();
    presentCustom(`${state.name}'s term as ${o.title} is ending. Approval: ${P.approval}%.`, [
      {label:`Run for reelection (${fmt(c)}, about ${Math.round(chance * 100)}% to win)`, run:() => { if(!canPay(c)){ pushEntry(a, `${state.name} can't fund a campaign and leaves office.`, {}); leaveOffice(i); return; } pay(c);
        if(raceRoll(chance)){ P.termEnd = a + o.term; P.terms[i] = (P.terms[i] || 0) + 1; P.approval = Math.max(P.approval, 50); pushEntry(a, `${state.name} is reelected as ${o.title}.`, {happy:10, fame:2}); }
        else { pushEntry(a, `${state.name} loses reelection as ${o.title}.`, {happy:-10}); leaveOffice(i); } }},
      {label:'Step down', run:() => { pushEntry(a, `${state.name} chooses not to run again and leaves office as ${o.title}.`, {happy:2}); leaveOffice(i); }},
    ]);
    return true;
  }
  if(canAsk && Math.random() < 0.55){
    const list = policyChoices(i); let x = Math.random() * list.reduce((t, c) => t + c.w, 0), c = list[0];
    for(const l of list){ x -= l.w; if(x <= 0){ c = l; break; } }
    presentCustom(c.prompt + ` (Approval ${P.approval}%)`, c.opts.map(o2 => ({label:o2.label, run:() => { o2.run(); P.approval = Math.max(0, Math.min(100, Math.round(P.approval))); }})));
    return true;
  }
  return false;
}
function leaveOffice(i, disgraced){
  const P = POL(), o = OFFICES[i];
  if(state.job && state.job.track === 'Politics'){ convertCoworkersToFriends(); state.job = null; }
  if(P.wasRetired){ state.retired = true; P.wasRetired = false; }             // back to the pension they left behind
  if(!disgraced && i >= 3) P.former = {title:o.title, fee:{3:150000, 4:400000, 5:1500000}[i], from:state.age, until:state.age + (i === 5 ? 10 : 5)};
}
// the presidency is decided on the national election calendar
function presidentialRace(w){
  if(state.crime.prison) return null;
  const P = POL(), sitting = state.job && state.job.track === 'Politics' && state.job.rank === 5;
  if(sitting){
    if((P.terms[5] || 0) >= 2){ pushEntry(state.age, `${state.name} completes a second term as President and leaves office.`, {happy:6}); leaveOffice(5); return null; }
    if(raceRoll(reelectChance())){ P.terms[5]++; P.termEnd = state.age + 4; P.approval = Math.max(P.approval, 50); pushEntry(state.age, `${state.name} wins reelection as President.`, {happy:12, fame:6}); return {won:true}; }
    pushEntry(state.age, `${state.name} loses the presidential election and leaves the White House.`, {happy:-12}); leaveOffice(5); return {won:false};
  }
  if(P.campaign && P.campaign.office === 5){
    const c = P.campaign; P.campaign = null;
    if(raceRoll(winChance(5, c.style))){ const j = takeOffice(5); pushEntry(state.age, `${state.name} wins the election and becomes ${j.title} — salary now ${fmt(j.salary)}.`, {happy:20, fame:20}); return {won:true}; }
    P.losses = (P.losses || 0) + 1;
    pushEntry(state.age, `${state.name} loses the race for President.`, {happy:-10, fame:6}); return {won:false};
  }
  return null;
}
function govHtml(){
  const w = state.world, P = POL(), a = state.age;
  let h = '<div class="plabel">🏛 Government & politics</div>';
  const laws = (w.laws || []).map(k => (WORLD_LAWS.find(l => l.key === k) || {}).head).filter(Boolean).map(x => x.toLowerCase().replace(/ (passed|becomes law|legalized|signed|protected by law)$/, ''));
  h += `<div class="invrow"><div class="owned">${w.party ? 'Ruling party: <b>' + PARTIES[w.party].name + '</b>' : 'No national election yet'}${w.president ? ' · President ' + w.president : ''} · next national election ${electionWhen()}` +
    `<br>Taxes ${Math.round((w.taxMult || 1) * 100)}% of normal · minimum wage ${Math.round((w.wageMult || 1) * 100)}% of today's${laws.length ? '<br>In force: ' + laws.join(', ') : ''}</div></div>`;
  if(a < 18) return h;
  if(inOffice()){
    const i = officeIdx(), o = OFFICES[i];
    h += `<div class="invrow"><div class="itop"><span><b>${o.title}</b>${P.party ? ' · ' + PARTY_NAMES[P.party] : ''}</span><span class="price">${P.approval}% approval</span></div>` +
      `<div class="stat-track" style="margin:4px 0 6px;"><div class="stat-fill" style="width:${P.approval}%;background:var(--${P.approval >= 50 ? 'accent' : 'red'})"></div></div>` +
      `<div class="owned">${i === 5 ? 'Term ' + (P.terms[5] || 1) + ' of 2 · next election ' + electionWhen() : 'Term ends at ' + P.termEnd}${P.laws ? ' · ' + P.laws + ' law' + (P.laws === 1 ? '' : 's') + ' changed' : ''}. Each year in office brings decisions; ${i === 5 ? 'as President they change taxes, wages, laws, war and peace for everyone.' : 'low approval can cost you the job.'}</div>` +
      `<div class="btnrow-social" style="margin:8px 0 0;"><button onclick="civicAct('townhall')" ${state.done.civic_townhall ? 'disabled' : ''}>Hold a town hall</button><button onclick="resignOffice()">Resign</button></div></div>`;
  } else if(P.campaign){
    h += `<div class="status">Running for President. Election day is ${electionWhen()}.</div>`;
  }
  h += `<div class="invrow"><div class="owned">Party: <b>${P.party ? PARTY_NAMES[P.party] : 'none'}</b>${isVeteran() ? ' · veterans get a boost with voters' : ''}${felonyCount() ? ' · <span class="down">a felony record is a heavy burden</span>' : ''}</div><div class="btnrow-social" style="margin:8px 0 0;">` +
    `<button onclick="partyPrompt();render()">${P.party ? 'Switch party' : 'Join a party'}</button>` +
    `<button onclick="civicAct('volunteer')" ${state.done.civic_volunteer ? 'disabled' : ''}>Volunteer on a campaign</button>` +
    `<button onclick="civicAct('donate')" ${state.done.civic_donate || !canPay(inflR(1000, 100)) ? 'disabled' : ''}>Donate (${fmt(inflR(1000, 100))})</button>` +
    `<button onclick="civicAct('protest')" ${state.done.civic_protest ? 'disabled' : ''}>Join a protest</button></div></div>`;
  for(let i = 1; i <= 5; i++){
    if(inOffice() && i <= officeIdx()) continue;
    const g = runGap(i), o = OFFICES[i];
    if(g === 'experience in a lower office' && i > officeReach() + 1) continue;
    h += `<button class="opt" ${g ? 'disabled' : ''} onclick="runForOffice(${i})"><span>Run for ${o.title} <span class="sub-meta">${o.term}-year term · ${fmt(startingSalary('Politics', i))}/yr · campaigns from ${fmt(styleCost(i, 'grass'))}</span></span><span class="meta">${g ? 'needs ' + g : 'about ' + Math.round(winChance(i, 'ads') * 100) + '% with ads'}</span></button>`;
  }
  return h;
}
function resignOffice(ok){
  if(!inOffice()) return;
  if(ok !== true) return askConfirm(`Resign as ${state.job.title}?`, 'Resign', () => resignOffice(true));
  const i = officeIdx(); pushEntry(state.age, `${state.name} resigns as ${state.job.title}.`, {happy:-2}); leaveOffice(i); render();

function loadAch(){
  let a = null; try{ a = JSON.parse(localStorage.getItem(ACH_KEY) || "null"); } catch(e){}
  if(!a || typeof a.unlocked !== "object") a = {};
  return {unlocked: a.unlocked || {}, stats: Object.assign({lives:0, years:0}, a.stats || {})};
}
const ACH = loadAch();
function saveAch(){ try{ localStorage.setItem(ACH_KEY, JSON.stringify(ACH)); } catch(e){} }
const achCount = () => ACHIEVEMENTS.filter(x => ACH.unlocked[x.k]).length;
const achPoints = () => ACHIEVEMENTS.reduce((t, x) => t + (ACH.unlocked[x.k] ? ACH_TIERS[x.tier].pts : 0), 0);
function lifeAch(){ const a = state.ach || (state.ach = {}); a.events = a.events || []; a.got = a.got || []; a.peakDebt = a.peakDebt || 0; a.ms = a.ms || {}; return a; }
function unlockAch(x){
  if(!state || ACH.unlocked[x.k]) return;
  ACH.unlocked[x.k] = {age: state.age, who: state.name, gen: state.generation || 1, at: Date.now()};
  lifeAch().got.push(x.k);
  saveAch();
  state.log.push({age: state.age, text: `🏆 Achievement unlocked: <b>${x.name}</b> — ${x.desc.charAt(0).toLowerCase() + x.desc.slice(1)}.`, dtext: ''});
  queueToast('🏆 Achievement unlocked: <b>' + x.name + '</b>', '');
  sfxNow('fanfare');
}
function addMilestone(icon, text, k){
  const a = lifeAch();
  if(k){ if(a.ms[k]) return; a.ms[k] = 1; }
  (state.milestones || (state.milestones = [])).push({age: state.age, icon, text});
}
// moments the log records as they happen
function achText(text){
  if(!state || !state.alive && !/passes|record closes/.test(text)) return;
  for(const x of ACHIEVEMENTS) if(x.on && !ACH.unlocked[x.k] && x.on.test(text)) unlockAch(x);
  for(const [re, icon, t] of MS_ON) if(re.test(text)) addMilestone(icon, t, 'on:' + t);
}
// everything that can be read from the state of the life
function checkAchievements(quiet){
  if(!state) return;
  const a = lifeAch();
  a.peakDebt = Math.max(a.peakDebt, totalDebt() / state.econ.cumInflation);
  ((state.world && state.world.events) || []).forEach(ev => { if(!a.events.includes(ev.key)) a.events.push(ev.key); });
  for(const m of MILESTONES){
    if(a.ms[m.k]) continue;
    let ok = false; try{ ok = m.test(); } catch(e){}
    if(!ok) continue;
    if(quiet) a.ms[m.k] = 1; else{ let t = ''; try{ t = m.text(); } catch(e){ t = ''; } a.ms[m.k] = 1; if(t) addMilestone(m.icon, t); }
  }
  for(const x of ACHIEVEMENTS){
    if(!x.test || ACH.unlocked[x.k]) continue;
    let ok = false; try{ ok = x.test(); } catch(e){}
    if(ok) unlockAch(x);
  }
}
function achOnDeath(){
  if(state.age < 30) unlockAch(ACHIEVEMENTS.find(x => x.k === 'young'));
  checkAchievements();
}

function achBadge(x, on){
  const hide = x.secret && !on, u = ACH.unlocked[x.k];
  return `<div class="ach${on ? ' on ' + x.tier : ''}" title="${hide ? 'Secret achievement' : x.desc}"><span class="ach-ic">${hide ? '❔' : x.icon}</span><span class="ach-tx"><b>${hide ? '???' : x.name}</b><small>${hide ? 'A secret — keep living to find it' : x.desc}${u ? ' · ' + u.who + ', age ' + u.age : ''}</small></span></div>`;
}
function achGridHtml(){
  return ACH_CATS.map(c => {
    const list = ACHIEVEMENTS.filter(x => x.cat === c), got = list.filter(x => ACH.unlocked[x.k]).length;
    return `<div class="plabel">${c} <span class="ach-cnt">${got}/${list.length}</span></div><div class="ach-grid">` + list.map(x => achBadge(x, !!ACH.unlocked[x.k])).join('') + '</div>';
  }).join('');
}
function achSummary(){
  const n = achCount(), N = ACHIEVEMENTS.length;
  return `<div class="ach-bar"><div class="ach-fill" style="width:${Math.round(n / N * 100)}%"></div></div><div class="owned">${n} of ${N} unlocked · ${achPoints()} points · ${ACH.stats.lives} li${ACH.stats.lives === 1 ? 'fe' : 'ves'}, ${ACH.stats.years} years lived</div>`;
}

function milestonesHtml(limit){
  const ms = (state.milestones || []).slice();
  if(!ms.length) return '';
  const shown = limit ? ms.slice(-limit) : ms;
  return '<div class="timeline">' + (limit && ms.length > limit ? `<div class="tl-more">${ms.length - limit} earlier milestone${ms.length - limit > 1 ? 's' : ''}</div>` : '') +
    shown.map(m => `<div class="tl-row"><span class="tl-age">${m.age}</span><span class="tl-ic">${m.icon}</span><span class="tl-tx">${m.text}</span></div>`).join('') + '</div>';
}
function achMeHtml(){
  let h = '';
  const ms = milestonesHtml(8);
  if(ms) h += '<div class="plabel">Milestones</div>' + ms;
  const got = lifeAch().got.map(k => ACHIEVEMENTS.find(x => x.k === k)).filter(Boolean);
  h += '<div class="plabel">Achievements</div><div class="invrow">' + achSummary() +
    (got.length ? '<div class="ach-chips">' + got.slice(-6).map(x => `<span class="ach-chip ${x.tier}">${x.icon} ${x.name}</span>`).join('') + '</div>' : '') +
    '<div class="btnrow-social" style="margin:8px 0 0;"><button onclick="openAchievements()">🏆 View all achievements</button></div></div>';
  return h;
}
function achGameOverHtml(){
  let h = '';
  const ms = milestonesHtml(0);
  if(ms) h += '<div class="plabel">Highlights of a life</div>' + ms;
  const turns = (state.storyDone || []).concat(threads());
  if(turns.length) h += '<div class="plabel">Chain reactions</div>' + turns.map(th => threadHtml(th, !threads().includes(th))).join('');
  const got = lifeAch().got.map(k => ACHIEVEMENTS.find(x => x.k === k)).filter(Boolean);
  h += '<div class="plabel">Achievements this life</div><div class="invrow">' + (got.length ? '<div class="ach-chips">' + got.map(x => `<span class="ach-chip ${x.tier}">${x.icon} ${x.name}</span>`).join('') + '</div>' : '<div class="owned">No new achievements this time.</div>') +
    achSummary() + '<div class="btnrow-social" style="margin:8px 0 0;"><button onclick="openAchievements()">🏆 View all achievements</button></div></div>';
  return h;
}

                partner ? (partner.type === 'Spouse' ? 'married to ' : 'dating ') + partner.name : '', state.fame.level >= 10 ? '★ ' + fameTier(state.fame.level).toLowerCase() : '', state.crime.wanted ? '<span class="down">wanted</span>' : ''].filter(Boolean);
  document.getElementById('tags').innerHTML =
    `<span class="money${state.money < 0 ? ' neg' : ''}">${fmt(state.money)}</span>${state.age >= 16 && Math.abs(nw - state.money) >= 1 ? `<span class="networth">net worth ${fmt(nw)}</span>` : ''}` +
    (bits.length ? `<div class="tagline">${bits.join(' · ')}</div>` : '');
  renderPanel();
  document.getElementById('stageLabel').textContent = stageFor(state.age);
  for(const k of ['health','happy','smarts','looks']){
    document.getElementById(`fill-${k}`).style.width = state.stats[k] + '%';
    document.getElementById(`val-${k}`).textContent = state.stats[k];
  }
  queueSave();
  const np = document.getElementById('news'); if(np) np.innerHTML = state.world ? newsHtml() : '';
  const log = document.getElementById('log');
  const groups = [];
  state.log.slice(-40).reverse().forEach(e => {
    const g = groups[groups.length - 1];
    if(g && g.age === e.age) g.items.push(e); else groups.push({age:e.age, items:[e]});
  });
  log.innerHTML = groups.map(g => `<div class="log-year${g.age === state.age ? ' current' : ''}"><div class="log-age">${g.age === state.age ? 'This year · ' : ''}Age ${g.age}</div>` +
    g.items.map(e => `<div class="entry">${e.text} ${e.dtext}</div>`).join('') + '</div>').join('');
  audioAfterRender();
}

audioWire();
renderSetup();
achSetupLabel();
resumeGame();
document.addEventListener("visibilitychange", () => { if(document.hidden) saveGame(); });
window.addEventListener("pagehide", saveGame);
// keyboard: Space or Enter ages up, 1-4 picks an answer
document.addEventListener("keydown", e => {
  if(!document.getElementById("modal").hidden){ if(e.key === "Escape") closeConfirm(false); return; }
  if(!document.getElementById("achModal").hidden){ if(e.key === "Escape") closeAchievements(); return; }
  if(!state || !state.alive || e.target.closest("input, textarea, select") || e.ctrlKey || e.metaKey || e.altKey) return;
  const opts = document.querySelectorAll('#choices .choice-btn');
  if(opts.length && /^[1-9]$/.test(e.key) && opts[+e.key - 1]){ e.preventDefault(); opts[+e.key - 1].click(); return; }
  if((e.key === " " || e.key === "Enter") && !e.target.closest("button")){
    const b = document.getElementById('ageBtn'); if(!b.disabled){ e.preventDefault(); b.click(); }
  }
});
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
