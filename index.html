  {key:'cat', name:'Cat', adopt:150, buy:1200, yearly:900, life:[12,18], happy:3, minAge:5, trainable:true, shows:true},
  {key:'rabbit', name:'Rabbit', adopt:80, buy:250, yearly:600, life:[8,12], happy:2, minAge:5},
  {key:'hamster', name:'Hamster', adopt:20, buy:40, yearly:200, life:[2,3], happy:1, minAge:4},
  {key:'fish', name:'Goldfish', adopt:10, buy:30, yearly:120, life:[5,12], happy:1, minAge:3},
  {key:'parrot', name:'Parrot', adopt:400, buy:2500, yearly:700, life:[30,60], happy:3, minAge:10, trainable:true, shows:true},
  {key:'lizard', name:'Lizard', adopt:100, buy:300, yearly:400, life:[10,20], happy:1, minAge:8},
  {key:'turtle', name:'Turtle', adopt:60, buy:150, yearly:250, life:[30,60], happy:1, minAge:6},
  {key:'ferret', name:'Ferret', adopt:150, buy:500, yearly:700, life:[6,10], happy:2, minAge:10, trainable:true},
  {key:'horse', name:'Horse', adopt:3000, buy:25000, yearly:9000, life:[25,30], happy:5, minAge:12, exercise:true, trainable:true, shows:true, needsHome:true},
];
const BREEDS = {dog:['Labrador','Beagle','Border Collie','Golden Retriever','Corgi','Poodle','Husky','German Shepherd','Dachshund','mixed-breed'],
  cat:['tabby','Siamese','Maine Coon','Persian','black','calico','Bengal'], horse:['Arabian','Quarter Horse','Thoroughbred','pony'],
  parrot:['African Grey','macaw','cockatiel','budgie'], rabbit:['lop-eared','Dutch','lionhead'], lizard:['bearded dragon','gecko'],
  ferret:['sable','albino'], hamster:['Syrian','dwarf'], fish:['fantail','comet'], turtle:['box','red-eared slider']};
const speciesOf = k => PET_SPECIES.find(s => s.key === k);
const petCost = (s, how) => inflR(s[how], 5);
const myPets = () => state.pets || (state.pets = []);
function petTaken(){ return myPets().map(p => p.name).concat(state.name); }
function newPet(speciesKey, o){
  const s = speciesOf(speciesKey); o = o || {};
  const free = PETS.concat(['Bear','Luna','Rocky','Daisy','Milo','Willow','Scout','Nala','Pumpkin','Clover']).filter(n => !petTaken().includes(n));
  state.petSeq = (state.petSeq || 0) + 1;
  const p = {id:'p' + state.petSeq, name:o.name || pick(free.length ? free : PETS), species:speciesKey, breed:pick(BREEDS[speciesKey] || ['']),
    age:o.age !== undefined ? o.age : 0, life:rint(s.life[0], s.life[1]), bond:o.bond || 40, health:o.health || rint(70, 95), trained:0, pedigree:!!o.pedigree, wins:0};
  myPets().push(p);
  return p;
}
function petLabel(p){ return p.breed && p.breed !== 'mixed-breed' ? p.breed + ' ' + speciesOf(p.species).name.toLowerCase() : speciesOf(p.species).name.toLowerCase(); }
function petState(how){
  if(myPets().length >= 6) return {ok:false, why:'enough pets already'};
  if(state.crime.prison) return {ok:false, why:'not from prison'};
  if(state.done['pet_' + how]) return {ok:false, why:'done this year'};
  return {ok:true, why:''};
}
function getPet(speciesKey, how){
  const s = speciesOf(speciesKey); if(!s || !petState(how).ok || state.age < s.minAge) return;
  if(s.needsHome && !state.assets.some(x => x.category === 'Homes')) return;
  const cost = petCost(s, how); if(!ensureCash(cost)) return;
  state.money -= cost; state.done['pet_' + how] = true;
  const p = how === 'buy' ? newPet(speciesKey, {age:0, pedigree:true, bond:50}) : newPet(speciesKey, {age: rint(0, Math.max(1, Math.round(s.life[0] / 2))), bond:35});
  pushEntry(state.age, how === 'buy' ? `${state.name} brings home ${p.name}, a pedigree ${petLabel(p)} from a breeder.` : `${state.name} adopts ${p.name}, a ${p.age > 1 ? p.age + '-year-old ' : ''}${petLabel(p)}, from the shelter.`, {happy: 6 + s.happy});
  state.socMenu = null;
  render();
}
// caring for a pet: once each per year
const PET_ACTS = [
  {key:'play', label:p => speciesOf(p.species).exercise ? (p.species === 'horse' ? 'Ride' : 'Walk') : 'Play', who:() => true},
  {key:'train', label:() => 'Train', who:p => speciesOf(p.species).trainable && p.trained < 100},
  {key:'vet', label:() => 'Vet checkup', who:() => true, cost:p => Math.round(petCost(speciesOf(p.species), 'yearly') * 0.25)},
  {key:'groom', label:() => 'Groom', who:p => ['dog','cat','horse','rabbit'].includes(p.species), cost:() => inflR(60, 5)},
  {key:'show', label:() => 'Enter a show', who:p => speciesOf(p.species).shows && p.trained >= 40, cost:() => inflR(150, 5)},
];
function petAct(id, key){
  const p = myPets().find(x => x.id === id), x = PET_ACTS.find(a => a.key === key);
  if(!p || !x || !x.who(p) || state.done['pa_' + key + '_' + id] || state.crime.prison) return;
  const cost = x.cost ? x.cost(p) : 0; if(cost && !ensureCash(cost)) return;
  if(cost) state.money -= cost;
  state.done['pa_' + key + '_' + id] = true;
  const n = state.name, s = speciesOf(p.species);
  if(key === 'play'){
    p.bond = Math.min(100, p.bond + rint(6, 10));
    if(s.exercise){ state.done.petWalk = true; pushEntry(state.age, p.species === 'horse' ? `${n} goes for a long ride on ${p.name}.` : `${n} takes ${p.name} on a long walk.`, {happy:3, health:2}); }
    else pushEntry(state.age, `${n} spends an afternoon playing with ${p.name}.`, {happy:3});
  } else if(key === 'train'){
    const gain = Math.round(rint(8, 15) * (p.age <= 2 ? 1.3 : p.age > s.life[0] * 0.7 ? 0.6 : 1));
    p.trained = Math.min(100, p.trained + gain); p.bond = Math.min(100, p.bond + 3);
    const trick = p.species === 'parrot' ? pick(['a new phrase', 'to whistle a tune', "to say " + n + "'s name"]) : p.species === 'horse' ? pick(['to jump a fence cleanly', 'a smooth canter', 'dressage steps']) : pick(['to sit and stay', 'to fetch', 'to roll over', 'to shake hands', 'a brand-new trick']);
    pushEntry(state.age, `${n} teaches ${p.name} ${trick}.`, {happy:2});
  } else if(key === 'vet'){
    p.health = Math.min(100, p.health + rint(8, 15));
    if(p.sick){ p.sick = false; pushEntry(state.age, `The vet treats ${p.name}, who perks right back up.`, {happy:3}); }
    else pushEntry(state.age, `${p.name} gets a clean bill of health at the vet.`, {happy:1});
  } else if(key === 'groom'){
    p.bond = Math.min(100, p.bond + 3);
    pushEntry(state.age, `${n} gets ${p.name} groomed. ${p.name} looks magnificent.`, {happy:2});
  } else if(key === 'show'){
    const chance = (p.trained / 160) + (p.pedigree ? 0.15 : 0) + p.bond / 500;
    if(Math.random() < chance * 0.45){ p.wins++; const prize = inflR(500 + p.trained * 20, 50); pushEntry(state.age, `${p.name} wins best in show! ${n} takes home ${fmt(prize)}.`, {money:prize, happy:8, fans:3}); }
    else if(Math.random() < chance){ pushEntry(state.age, `${p.name} places at the ${speciesOf(p.species).name.toLowerCase()} show.`, {happy:4}); }
    else pushEntry(state.age, `${p.name} is distracted at the show and doesn't place.`, {happy:-1});
  }
  render();
}
function rehomePet(id, ok){
  const p = myPets().find(x => x.id === id); if(!p) return;
  if(ok !== true) return askConfirm(`Find ${p.name} a new home?`, 'Rehome', () => rehomePet(id, true));
  state.pets = myPets().filter(x => x.id !== id);
  pushEntry(state.age, `${state.name} finds ${p.name} a loving new home.`, {happy:-5});
  render();
}
// yearly: costs, aging, illness, goodbyes, and what pets do for you. Returns the cost.
function petsYear(a, canPrompt){
  let cost = 0, lift = 0, asked = false;
  const n = state.name;
  myPets().slice().forEach(p => {
    const s = speciesOf(p.species);
    p.age++;
    cost += petCost(s, 'yearly');
    p.bond = Math.max(0, p.bond - (state.lastDone && Object.keys(state.lastDone).some(k => k.startsWith('pa_') && k.endsWith('_' + p.id)) ? 0 : 4));
    const old = p.age > p.life * 0.75;
    p.health = Math.max(0, Math.min(100, p.health + (old ? -rint(4, 9) : rint(-3, 2))));
    if(p.age >= p.life || p.health <= 0 || (old && Math.random() < 0.12)){
      state.pets = myPets().filter(x => x.id !== p.id);
      pushEntry(a, `${p.name} the ${petLabel(p)} passes away${p.age >= 8 ? ' after ' + p.age + ' good years' : ''}. ${n} is heartbroken.`, {happy: -Math.round(4 + p.bond / 12)});
      return;
    }
    lift += s.happy * (0.5 + p.bond / 100);
    if(!p.sick && Math.random() < (old ? 0.18 : 0.06)) p.sick = true;
    if(p.sick){
      const bill = inflR(rint(4, 30) * 100 * (s.key === 'horse' ? 4 : s.key === 'dog' || s.key === 'cat' ? 1 : 0.4), 50);
      if(canPrompt && !asked){
        asked = true;
        presentCustom(`${p.name} the ${petLabel(p)} is sick. The vet quotes ${fmt(bill)} for treatment.`, [
          canPay(bill) ? {label:`Pay for treatment (${fmt(bill)})`, run:() => { pay(bill); p.sick = false; p.health = Math.min(100, p.health + 20); p.bond = Math.min(100, p.bond + 5); pushEntry(state.age, `${p.name} pulls through after treatment.`, {happy:4}); }} : null,
          {label:'Wait and hope it passes', run:() => { if(Math.random() < 0.5){ p.sick = false; pushEntry(state.age, `${p.name} recovers on their own.`, {happy:2}); } else { p.health = Math.max(0, p.health - 30); pushEntry(state.age, `${p.name} gets worse without treatment.`, {happy:-4}); } }},
        ].filter(Boolean));
      } else { p.health = Math.max(0, p.health - 10); }
    }
    // a few things pets get up to
    const r = Math.random();
    if(!asked && r < 0.02 && ['dog','cat','ferret','parrot'].includes(p.species)){
      if(Math.random() < 0.7) pushEntry(a, `${p.name} slips out and goes missing for three days before turning up, muddy and pleased with themselves.`, {happy:-1});
      else { state.pets = myPets().filter(x => x.id !== p.id); pushEntry(a, `${p.name} runs away and is never found.`, {happy:-8}); }
    } else if(r < 0.05 && p.species === 'dog') pushEntry(a, `${p.name} chews through ${pick(['a couch cushion', 'a new pair of shoes', 'the TV remote'])}.`, {money:-inflR(150, 10), happy:-1});
    else if(r < 0.07 && p.trained >= 50 && state.social.account) pushEntry(a, `A video of ${p.name} doing tricks goes viral.`, {fans:10, happy:5});
    else if(r < 0.075 && p.species === 'dog' && p.bond >= 60) pushEntry(a, `${p.name} barks the house awake during a kitchen fire. Everyone gets out safely.`, {happy:6, family:4});
  });
  if(lift) applyDelta({happy: Math.min(6, Math.round(lift))});
  return {cost, asked};
}
function petsHtml(){
  const a = state.age, pets = myPets();
  let h = '<div class="plabel">Pets (' + pets.length + ')</div>';
  if(!pets.length) h += '<div class="status">No pets yet. Pets lift your mood every year and keep loneliness away, but they cost money and need care.</div>';
  pets.forEach(p => {
    const s = speciesOf(p.species);
    const acts = PET_ACTS.filter(x => x.who(p)).map(x => {
      const c = x.cost ? x.cost(p) : 0, done = state.done['pa_' + x.key + '_' + p.id];
      return `<button onclick="petAct('${p.id}','${x.key}')" ${done || (c && !canPay(c)) || state.crime.prison ? 'disabled' : ''}>${x.label(p)}${c ? ' (' + fmt(c) + ')' : ''}${done ? ' ✓' : ''}</button>`;
    }).join('') + `<button onclick="rehomePet('${p.id}')">Rehome</button>`;
    h += `<div class="invrow"><div class="itop"><span><b>${p.name}</b> <span class="tick">${s.name.toUpperCase()} · AGE ${p.age}</span></span><span class="price">${p.bond >= 80 ? 'Devoted' : p.bond >= 55 ? 'Attached' : p.bond >= 30 ? 'Friendly' : 'Aloof'}</span></div>
      <div class="owned">${petLabel(p)}${p.pedigree ? ' · pedigree' : ''}${s.trainable ? ' · training ' + p.trained + '/100' : ''}${p.wins ? ' · ' + p.wins + ' show win' + (p.wins > 1 ? 's' : '') : ''} · ${fmt(petCost(s, 'yearly'))}/yr${p.sick ? ' · <span class="down">sick</span>' : ''}${p.age > p.life * 0.75 ? ' · getting old' : ''}</div>
      <div class="stat-track" style="margin:4px 0 2px;"><div class="stat-fill" style="width:${p.health}%;background:var(--${p.health < 40 || p.sick ? 'red' : 'green'})"></div></div>
      <div class="btnrow-social">${acts}</div></div>`;
  });
  if(state.socMenu === 'pets'){
    const home = state.assets.some(x => x.category === 'Homes');
    h += '<div class="plabel">Get a pet</div>';
    PET_SPECIES.forEach(s => {
      if(a < s.minAge - 1) return;
      const why = a < s.minAge ? 'from age ' + s.minAge : s.needsHome && !home ? 'needs a home of your own' : '';
      const ad = petState('adopt'), by = petState('buy');
      h += bankRow(s.name, `${fmt(petCost(s, 'yearly'))} a year to keep · lives ${s.life[0]}-${s.life[1]} years${s.trainable ? ' · trainable' : ''}${s.exercise ? ' · good exercise' : ''}${why ? ' · <span class="down">' + why + '</span>' : ''}`,
        `<button onclick="getPet('${s.key}','adopt')" ${why || !ad.ok || !canPay(petCost(s, 'adopt')) ? 'disabled' : ''}>Adopt (${fmt(petCost(s, 'adopt'))})</button><button onclick="getPet('${s.key}','buy')" ${why || !by.ok || !canPay(petCost(s, 'buy')) ? 'disabled' : ''}>Breeder (${fmt(petCost(s, 'buy'))})</button>`);
    });
  }
  h += `<div class="btnrow-social"><button onclick="toggleSocMenu('pets')">${state.socMenu === 'pets' ? 'Close' : 'Get a pet'}</button></div>`;
  return h;
}

const ixCost = ix => ix.cost ? inflR(ix.cost, 5) : 0;
function ixState(r, ix){
  if(!ix.who.includes(r.type)) return {show:false};
  if(state.crime.prison && !["call","talk","advice"].includes(ix.key)) return {show:false};
  if(ix.maxClose !== undefined && r.closeness > ix.maxClose) return {show:false};
  if(ix.needs && !ix.needs(r)) return {show:false};
  if(ix.minAge && state.age < ix.minAge) return {show:true, ok:false, why:"from age " + ix.minAge};
  if(ix.minClose !== undefined && r.closeness < ix.minClose) return {show:true, ok:false, why:"needs a closer bond"};
  if(state.done["ix_" + ix.key + "_" + r.id]) return {show:true, ok:false, why:"done this year"};
  if((state.done["ixn_" + r.id] || 0) >= 3) return {show:true, ok:false, why:"enough for this year"};
  const c = ixCost(ix);
  if(c && state.money + state.savings < c) return {show:true, ok:false, why:"costs " + fmt(c)};
  return {show:true, ok:true, why:""};
}
function interact(id, key){
  const r = findRel(id), ix = INTERACTIONS.find(x => x.key === key);
  if(!r || !ix || !ixState(r, ix).ok) return;
  state.done["ix_" + key + "_" + id] = true;
  state.done["ixn_" + id] = (state.done["ixn_" + id] || 0) + 1;
  const n = state.name, rn = r.name, cost = ixCost(ix);
  const T = s => s.replace(/\{n\}/g, n).replace(/\{r\}/g, rn);
  if(hasTrait(r, "Flaky") && key !== "call" && Math.random() < 0.2){
    pushEntry(state.age, rn + " cancels at the last minute, and " + n + " is left with a free evening.", {happy:-1});
    render(); return;
  }
  if(cost){ ensureCash(cost); state.money -= cost; }
  if(ix.kind === "network"){
    if(networkAsk(r)){ render(); return; }
    bump(r, 2); pushEntry(state.age, `${rn} has nothing for ${n} right now, but promises to keep them in mind.`, {}); render(); return;
  }
  let gain = ix.gain ? rint(ix.gain[0], ix.gain[1]) : 0, happy = ix.happy ? rint(ix.happy[0], ix.happy[1]) : 0, smarts = ix.smarts ? rint(ix.smarts[0], ix.smarts[1]) : 0;
  const delta = {}; let text = "", extra = "";
  if(hasTrait(r, "Loyal")) gain = Math.round(gain * 1.15);
  if(ix.adv && hasTrait(r, "Adventurous")){ gain = Math.round(gain * 1.3); happy += 1; extra += " " + rn + " lives for this kind of thing."; }
  if(ix.fun && hasTrait(r, "Funny")){ happy += 1; extra += " " + rn + " keeps everyone laughing."; }
  if(ix.wise && hasTrait(r, "Wise")){ smarts *= 2; extra += " " + rn + " has real wisdom to share."; }
  if(hasTrait(r, "Moody") && Math.random() < 0.25){ gain = Math.round(gain * 0.4); happy -= 1; extra += " " + rn + " is in a mood, though."; }
  if(ix.kind === "gift" && hasTrait(r, "Generous")){
    gain = Math.round(gain * 1.2);
    if(cost && Math.random() < 0.3){ delta.money = Math.round(cost * 0.5); extra += " " + rn + " insists on paying part of it back."; }
  }
  if(ix.kind === "talk" && r.closeness < 50 && Math.random() < 0.25){
    gain = 2; happy = -1; text = n + " tries to open up to " + rn + ", but it comes out awkward.";
  } else if(ix.kind === "favor"){
    const p = r.closeness / 110 + (hasTrait(r, "Generous") ? 0.15 : 0);
    if(Math.random() < p){
      const roll = Math.random();
      if(roll < 0.45){ const amt = inflR(rint(150, 900), 10); delta.money = (delta.money || 0) + amt; text = rn + " helps " + n + " out with " + fmt(amt) + " when money is tight."; gain = 3; happy = 2; }
      else if(roll < 0.75 && state.job){ state.boost = true; text = rn + " puts in a good word for " + n + " at work, which should help the next promotion."; gain = 3; happy = 3; }
      else { text = rn + " lends a hand with something big, no questions asked."; gain = 4; happy = 3; smarts = 1; }
    } else { gain = -5; happy = -2; text = rn + " cannot help, and the ask leaves things a little strained."; }
  } else if(ix.kind === "intro"){
    if(Math.random() < 0.65 && state.relationships.length < 60){
      const p = newRel("Friend", {age: Math.max(0, r.age + rint(-5,5)), closeness: rint(30,45), origin: "through " + rn});
      text = rn + " introduces " + n + " to " + p.name + ", and they hit it off."; gain = 2; happy = 4;
    } else { text = rn + " tries to set up an introduction, but it fizzles."; gain = 2; happy = 0; }
  } else if(ix.kind === "collab"){
    state.boost = true;
    text = n + " and " + rn + " team up on a project, and leadership notices.";
    if(hasTrait(r, "Ambitious")){ extra += " " + rn + " pushes the work to another level."; smarts = 2; }
  } else if(ix.kind === "amends"){
    if(Math.random() < 0.7){ gain = rint(12,18); happy = 3; text = n + " makes amends with " + rn + ", and the air finally clears."; }
    else { gain = -2; happy = -2; text = n + " reaches out to " + rn + ", but the hurt runs deeper than one apology."; }
  }
  if(!text) text = T(pick(ix.texts));
  if(hasMyTrait('Funny')) gain = Math.round(gain * 1.15);
  if(hasMyTrait('Generous') && ix.kind === 'gift'){ gain = Math.round(gain * 1.25); happy += 1; }
  if(hasMyTrait('Adventurous') && ix.adv) happy += 2;
  bump(r, gain);
  if(happy) delta.happy = happy;
  if(smarts) delta.smarts = smarts;
  pushEntry(state.age, text + extra, delta);
  render();
}

  }

  }
  if(r.age >= 21 && state.age >= 18 && Math.random() < 0.035) moneyAsk(r, moments);

// ---- inheritance ----
function rollFamilyEstate(){            // the family's wealth, in today's dollars

  if(r < 0.82) return rint(110000, 420000);
  if(r < 0.96) return rint(550000, 2200000);

function growFamilyEstate(){
  if(!state.famEstate) return;

  if(!parents.length) return;
  const oldest = Math.max(...parents.map(p => p.age));

function estateTax(total){

const HEIRLOOMS = {

function parentDied(rel){

function createEstate(kind, rel){

    const cat = Math.random() < 0.5 ? "Jewelry" : "Collectibles";
    heirloom = {category: cat, name: pick(HEIRLOOMS[cat]), value: Math.round(rint(1500, 20000) * cum * (total > 500000 * cum ? 3 : 1) / 100) * 100};
  }
  state.estateSeq++;
  const e = {id:"e" + state.estateSeq, kind, from:rel.name, relType:rel.type, total, tax, heirs, sibs, cash: Math.round(cashPool / heirs),

  state.estates.push(e);
  if(kind === "parents") state.famEstate = 0;       // a spouse's death must not wipe out the parents' estate
  pushEntry(state.age, kind === "parents" ? `${rel.name}'s passing leaves an estate to settle.` : `${rel.name}'s passing leaves ${state.name} an inheritance to settle.`, {});

}
function addLegacyAsset(key, name, category, value){

}
function settleEstate(id, how){

  const e = state.estates[i], n = state.name;

  if(how === "home"){
    if(!e.homeValue) return;
    const buyout = Math.round(e.homeValue * e.sibs / e.heirs);
    if(!ensureCash(buyout - e.cash)) return;
    cash = e.cash - buyout; keepHome = true; happy = 8;
    msg = `${n} keeps the family home${buyout ? ", buying out the siblings for " + fmt(buyout) : ""}`;
  } else if(how === "donate"){
    const half = Math.round(cash / 2);
    cash -= half; happy = 7;
    if(state.social.account) state.social.reputation = clampRep(state.social.reputation + 5);
    bondDelta(["Sibling"], 3);
    msg = `${n} donates ${fmt(half)} of the inheritance to charity`;
  } else if(how === "contest"){
    if(!e.sibs) return;

    state.money -= fee;
    const win = Math.random() < 0.5;
    cash = Math.round(cash * (win ? 1.35 : 0.85)); happy = win ? 4 : -4;
    bondDelta(["Sibling"], win ? -12 : -20);

  } else {
    msg = e.homeValue ? `${n} sells the family home and settles the estate` : `${n} settles the estate`;
  }

  if(keepHome) addLegacyAsset("familyhome", "Family Home", "Homes", e.homeValue);

  state.estates.splice(i, 1);

function legacyTemplate(x){

function buyTrust(){

// ---------- The family line: continue as your child ----------
// each living child is one line of the family; a child who died first passes their line to their own children
function heirLines(){
  const lines = state.relationships.filter(r => r.type === "Child").map(k => ({members:[k], close:k.closeness}));
  const orphans = {};
  state.relationships.filter(g => g.type === "Grandchild" && !findRel(g.parentId)).forEach(g => (orphans[g.parentId] = orphans[g.parentId] || []).push(g));
  for(const id in orphans){ const m = orphans[id]; lines.push({members:m, close: m.reduce((t, g) => t + g.closeness, 0) / m.length}); }
  return lines;
}
function legacyPlan(){
  const cum = state.econ.cumInflation, worth = Math.max(0, netWorth());
  const tax = estateTax(worth), net = Math.max(0, worth - tax);
  const spouse = state.relationships.find(r => r.type === "Spouse");
  const lines = heirLines(), kids = lines.flatMap(l => l.members);
  let charity = 0, family = net;
  if(state.will === "charity"){ charity = net; family = 0; }
  else if(state.will === "split"){ charity = Math.round(net / 2); family = net - charity; }
  let spouseShare = 0, kidsPool = family;
  if(spouse && kids.length){ spouseShare = Math.round(family / 2); kidsPool = family - spouseShare; }   // the surviving parent keeps half
  else if(spouse){ spouseShare = family; kidsPool = 0; }
  const chosen = state.willSplit === "one" && kids.find(k => k.id === state.willHeir);
  const weights = lines.map(l => chosen ? (l.members.includes(chosen) ? 1 : 0) : state.willSplit === "bond" ? Math.pow(Math.max(10, l.close), 2) : 1);
  const wsum = weights.reduce((t, w) => t + w, 0) || 1, shares = {};
  lines.forEach((l, i) => {
    const pool = kidsPool * weights[i] / wsum;
    l.members.forEach(m => shares[m.id] = chosen ? (m === chosen ? Math.round(pool) : 0) : Math.round(pool / l.members.length));
  });
  return {worth, tax, net, charity, family, spouse, spouseShare, kids, shares, cum};
}
function legacyText(){

  const fam = p.spouse && p.kids.length ? "their spouse, " + p.spouse.name + ", and " + kidsTxt
            : p.spouse ? "their spouse, " + p.spouse.name
            : p.kids.length ? kidsTxt : "extended family and friends";
  const to = state.will === "charity" ? "charity" : state.will === "split" ? "half to " + fam + " and half to charity" : fam;
  return `Their estate of ${fmt(p.worth)} (${fmt(p.worth / p.cum)} in today's money)${p.tax ? ", after " + fmt(p.tax) + " in estate tax," : ""} passes to ${to}.`;
}
const TRAIT_START = {Funny:{happy:5}, Wise:{smarts:6}, Loyal:{happy:3}, Ambitious:{smarts:3}, Generous:{happy:3}, Adventurous:{health:5}, Moody:{happy:-4}, Flaky:{smarts:-3}};
// what one heir receives, and in what form (called while the finished life is still the current state).
// An adult heir takes the business, property and investments as they are, as far as their share covers them; the rest is cash.
function heirCash(kid, plan){
  const share = plan.shares[kid.id] || 0, adult = kid.age >= 18;
  const biz = state.business, bizVal = biz ? Math.round(biz.value * bizShare(biz)) : 0, takesBiz = adult && !!biz && bizVal <= share;
  let left = share - (takesBiz ? bizVal : 0), assetValue = 0;
  const assets = [];
  state.assets.slice().sort((x, y) => y.value - x.value).forEach(x => {
    if(!adult && x.category !== "Jewelry" && x.category !== "Collectibles") return;
    const loan = state.loans.find(l => l.assetId === x.id), net = x.value - (loan ? loan.balance : 0);
    if(net > 0 && net <= left){ assets.push(x.id); left -= net; assetValue += net; }
  });
  const pv = portfolioValue(), takesStocks = adult && pv > 0 && pv <= left;
  if(takesStocks) left -= pv;
  return {cash: Math.max(0, Math.round(left)), takesBiz, bizValue: takesBiz ? bizVal : 0, assets, assetValue: Math.round(assetValue),
          takesStocks, stockValue: takesStocks ? Math.round(pv) : 0, trust: !adult,
          assetNames: state.assets.filter(x => assets.includes(x.id)).map(x => x.name)};
}
function inheritParts(p){

  if(p.assetNames.length) parts.push(p.assetNames.join(", ") + " (" + fmt(p.assetValue) + ")");
  if(p.takesStocks) parts.push("the investment portfolio (" + fmt(p.stockValue) + ")");
  return parts.length > 1 ? parts.slice(0, -1).join(", ") + " and " + parts[parts.length - 1] : parts[0];
}
function inheritText(name, p){

    : `${name} inherits nothing, but starts with the family name and a life ahead.`;
}
function lineageHtml(){

function continueAs(kidId){

const H = () => state.health;
const condOf = key => H().conditions.find(c => c.key === key);
const medCost = n => Math.round(inflR(n, 10) * (state.insurance.health ? 0.2 : 1));
function exercisedThisYear(){
  const d = state.lastDone || {};                // healthYear runs after the new year's slate is cleared
  return !!(d.gym || d.sport || d.play || d.petWalk || d['pr_workout'] || ACTIVE_HOBBIES.some(k => d['hob_' + k])) ||
         ACTIVE_HOBBIES.some(k => hobbyLevel(k) >= 40);

function onsetChance(key, d, a){
  if(a < d.min || (d.max && a > d.max)) return 0;
  const hb = H().habits, s = state.stats;
  let p = d.rate;
  if((key === 'flu' || key === 'pneumonia') && state.world.fx.flu) p *= state.world.fx.flu;
  if(d.aging) p *= 1 + Math.max(0, a - 45) / 14;
  if(key === 'cancer' && a < 40) p *= 0.35;
  p *= Math.max(0.5, Math.min(2, 1 + (60 - s.health) / 80));
  if(H().history.includes(key)) p *= 1.6;
  if(hb.smoke && ['heart','cancer','pneumonia','hypertension','asthma'].includes(key)) p *= key === 'cancer' ? 2.5 : 2;
  if(hb.drink === 2 && ['heart','cancer','hypertension','depression'].includes(key)) p *= 1.4;
  if(['diabetes','heart','hypertension'].includes(key)) p *= hb.diet === 'healthy' ? 0.6 : hb.diet === 'junk' ? 1.6 : 1;
  if(['heart','diabetes','depression','hypertension'].includes(key) && exercisedThisYear()) p *= 0.75;
  if(d.mood){ p *= s.happy < 30 ? 3 : s.happy < 45 ? 1.6 : 1;
    if(myPets().some(x => x.bond >= 50)) p *= 0.75;                       // a loved pet keeps loneliness away
    if(CALM_HOBBIES.some(k => hobbyLevel(k) >= 35)) p *= 0.8; if(state.job){ const r = CAREERS[state.job.track][state.job.rank]; p *= 1 + r.stress / 150; } if(state.crime.prison) p *= 2; }
  if(key === 'bone' && state.job && (TRACK_INFO[state.job.track] || {}).risk) p *= 1.5;
  return p;

function addCondition(key, a, opts){
  if(condOf(key)) return null;
  const d = CONDITIONS[key];

  if(d.kind === 'cancer') c.stage = 1;
  H().conditions.push(c);

}
function condLabel(c){ const d = CONDITIONS[c.key]; return d.kind === 'cancer' ? 'stage ' + c.stage + ' cancer' : d.name; }
function condName(c){ const n = condLabel(c); return n.replace(/^(the|an?) /, '').replace(/^./, x => x.toUpperCase()); }
function condMort(c){
  const d = CONDITIONS[c.key];
  if(d.kind === 'cancer') return d.mort[c.stage - 1] * (c.treated ? 0.6 : 1);
  if(!d.mort) return 0;
  return c.treated ? (d.mortTreated !== undefined ? d.mortTreated : d.mort * 0.4) : d.mort * (d.aging ? 1 + Math.max(0, state.age - 60) / 20 : 1);

function deathRoll(a){
  for(const c of H().conditions){ const m = condMort(c); if(m && Math.random() < m) return c; }
  return Math.random() < mortalityChance(a, state.stats.health) * 0.8 ? 'age' : null;   // illnesses now carry part of the risk

// a decision about treating something newly found
function treatmentPrompt(c){
  const d = CONDITIONS[c.key], n = state.name;
  if(d.kind === 'cancer') return cancerPrompt(c);
  if(!d.treat) return false;
  const cost = medCost(d.cost);
  presentCustom(`${n} has ${condLabel(c)}. Treatment is ${d.treat}, costing ${fmt(cost)}${d.yearly ? ' a year' : ''}${state.insurance.health ? ' after insurance' : ''}.`, [
    canPay(cost) ? {label:`Start treatment (${fmt(cost)}${d.yearly ? '/yr' : ''})`, run:() => startTreatment(c.key)} : null,
    {label: canPay(cost) ? 'Not now' : "Can't afford it right now", run:() => pushEntry(state.age, `${n} holds off on treating ${condLabel(c)}.`, {})},
  ].filter(Boolean));

}
function cancerPrompt(c){
  const n = state.name, opts = CANCER_TREATMENTS.filter(t => t.stages.includes(c.stage)).map(t => {
    const cost = medCost(t.cost);
    return canPay(cost) ? {label:`${t.label} (${fmt(cost)}), about ${Math.round(Math.min(0.97, t.cure[t.stages.indexOf(c.stage)] + state.world.medTech) * 100)}% chance of remission`, run:() => cancerTreat(c.key, t.key)} : null;
  }).filter(Boolean);
  opts.push({label: opts.length ? 'Decline treatment' : 'Treatment is out of reach', run:() => pushEntry(state.age, `${n} decides against cancer treatment for now.`, {happy:-2})});

function startTreatment(key){
  const c = condOf(key), d = CONDITIONS[key]; if(!c || c.treated || !d.treat) return;
  const cost = medCost(d.cost); if(!ensureCash(cost)) return;
  state.money -= cost;
  if(d.kind === 'acute'){
    H().conditions = H().conditions.filter(x => x !== c);
    pushEntry(state.age, `${state.name} gets ${d.treat} for ${d.name} and recovers.`, {happy:2});
  } else if(d.oneOff){
    if(Math.random() < d.resolveTreated){ H().conditions = H().conditions.filter(x => x !== c); H().habits.drink = Math.min(H().habits.drink, 1); pushEntry(state.age, `${state.name} completes ${d.treat} and gets clean.`, {happy:8, health:4}); }
    else pushEntry(state.age, `${state.name} goes through ${d.treat}, but relapses soon after.`, {happy:-4});
  } else {
    c.treated = true;
    pushEntry(state.age, `${state.name} starts ${d.treat} for ${d.name}.`, {happy:1});
  }

}
function stopTreatment(key){
  const c = condOf(key); if(!c || !c.treated) return;
  c.treated = false;
  pushEntry(state.age, `${state.name} stops treatment for ${CONDITIONS[key].name}.`, {});
  render();
}
function cancerTreat(key, tkey){
  const c = condOf(key), t = CANCER_TREATMENTS.find(x => x.key === tkey);
  if(!c || !t || !t.stages.includes(c.stage) || state.done.cancerTx) return;
  const cost = medCost(t.cost); if(!ensureCash(cost)) return;
  state.money -= cost; state.done.cancerTx = true; c.treated = true;
  if(Math.random() < Math.min(0.97, t.cure[t.stages.indexOf(c.stage)] + state.world.medTech)){
    H().conditions = H().conditions.filter(x => x !== c);
    if(!H().history.includes('cancer')) H().history.push('cancer');

  } else pushEntry(state.age, `${state.name} goes through ${t.label.toLowerCase()}, but the cancer is still there.`, Object.assign({}, t.hit, {happy:-6}));
  render();

// yearly: habits, new illnesses, progression, treatment costs. Returns true if it asked a question.
function healthYear(a, canPrompt){
  const could = canPrompt, hb = H().habits, n = state.name, conds = H().conditions;
  const cash0 = state.money + state.savings;
  // habits
  if(hb.smoke){ applyDelta({health:-1, money:-inflR(1500, 10)}); if(Math.random() < 0.4) applyDelta({looks:-1}); }
  if(hb.drink === 1) applyDelta({happy:1, money:-inflR(500, 10)});
  if(hb.drink === 2){ applyDelta({happy:1, health:-2, money:-inflR(2000, 10)}); if(Math.random() < 0.3) applyDelta({smarts:-1}); }
  if(hb.diet === 'healthy'){ applyDelta({health:1, money:-inflR(1200, 10)}); }
  if(hb.diet === 'junk'){ applyDelta({health:-1}); if(Math.random() < 0.3) applyDelta({looks:-1}); }
  if(!condOf('addiction') && a >= 14 && Math.random() < (hb.drink === 2 ? 0.08 : hb.drink === 1 ? 0.01 : 0) + (state.crime.record.some(r => r.crime === 'drug dealing') ? 0.03 : 0)){
    const c = addCondition('addiction', a); pushEntry(a, `${n}'s drinking has turned into an addiction.`, {happy:-4});
    if(canPrompt && treatmentPrompt(c)) canPrompt = false;
  }
  // existing conditions
  conds.slice().forEach(c => {
    const d = CONDITIONS[c.key];
    if(d.kind === 'acute'){
      if(a > c.since){ H().conditions = H().conditions.filter(x => x !== c); if(d.untreatedExtra) applyDelta(d.untreatedExtra); pushEntry(a, `${n} gets over ${d.name}${d.untreatedExtra ? ', though it never quite healed right' : ''}.`, {}); }
      return;
    }
    if(d.kind === 'cancer'){
      if(Math.random() < (c.treated ? 0.2 : 0.45) && c.stage < 4){ c.stage++; c.treated = false; }
      applyDelta({health: -2 * c.stage, happy: c.known ? -3 : 0});
      if(!c.known && c.stage >= 3){ diagnose(c, 'Worrying symptoms'); if(canPrompt && cancerPrompt(c)) canPrompt = false; }
      return;
    }
    if(c.treated && d.yearly){
      const cost = medCost(d.cost);
      if(ensureCash(cost)) state.money -= cost;
      else { c.treated = false; pushEntry(a, `${n} can't afford ${d.treat} any more and has to stop.`, {happy:-3}); }
    }
    // chronic illness wears health down slowly rather than every single year, so decades of it don't compound
    const eff = Object.assign({}, c.treated ? (d.managed || {}) : d.hit);
    if(eff.health && Math.random() > 0.4) delete eff.health;
    applyDelta(eff);
    if(d.drain && !c.treated) applyDelta({money:-inflR(d.drain, 10)});
    if(!c.known && Math.random() < 0.25){ diagnose(c, 'Symptoms'); if(canPrompt && treatmentPrompt(c)) canPrompt = false; }
    const resolve = c.treated ? (d.resolveTreated || d.resolve || 0) : (d.resolve || 0);
    if(resolve && Math.random() < resolve * (d.mood && state.stats.happy > 55 ? 1.5 : 1)){
      H().conditions = H().conditions.filter(x => x !== c);
      if(c.known) pushEntry(a, `${n}'s ${d.name.replace(/^(an?|the) /, '')} ${d.mood ? 'lifts' : 'clears up'}.`, {happy:5});
    }
  });
  // a nudge to get checked when it has been a while
  if(canPrompt && a >= 35 && !state.crime.prison && (H().lastCheckup === null || a - H().lastCheckup >= 4) && !(a - (H().nagged || -9) < 3) && Math.random() < 0.35){
    H().nagged = a;
    const cost = inflR(150, 5);
    presentCustom(`${n}'s doctor's office calls: it has been ${H().lastCheckup === null ? 'years' : (a - H().lastCheckup) + ' years'} since ${n}'s last checkup.`, [
      {label:`Book a checkup (${fmt(cost)})`, run:() => doCheckup()},
      {label:"Skip it", run:() => pushEntry(state.age, `${n} puts off the checkup again.`, {})},
    ]);
    canPrompt = false;
  }
  // one line for what habits and treatment cost this year, instead of silent deductions
  const spent = Math.round(cash0 - state.money - state.savings);
  if(spent > 0){
    state.money += spent;
    const why = [hb.smoke ? 'cigarettes' : '', hb.drink ? 'drinks' : '', hb.diet === 'healthy' ? 'healthy food' : '', conds.some(c => c.treated && CONDITIONS[c.key].yearly) ? 'medical care' : '', condOf('addiction') && !condOf('addiction').treated ? 'feeding an addiction' : ''].filter(Boolean);
    pushEntry(a, `${n} spends ${fmt(spent)} on ${why.length ? why.join(', ').replace(/, ([^,]*)$/, ' and $1') : 'their health'} this year.`, {money:-spent});
  }
  // new illnesses
  for(const key in CONDITIONS){
    if(condOf(key) || key === 'addiction') continue;
    if(Math.random() < onsetChance(key, CONDITIONS[key], a)){
      const c = addCondition(key, a), d = CONDITIONS[key];
      if(c.known){
        pushEntry(a, d.kind === 'acute' ? `${n} ${d.onset}.` : `${n} is diagnosed with ${d.name}.`, d.kind === 'acute' ? {} : {happy:-3});
        if(canPrompt && treatmentPrompt(c)) canPrompt = false;
      }
    }
  }
  return could && !canPrompt;
}

function prisonAct(key, ok){
  const k = CR(), pr = k.prison, n = state.name; if(!pr || state.done['pr_' + key]) return;
  if(key === 'escape' && ok !== true) return askConfirm("Try to escape? If it fails, two years are added to the sentence.", "Try it", () => prisonAct('escape', true));
  if(key === 'appeal' && (!canPay(appealCost()) || pr.juvenile || pr.appealed)) return;
  if(key === 'gang' && pr.gang) return;
  state.done['pr_' + key] = true;
  if(key === 'behave'){ pr.behavior++; pushEntry(state.age, `${n} keeps their head down and stays out of trouble.`, {happy:-1}); }
  else if(key === 'workout') pushEntry(state.age, `${n} trains hard in the prison gym.`, {health:4, looks:1});
  else if(key === 'study'){
    const ged = state.edu.level === 'None' && state.age >= 16;
    if(ged) state.edu.level = 'High School';
    pushEntry(state.age, ged ? `${n} studies hard and earns a high school equivalency diploma.` : `${n} spends the year in the prison library.`, {smarts: ged ? 4 : 3, happy:1});
  } else if(key === 'gang'){
    pr.gang = true; pr.behavior = Math.max(0, pr.behavior - 2);
    if(Math.random() < 0.3) pushEntry(state.age, `${n} joins a crew, and the initiation is brutal.`, {health:-8, happy:-2});
    else pushEntry(state.age, `${n} falls in with a crew that watches their back.`, {happy:2});
  } else if(key === 'appeal'){
    pay(appealCost()); pr.appealed = true;
    if(Math.random() < 0.22 + state.stats.smarts / 500){
      if(Math.random() < 0.4){ pushEntry(state.age, `${n}'s appeal succeeds and the conviction is overturned.`, {happy:12}); const last = k.record[k.record.length - 1]; if(last) last.expunged = true; release('served'); }
      else { pr.left = Math.max(1, Math.round(pr.left / 2)); pushEntry(state.age, `${n}'s appeal succeeds in cutting the sentence to ${pr.left} more year${pr.left > 1 ? "s" : ""}.`, {happy:8}); }
    } else pushEntry(state.age, `${n}'s appeal is denied.`, {happy:-4});
  } else if(key === 'escape'){
    if(Math.random() < 0.06 + k.skill / 600){
      k.wanted = true; k.wantedYears = pr.left; k.prison = null; k.heat = 100;
      pushEntry(state.age, `${n} escapes from prison and disappears. Every year on the run risks getting caught.`, {happy:10});
    } else {
      pr.left += 2; pr.behavior = 0;
      pushEntry(state.age, `${n}'s escape attempt fails. Two years are added to the sentence.`, {health:-5, happy:-6});
    }
  }
  render();
}
function expungeCost(){ return inflR(3000, 100); }
function canExpunge(){ const k = CR(); return k.record.some(x => !x.expunged && !x.juvenile) && !k.prison && !k.probation && !k.wanted && state.age - (k.lastConviction || 0) >= 7; }
function expungeRecord(){
  if(!canExpunge() || !ensureCash(expungeCost())) return;
  state.money -= expungeCost();
  CR().record.forEach(x => x.expunged = true);
  pushEntry(state.age, `${state.name} gets their criminal record expunged. A clean slate.`, {happy:8});
  render();
}
// ---- lawsuits ----
function legalYear(a){
  if(a < 18 || CR().prison || Math.random() > 0.035) return false;
  const n = state.name, car = state.assets.some(x => x.category === 'Cars');
  if(Math.random() < 0.55){
    const kind = car ? 'car' : state.business ? 'biz' : 'landlord';
    const claim = inflR(rint(kind === 'landlord' ? 2 : 10, kind === 'landlord' ? 12 : 80) * 1000, 100);
    const covered = kind === 'car' && state.insurance.auto ? 0.8 : 0;
    const owe = x => Math.round(x * (1 - covered));
    const fee = inflR(6000, 100);
    const what = {car:"a driver sues after a crash", biz:"a customer sues the business", landlord:"a former landlord sues over damages"}[kind];
    presentCustom(`${n} is being sued: ${what}, claiming ${fmt(claim)}.${covered ? " Auto insurance will cover most of it." : ""}`, [
      {label:`Settle for ${fmt(owe(claim / 2))}`, run:() => pushEntry(state.age, `${n} settles the lawsuit for ${fmt(owe(claim / 2))}.`, {money:-owe(claim / 2), happy:-2})},
      {label:`Fight it in court (${fmt(fee)} in legal fees)`, run:() => {
        if(Math.random() < 0.5 + state.stats.smarts / 400) pushEntry(state.age, `${n} wins the lawsuit, though the legal bills sting.`, {money:-fee, happy:4});
        else pushEntry(state.age, `${n} loses the lawsuit and must pay ${fmt(owe(claim))} plus legal fees.`, {money:-(owe(claim) + fee), happy:-6});
      }},
      {label:"Ignore it", run:() => { adjustCredit(-40); pushEntry(state.age, `${n} ignores the lawsuit and loses by default, owing ${fmt(owe(claim * 1.2))}.`, {money:-owe(claim * 1.2), happy:-4}); }},
    ]);
  } else {
    const why = pick(["is injured by a faulty product", "slips on an unmarked wet floor in a store", "is hurt by a neighbor's negligence"]);
    const award = inflR(rint(20, 250) * 1000, 1000);
    presentCustom(`${n} ${why}. A lawyer offers to take the case for a third of any winnings.`, [
      {label:"Sue", run:() => {
        if(Math.random() < 0.5){ const got = Math.round(award * 2 / 3); pushEntry(state.age, `${n} wins the case and takes home ${fmt(got)} after the lawyer's cut.`, {money:got, happy:8}); }
        else pushEntry(state.age, `${n} loses the case, but owes the lawyer nothing.`, {happy:-3});
      }},
      {label:"Let it go", run:() => pushEntry(state.age, `${n} decides it isn't worth a fight.`, {})},
    ]);
  }
  return true;
}

    h += opt(c.label + (c.felony ? ' <span class="tick">FELONY</span>' : ''), st.ok ? Math.round(crimeRisk(c) * 100) + "% risk · " + payTxt : st.why, `commitCrime('${c.key}')`, !st.ok);

// ---------- Finances: economy, credit, loans, insurance, business ----------
function totalDebt(){
  return (state.creditCard ? state.creditCard.balance : 0) + state.loans.reduce((s,l) => s + l.balance, 0);
}
function netWorth(){
  return state.money + state.savings + (state.trustFund || 0) + (state.retirement ? state.retirement.balance : 0) + cdTotal() + portfolioValue() + assetsValue() + (state.business ? state.business.value * bizShare(state.business) : 0) - totalDebt();
}
function toSavings(amt){ if(state.money < amt) return; state.money -= amt; state.savings += amt; render(); }
function toChecking(amt){ if(state.savings < amt) return; state.savings -= amt; state.money += amt; render(); }
// ---------- Savings: tiered rates, transfer ticket, auto-save, goals, CDs ----------
const SAVINGS_GOALS = [
  {label:"Starter cushion", target:5000},
  {label:"Emergency fund", target:15000},
  {label:"Down payment", target:50000},
  {label:"Rainy-day empire", target:150000},
  {label:"Freedom fund", target:500000},
];
function savingsRateFor(bal){
  const r = state.econ.rate;
  if(bal >= 25000) return Math.max(0.003, r - 0.005);
  if(bal >= 2500) return Math.max(0.002, r - 0.015);
  return Math.max(0.001, r - 0.025);
}
function savingsRate(){ return savingsRateFor(state.savings); }
function savingsTier(){ const s = state.savings; return s >= 25000 ? "Premier" : s >= 2500 ? "Plus" : "Basic"; }
function cdTotal(){ return state.cds.reduce((s, c) => s + c.value, 0); }
function cdRateFor(term){ return Math.max(0.01, state.econ.rate + 0.004 + term * 0.002); }
function checkGoal(a){
  const g = state.savingsGoal;
  if(g && !g.reached && state.savings >= g.target){
    g.reached = true;
    pushEntry(a, state.name + " hits a savings goal: " + g.label + " (" + fmt(g.target) + ").", {happy:6});
  }
}
function setXferDir(d){ const x = state.xfer; x.dir = d; x.amount = ""; x.all = false; renderPanel(); }
function xferInput(v){ state.xfer.amount = v; state.xfer.all = false; updateXferPreview(); }
function xferChip(mode, v){
  const x = state.xfer, src = Math.max(0, x.dir === "in" ? state.money : state.savings);
  const amt = Math.max(0, Math.min(mode === "pct" ? src * v : v, src));
  x.all = mode === "pct" && v >= 1;
  x.amount = String(Math.floor(amt * 100) / 100);
  renderPanel();
}
function xferCheck(){
  const x = state.xfer, src = x.dir === "in" ? state.money : state.savings;
  const amt = x.all ? Math.max(0, src) : parseFloat(x.amount);
  if(!(amt > 0)) return {ok:false, amt:0, msg:"Enter an amount."};
  if(amt > src + 1e-6) return {ok:false, amt, msg: x.dir === "in" ? "Not enough in checking." : "Not enough in savings."};
  return {ok:true, amt:Math.min(amt, src), msg:""};
}
function xferPreviewHtml(){
  const x = state.xfer, v = xferCheck();
  let h = "";
  if(v.amt > 0){
    const chk = x.dir === "in" ? state.money - v.amt : state.money + v.amt;
    const sav = x.dir === "in" ? state.savings + v.amt : state.savings - v.amt;
    h += "After: checking " + money2(chk) + " · savings " + money2(sav);
    h += "<br>Interest next year at " + (savingsRateFor(sav) * 100).toFixed(2) + "%: about " + money2(Math.max(0, sav) * savingsRateFor(sav));
  }
  if(!v.ok) h += (h ? "<br>" : "") + '<span style="color:var(--red)">' + v.msg + "</span>";
  return h;
}
function updateXferPreview(){
  const el = document.getElementById("xferPreview"), go = document.getElementById("xferGo");
  if(el) el.innerHTML = xferPreviewHtml();
  if(go) go.disabled = !xferCheck().ok;
}
function doTransfer(){
  const v = xferCheck(); if(!v.ok) return;
  if(state.xfer.dir === "in"){
    state.money -= v.amt; state.savings += v.amt;
    pushEntry(state.age, state.name + " moves " + money2(v.amt) + " into savings.", {});
    checkGoal(state.age);
  } else {
    state.savings -= v.amt; state.money += v.amt;
    pushEntry(state.age, state.name + " withdraws " + money2(v.amt) + " from savings.", {});
  }
  state.xfer.amount = ""; state.xfer.all = false;
  render();
}
function setAutoSave(p){ state.autoSave = p; renderPanel(); }
function setGoal(i){
  if(i < 0 || !SAVINGS_GOALS[i]) state.savingsGoal = null;
  else { const tg = inflR(SAVINGS_GOALS[i].target, 1000); state.savingsGoal = {label:SAVINGS_GOALS[i].label, target:tg, reached: state.savings >= tg}; }
  renderPanel();
}
function openCD(term){
  if(state.age < 18) return;
  const amt = parseFloat(state.xfer.amount);
  if(!(amt >= 500) || amt > state.savings + 1e-6) return;
  const principal = Math.min(amt, state.savings), rate = cdRateFor(term);
  state.savings -= principal; state.cdSeq++;
  state.cds.push({id:"cd" + state.cdSeq, term, yearsLeft:term, rate, principal, value:principal});
  pushEntry(state.age, state.name + " opens a " + term + "-year CD with " + money2(principal) + " at " + (rate * 100).toFixed(2) + "%.", {});
  state.xfer.amount = ""; state.xfer.all = false;
  render();
}
function breakCD(id){
  const i = state.cds.findIndex(c => c.id === id); if(i < 0) return;
  const cd = state.cds[i], back = cd.value * 0.98;
  state.cds.splice(i, 1);
  state.savings += back;
  pushEntry(state.age, state.name + " breaks a CD early and takes back " + money2(back) + " after a 2% penalty.", {happy:-1});
  render();
}

  h += "</div></div>";

  h += '<div class="plabel">Auto-save</div><div class="invrow"><div class="owned">Each year, move a share of your leftover income into savings automatically.' + (state.lastAutoSaved ? " Last year it saved " + fmt(state.lastAutoSaved) + "." : "") + "</div>";
  h += '<div class="sortrow">' + [0, 0.05, 0.1, 0.2, 0.3].map(p => pill(p ? Math.round(p * 100) + "%" : "Off", state.autoSave === p, "setAutoSave(" + p + ")")).join("") + "</div></div>";

  h += '<div class="plabel">Savings goal</div><div class="invrow">';
  if(g){
    const pct = Math.min(100, Math.round(state.savings / g.target * 100));
    h += '<div class="itop"><span><b>' + g.label + '</b></span><span class="price">' + fmt(state.savings) + " / " + fmt(g.target) + "</span></div>";
    h += '<div class="stat-track"><div class="stat-fill" style="width:' + pct + '%;background:var(--green)"></div></div>';
    h += '<div class="owned">' + (g.reached ? "Goal reached." : pct + "% of the way there.") + "</div>";
  } else h += '<div class="owned">Pick a target to work toward.</div>';
  h += '<div class="sortrow">' + SAVINGS_GOALS.map((s, i) => pill(fmt(inflR(s.target, 1000)), !!g && g.label === s.label, "setGoal(" + i + ")")).join("") + pill("Clear", false, "setGoal(-1)") + "</div></div>";

  const amt = parseFloat(x.amount), cdOk = state.age >= 18 && amt >= 500 && amt <= state.savings + 1e-6;
  h += '<div class="plabel">Certificates of deposit</div><div class="invrow"><div class="owned">Lock money away for a guaranteed higher rate. Uses the amount typed above, at least $500, taken from savings. Breaking one early costs a 2% penalty.</div>';
  h += '<div class="assetbuy">' + [1, 3, 5].map(term => '<button onclick="openCD(' + term + ')" ' + (cdOk ? "" : "disabled") + ">" + term + "-year " + (cdRateFor(term) * 100).toFixed(2) + "%</button>").join("") + "</div></div>";
  state.cds.forEach(cd => {
    h += bankRow(cd.term + "-year CD at " + (cd.rate * 100).toFixed(2) + "%", fmt(cd.value) + " now, " + cd.yearsLeft + " yr left, matures near " + fmt(cd.value * Math.pow(1 + cd.rate, cd.yearsLeft)), '<button onclick="breakCD(\'' + cd.id + '\')">Break early</button>');

function creditTier(s){ return s>=800?'Excellent': s>=740?'Very Good': s>=670?'Good': s>=580?'Fair':'Poor'; }
function adjustCredit(d){ state.creditScore = Math.max(300, Math.min(850, Math.round(state.creditScore + d))); }
function incomeTax(gross){ return incomeTaxBase(gross) * (state.world ? state.world.taxMult : 1); }
function incomeTaxBase(gross){
  const brackets = [[40000,0.12],[100000,0.22],[Infinity,0.32]];
  let tax = 0, lower = 0;
  for(const [cap,rate] of brackets){
    const amt = Math.max(0, Math.min(gross,cap) - lower);
    tax += amt * rate; lower = cap;
    if(gross <= cap) break;
  }
  return tax;
}
const yrInfl = () => state.econ.inflation + (state.econ.boost || 0);
function updateEconomy(a){
  const e = state.econ;
  if(e.recession){
    e.recessionLeft--;
    if(e.recessionLeft <= 0){ e.recession = false; pushEntry(a, `The economy climbs out of recession.`, {happy:3}); }
  }
  e.rate = Math.max(0.01, Math.min(0.14, e.rate + (Math.random()+Math.random()-1)*0.01 + (0.04-e.rate)*0.1 + (e.recession?0.01:0)));
  e.inflation = Math.max(-0.01, Math.min(0.12, e.inflation + (Math.random()+Math.random()-1)*0.008 + (0.025-e.inflation)*0.1 + (e.recession?-0.006:0)));
  e.cumInflation *= (1 + e.inflation);
}
function creditScoreYear(a){
  if(a < 18) return;
  // scores naturally recover over time (old negative marks age off, responsible waiting helps)
  if(state.creditScore < 650) adjustCredit(rint(2,5));
  else if(state.creditScore < 800 && state.money >= 0) adjustCredit(1);
}
function applyBuilderLoan(){
  if(state.age < 18 || state.loans.some(l => l.type === 'Builder')) return;
  takeLoan('Builder', 500, 2, 0.08);
  state.money += 500;
  pushEntry(state.age, `${state.name} takes out a credit builder loan — paying it on time will help rebuild their credit.`, {});
  render();
}
function loanId(){ state.loanSeq++; return 'L' + state.loanSeq; }
function takeLoan(type, principal, term, apr, opts){
  const payment = principal <= 0 ? 0 : principal * apr / (1 - Math.pow(1+apr, -term));
  const loan = Object.assign({id:loanId(), type, principal, balance:principal, apr, term, yearlyPayment:Math.round(payment), yearsLeft:term, deferred:false}, opts||{});
  state.loans.push(loan);
  return loan;
}
function applyPersonalLoan(){
  if(state.age < 18 || state.bankrupt || state.done.personalLoan) return;
  state.done.personalLoan = true;
  if(state.creditScore < 500){ pushEntry(state.age, `${state.name} applies for a personal loan but gets denied.`, {happy:-2}); render(); return; }
  const amt = inflR(Math.max(1000, (state.creditScore-500)*20), 100);
  const apr = Math.max(0.06, Math.min(0.22, state.econ.rate + (850-state.creditScore)/4000));
  takeLoan('Personal', amt, 5, apr);
  state.money += amt;
  pushEntry(state.age, `${state.name} takes out a personal loan of ${fmt(amt)}.`, {happy:2});
  render();
}
function payoffLoan(id){
  const i = state.loans.findIndex(l => l.id === id); if(i < 0) return;
  const l = state.loans[i]; if(state.money < l.balance) return;
  state.money -= l.balance; state.loans.splice(i,1);
  pushEntry(state.age, `${state.name} pays off their ${l.type.toLowerCase()} loan in full.`, {happy:3});
  render();
}
function loansYear(a){
  let missed = false;
  state.loans.slice().forEach(l => {
    if(l.deferred || (l.startAge && state.age < l.startAge)) return;
    const interest = l.balance * l.apr;
    const due = Math.min(l.yearsLeft <= 1 ? Infinity : l.yearlyPayment, l.balance + interest);
    if(ensureCash(due)){
      state.money -= due;
      l.balance = Math.max(0, l.balance + interest - due);
      l.yearsLeft--;
      adjustCredit(l.type === 'Builder' ? 8 : 2);
      if(l.balance <= 1){
        state.loans = state.loans.filter(x => x.id !== l.id);
        if(l.type === 'Builder') adjustCredit(25);
      }
    } else {
      l.balance += interest;
      if(l.yearsLeft <= 1) l.yearlyPayment = Math.round(l.balance * (1 + l.apr));   // past due: the whole balance is owed
      missed = true;
    }
  });
  if(missed){ adjustCredit(-25); pushEntry(a, `${state.name} misses a loan payment this year — credit takes a hit.`, {}); }
}
function applyCard(){
  if(state.creditCard || state.age < 18 || state.bankrupt || state.done.cardApp) return;
  state.done.cardApp = true;
  if(state.creditScore < 500){ pushEntry(state.age, `${state.name} applies for a credit card but gets denied.`, {happy:-2}); render(); return; }
  const limit = inflR(Math.max(500, Math.round((state.creditScore-500)*15/100)*100), 100);

        threads().forEach(t => { if(t.key === 'dropout' && b.cofounder && t.data.rel === b.cofounder) t.data.sold = true; });

        state.business = null; pushEntry(state.age, `${n} sells ${nm} to a rival for ${fmt(offer)}${mine < offer ? ', taking home ' + fmt(mine) + ' for their share' : ''}.`, {money:mine, happy:8}); }},
      {label:"Keep building it", run:() => pushEntry(state.age, `${n} turns down the buyout offer.`, {happy:1})},
    ]);

    ]);

    presentCustom(`A scathing review of ${n}'s business is going viral.`, [

      {label:"Fire back at the reviewer", run:() => { b.reputation = clampRep(b.reputation - 12); pushEntry(state.age, `${n} argues with the reviewer online. It goes badly.`, {happy:-3}); }},
      {label:"Ignore it", run:() => { b.reputation = clampRep(b.reputation - 5); pushEntry(state.age, `${n} lets the bad review blow over.`, {}); }},
    ]);
  } else if(kind === 'poach'){
    const counter = inflR(15000, 500);
    presentCustom(`A competitor is trying to poach ${n}'s best employee.`, [
      {label:`Make a counteroffer (${fmt(counter)})`, run:() => { b.morale = clampRep(b.morale + 4); pushEntry(state.age, `${n} keeps their star employee with a raise.`, {money:-counter}); }},
      {label:"Let them go", run:() => { b.employees = Math.max(0, b.employees - 1); b.morale = clampRep(b.morale - 5); pushEntry(state.age, `${n}'s best employee leaves for a competitor.`, {happy:-2}); }},
    ]);
  } else if(kind === 'strike'){
    presentCustom(`Fed up with conditions, ${n}'s staff threaten to strike.`, [
      {label:"Raise wages", run:() => { b.wages = 'high'; b.morale = clampRep(b.morale + 25); pushEntry(state.age, `${n} gives the staff a raise and the strike is called off.`, {}); }},
      {label:"Refuse and ride it out", run:() => { const loss = Math.round(b.lastRevenue * 0.25 / 100) * 100; b.morale = clampRep(b.morale - 10); pushEntry(state.age, `The staff walk out, costing the business ${fmt(loss)}.`, {money:-loss, happy:-4}); }},

    ]);

}

function fileBankruptcy(ok){
  if(state.money > -3000 || state.bankrupt) return;
  if(ok !== true) return askConfirm("File for bankruptcy? Your credit will be wrecked for years.", "File", () => fileBankruptcy(true));
  state.money = 0;
  declareBankruptcy();
  render();
}
function emergencyYear(a){
  if(a < 18 || Math.random() >= 0.08) return;
  const sev = pick(['medical','car','home','family']);
  const cost = inflR(rint(500,4000) * (sev === 'medical' ? 3 : 1), 10);
  let covered = 0;
  if(sev === 'medical' && state.insurance.health) covered = 0.8;
  if(sev === 'car' && state.insurance.auto && state.assets.some(x => x.category === 'Cars')) covered = 0.8;
  if(sev === 'home' && state.insurance.home && state.assets.some(x => x.category === 'Homes')) covered = 0.8;
  const out = Math.round(cost * (1 - covered));
  const msgs = {medical:'a medical emergency', car:'a car breakdown', home:'a home repair emergency', family:'a family emergency'};
  pushEntry(a, `${state.name} deals with ${msgs[sev]}${covered > 0 ? ', largely covered by insurance' : ''}, costing ${fmt(out)}.`, {money:-out, happy:-3});
}
function negotiateRaise(){
  if(!state.job || state.done.negotiate) return;

const lottoCost = () => inflR(20, 1);

const LIFESTYLES = {
  frugal:{label:'Frugal', mult:0.7, rent:0.8, happy:-2, blurb:'cheap rent, cooking at home, few treats'},
  comfortable:{label:'Comfortable', mult:1, rent:1, happy:0, blurb:'a normal life'},
  lavish:{label:'Lavish', mult:1.9, rent:1.6, happy:3, blurb:'a nice place, eating out, the good stuff'},
};
function setLifestyle(k){ state.lifestyle = k; renderPanel(); }
// a spouse brings in their own income after tax until they retire
function spouseIncome(sp){
  if(sp.age >= 65) return Math.round(inflR(14000, 100) * 0.92);
  if(sp.baseSalary === undefined) sp.baseSalary = rint(15, 85) * 1000;
  return Math.round(sp.baseSalary * state.econ.cumInflation * 0.78);
}
function livingEstimate(){
  const cum = state.econ.cumInflation, L = LIFESTYLES[state.lifestyle] || LIFESTYLES.comfortable, sp = hasRel('Spouse');
  const own = state.assets.some(x => x.category === 'Homes' && !x.rental), kids = state.relationships.filter(r => r.type === 'Child' && r.age < 18).length;
  return Math.round((own ? 0 : 13000 * L.rent * (sp ? 1.3 : 1)) * cum + 11000 * cum * L.mult * (sp ? 1.6 : 1) + kids * 8000 * cum * Math.sqrt(L.mult));
}
// sell investments to cover a negative balance before debts get out of hand
function coverWithInvestments(a){
  let sold = 0;
  for(const k in state.portfolio){
    if(state.money >= 0) break;
    const units = state.portfolio[k]; if(!(units > 0)) continue;
    const before = state.money; execSell(k, units); sold += state.money - before;
  }
  if(sold > 0) pushEntry(a, `${state.name} sells ${fmt(sold)} of investments to cover bills.`, {happy:-2});
}
function yearlyFinances(a){
  const e = state.edu, econ = state.econ;
  let income = 0;
  const jailed = !!state.crime.prison;
  if(a >= 8 && a < 18 && !jailed) income += Math.round(300 * econ.cumInflation);
  if(state.job){
    // retirement contributions come out before tax, and the employer matches half of them up to 3% of salary
    const R = state.retirement, contrib = Math.round(state.job.salary * R.pct), match = Math.round(Math.min(contrib, state.job.salary * 0.06) / 2);
    const taxable = state.job.salary - contrib;
    income += Math.round(taxable - incomeTax(taxable));
    if(contrib > 0){ R.balance += contrib + match; R.contributed += contrib; }
  }
  retirementYear();
  income += rentalsYear(a);
  income += businessYear(a);
  if(a >= 65 && !state.job && !state.retired) retire(true);
  if(state.retired && state.pension > 0){
    income += Math.round(state.pension * 0.92);                          // after a modest tax
    state.pension = Math.round(state.pension * (1 + Math.max(0, yrInfl())));   // yearly cost-of-living adjustment
  }
  if(state.savings > 0) state.savings += state.savings * savingsRate();
  state.cds = state.cds.filter(cd => {
    cd.value *= (1 + cd.rate); cd.yearsLeft--;
    if(cd.yearsLeft > 0) return true;
    state.savings += cd.value;
    pushEntry(a, `A ${cd.term}-year CD matures and ${fmt(cd.value)} lands in ${state.name}'s savings.`, {happy:2});
    return false;
  });
  checkGoal(a);

  let expenses = 0;
  const independent = a >= 20 || !!state.job;
  if(a >= 18 && independent && !state.movedOut){
    state.movedOut = true;
    pushEntry(a, `${state.name} moves out on their own — rent and bills are now their responsibility.`, {});
  }
  const cum = econ.cumInflation, L = LIFESTYLES[state.lifestyle] || LIFESTYLES.comfortable;
  const spouse = state.relationships.find(r => r.type === 'Spouse');
  const kids = state.relationships.filter(r => r.type === 'Child' && r.age < 18).length;
  let kidCost = 0, studentShort = 0;
  if(spouse && !jailed) income += spouseIncome(spouse);
  if(a >= 18 && independent && !jailed){
    const ownsHome = state.assets.some(x => x.category === 'Homes' && !x.rental);
    const student = (e.program || e.gradAge === a) && !spouse;
    if(student){
      expenses += Math.round(9000 * cum * L.mult);                         // dorms, meal plans, shared apartments
    } else {
      if(!ownsHome) expenses += Math.round(13000 * cum * L.rent * (spouse ? 1.3 : a < 26 && !hasRel('Partner') ? 0.6 : 1));   // young singles share with roommates
      expenses += Math.round(11000 * cum * L.mult * (spouse ? 1.6 : 1));   // food, transport, utilities and everything else
    }
    kidCost = Math.round(kids * 8000 * cum * Math.sqrt(L.mult));
    expenses += kidCost;
    if(state.insurance.health) expenses += Math.round(1200 * cum);
    if(state.insurance.auto && state.assets.some(x => x.category === 'Cars')) expenses += Math.round(900 * cum);
    if(state.insurance.home && ownsHome) expenses += Math.round(800 * cum);
    if(L.happy) applyDelta({happy: L.happy});
  }
  if(a >= 65) expenses = Math.round(expenses * 0.85);                     // downsized, simpler living
  expenses = Math.round(expenses * (state.world.costMult || 1));
  let net = income - expenses;
  // students cover a shortfall with student loans instead of going broke
  if((e.program || e.gradAge === a) && net < 0 && state.money + state.savings + net < 0){
    studentShort = Math.round(-(state.money + state.savings + net));
    let sl = state.loans.find(l => l.type === 'Student' && (e.program ? l.deferred : !l.deferred));
    if(!sl) sl = takeLoan('Student', 0, 10, Math.max(0.045, econ.rate - 0.005), e.program ? {deferred:true} : {});
    sl.principal += studentShort; sl.balance += studentShort;
    if(!sl.deferred) sl.yearlyPayment = Math.round(sl.balance * sl.apr / (1 - Math.pow(1 + sl.apr, -Math.max(1, sl.yearsLeft))));
    net += studentShort;
  }
  if(income || expenses){
    const bits = [];
    if(kidCost) bits.push(fmt(kidCost) + ' on the kids');
    if(studentShort) bits.push(fmt(studentShort) + ' borrowed in student loans');
    pushEntry(a, `${state.name} brings in ${fmt(income)} and spends ${fmt(expenses)} on living costs${bits.length ? ' (' + bits.join(', ') + ')' : ''}.`, {money:net});
  }
  state.lastAutoSaved = 0; state.lastAutoInvested = 0;
  if(state.autoSave > 0 && net > 0 && state.money > 0){
    const amt = Math.min(state.money, Math.round(net * state.autoSave));
    if(amt > 0){ state.money -= amt; state.savings += amt; state.lastAutoSaved = amt; checkGoal(a); }
  }

  if(state.autoInvest > 0 && net > 0 && state.money > 0 && a >= 18){
    const amt = Math.min(state.money, Math.round(net * state.autoInvest));
    if(amt >= 10 && execBuy('IDXF', amt)) state.lastAutoInvested = amt;
  }
  if(state.bankrupt && a >= state.bankruptUntilAge) state.bankrupt = false;
  if(state.money < 0) coverWithInvestments(a);
  if(net < 0 && !e.program && state.lifestyle !== 'frugal' && !state.tipFrugal && state.money < 0){
    state.tipFrugal = true;
    pushEntry(a, `Money is tight. Switching to a frugal lifestyle in the Bank tab would cut ${state.name}'s living costs by about a third.`, {});
  }
  // unpaid bills go to collections as a repayment plan; bankruptcy only when the debt truly outgrows income
  if(state.money <= -3000 * econ.cumInflation && !state.bankrupt){
    const owed = Math.round(-state.money);
    const unsecured = owed + state.loans.filter(l => ['Personal','Collections','Business'].includes(l.type)).reduce((t, l) => t + l.balance, 0) + (state.creditCard ? state.creditCard.balance : 0);
    const yearlyIncome = Math.max(income, 30000 * econ.cumInflation);
    if(unsecured < yearlyIncome * 1.5){
      state.money = 0;
      const prev = state.loans.find(l => l.type === 'Collections');
      if(prev){ prev.balance += owed; prev.principal += owed; prev.yearsLeft = 5; prev.yearlyPayment = Math.round(prev.balance * prev.apr / (1 - Math.pow(1 + prev.apr, -5))); }
      else takeLoan('Collections', owed, 5, 0.16, {});
      adjustCredit(-25);
      pushEntry(a, `${state.name} falls behind on bills, and ${fmt(owed)} goes to collections on a five-year repayment plan.`, {happy:-4});
    }
  }
  if(state.money <= -20000 * econ.cumInflation && !state.bankrupt){
    state.creditCard = null;
    state.loans = state.loans.filter(l => l.type === 'Mortgage' || l.type === 'Car' || l.type === 'Student');
    state.money = 0;
    adjustCredit(-130);
    state.bankrupt = true; state.bankruptUntilAge = a + 4; state.bankruptcies++;
    pushEntry(a, `${state.name}'s debts spiral out of control, forcing bankruptcy. Credit is wrecked for years.`, {happy:-15});
  }
}

function clampRep(v){ return Math.max(0, Math.min(100, Math.round(v))); }
function repTier(r){ return r >= 85 ? 'Beloved' : r >= 65 ? 'Liked' : r >= 40 ? 'Neutral' : r >= 20 ? 'Disliked' : 'Toxic'; }
function fmtFollowers(n){
  if(n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if(n >= 1000) return (n/1000).toFixed(1) + 'K';
  return Math.round(n).toString();
}
function syncFollowers(){
  const sm = state.social; let t = 0;
  for(const k in sm.platforms) t += sm.platforms[k];
  sm.followers = t;
}
function topPlatform(){
  const P = state.social.platforms; let best = null;
  for(const k in P) if(best === null || P[k] > P[best]) best = k;
  return best;
}
function scalePlat(k, pct){
  const P = state.social.platforms;
  if(P[k] === undefined) return 0;
  const before = P[k];
  P[k] = Math.max(0, Math.round(before * (1 + pct)));
  return P[k] - before;
}
function earnSocial(n){ state.social.totalEarned += n; }
function bestHobby(){
  let best = null;
  for(const k in state.hobbies){
    const lv = state.hobbies[k].level;
    if(lv > 0 && (!best || lv > best.level)){
      const h = HOBBY_LIST.find(x => x.key === k);
      best = {key:k, name: h ? h.name : k, level:lv};
    }
  }
  return best;
}
function affOf(t, p){ return t.aff[p] !== undefined ? t.aff[p] : 1; }
function stxt(s, platKey){

  return s.replace(/\{n\}/g, state.name).replace(/\{p\}/g, PLATFORMS[platKey].name).replace(/\{h\}/g, b ? b.name.toLowerCase() : "hobby");

function postBlock(t, platKey){
  if(t.req && !t.req(platKey)) return t.reqText;
  if(t.cost && state.money < inflR(t.cost, 10)) return "needs " + fmt(inflR(t.cost, 10));
  return "";
}
function joinPlatform(k){
  const sm = state.social;
  if(state.age < 13 || !PLATFORMS[k] || sm.platforms[k] !== undefined) return;
  sm.account = true;
  sm.platforms[k] = rint(5,30);
  if(!sm.sel) sm.sel = k;
  syncFollowers();
  pushEntry(state.age, state.name + " joins " + PLATFORMS[k].name + ".", {happy:2});

function postSocial(typeKey, platKey){
  const sm = state.social;
  if(!sm.account) return;
  platKey = platKey || sm.sel || Object.keys(sm.platforms)[0];
  if(!platKey || sm.platforms[platKey] === undefined) return;
  const t = POST_TYPES.find(x => x.key === (typeKey || "vlog"));
  if(!t || postBlock(t, platKey)) return;
  const count = state.done.postCount || 0;
  if(count >= POST_LIMIT) return;
  state.done.postCount = count + 1;

  const plat = PLATFORMS[platKey], f = sm.platforms[platKey];
  const trendMult = sm.trend === t.key ? 1.5 : 1;
  const appeal = t.appeal() + (sm.gear ? 10 : 0);
  const base = Math.max(3, Math.round((f*0.02 + appeal*1.5 + rint(-15,35)) * plat.growth * affOf(t, platKey) * trendMult * (sm.verified ? 1.1 : 1) * (t.mult || 1)));
  const viralChance = (0.02 + t.viral + plat.viral + (sm.reputation > 70 ? 0.02 : 0) + (sm.verified ? 0.01 : 0)) * (trendMult > 1 ? 1.4 : 1);
  const backfireChance = (t.risk + plat.risk) * (sm.reputation < 30 ? 2 : sm.reputation > 75 ? 0.6 : 1);

  const r = Math.random(), delta = {};
  if(t.cost) delta.money = -inflR(t.cost, 10);
  let kind, gain, repDelta = 0;
  if(r < viralChance){
    kind = "viral"; gain = base * rint(8,30); repDelta = rint(1,6); delta.happy = 8;
  } else if(r < viralChance + backfireChance){
    kind = "bad"; gain = -(Math.round(f*0.05) + rint(5,60));
    repDelta = -rint(5, (t.key === "hottake" || t.key === "challenge") ? 20 : 14); delta.happy = -5;
  } else if(r < viralChance + backfireChance + 0.12){
    kind = "flop"; gain = Math.round(base*0.15); delta.happy = -1;
  } else {
    kind = "good"; gain = base; repDelta = rint(-1,2) + (t.repGood || 0); delta.happy = 2;
  }
  let text = stxt(pick(t.txt[kind]), platKey);
  if(t.pays){
    const pay = Math.max(50, Math.round(f*0.02*plat.spons*(0.5 + Math.random())));
    delta.money = (delta.money || 0) + pay; earnSocial(pay);
    repDelta -= rint(1,3);
    if(Math.random() < 0.08){ repDelta -= rint(5,10); text += " Followers notice it was an undisclosed ad."; }
    text += " It pays " + fmt(pay) + ".";
  }
  if(t.injury && kind === "bad" && Math.random() < 0.6){ delta.health = -rint(4,12); text += " It leaves a few bruises too."; }
  sm.platforms[platKey] = Math.max(0, f + gain);
  sm.reputation = clampRep(sm.reputation + repDelta);
  syncFollowers();
  text += " (" + (gain >= 0 ? "+" : "-") + fmtFollowers(Math.abs(gain)) + " followers)";
  pushEntry(state.age, text, delta);
  render();
}

function makeOffer(){

  if(r < 0.60) return {id, kind:"collab", label:"Collab invite", body:"A bigger creator wants to team up. Big audience boost, some drama risk.", pay:0};

function acceptOffer(id){
  const sm = state.social;

  const n = state.name, top = topPlatform();
  if(o.kind === "brand"){

    earnSocial(o.pay); sm.reputation = clampRep(sm.reputation - rint(8,20));

      for(const k in sm.platforms) scalePlat(k, -0.15);

    if(Math.random() < 0.10){ sm.reputation = clampRep(sm.reputation - 8); msg += " Some drama follows."; }
    syncFollowers();
    pushEntry(state.age, msg, {happy:5});

    for(const k in sm.platforms) scalePlat(k, 0.08);
    sm.reputation = clampRep(sm.reputation + rint(3,6));
    syncFollowers();
    pushEntry(state.age, n + " does a well-received podcast interview.", {happy:4});

    sm.reputation = clampRep(sm.reputation + rint(8,15));

  }
  render();
}

function socialMediaYear(a){
  state.done.postCount = 0;
  const sm = state.social;
  if(!sm.account) return;
  sm.reputation = clampRep(sm.reputation + (50 - sm.reputation) * 0.05);
  for(const k in sm.platforms) sm.platforms[k] = Math.max(0, Math.round(sm.platforms[k] * 0.97));
  syncFollowers();
  if(sm.canceled && a >= sm.canceledUntilAge) sm.canceled = false;
  sm.trend = Math.random() < 0.7 ? pick(POST_TYPES).key : null;

  const P = sm.platforms;
  let gross = 0;
  if(P.vid !== undefined && P.vid >= 1000) gross += P.vid * 0.015;
  if(P.live !== undefined && P.live >= 500) gross += P.live * 0.012;
  if(P.clip !== undefined && P.clip >= 10000) gross += P.clip * 0.004;
  if(sm.merch) gross += sm.followers * 0.01 * (sm.reputation / 60);
  if(sm.canceled) gross *= 0.3;
  gross = Math.round(gross);
  const fee = sm.pr ? mediaCost("prFee") : 0;
  if(gross > 0 || fee > 0){
    if(gross > 0) earnSocial(gross);
    pushEntry(a, gross > 0
      ? state.name + "'s channels pay out " + fmt(gross) + " in creator income" + (fee ? ", minus " + fmt(fee) + " for the PR manager." : ".")
      : state.name + " pays " + fmt(fee) + " for the PR manager.", {money: gross - fee});
  }

function admitChance(c){

  const p = 0.5 + (e.gpa - c.minGpa) / 22 + (s.smarts - 60) / 200 + extra;

  if(c.key === 'state') return g >= 90 ? 1 : g >= 82 ? 0.5 : g >= 72 ? 0.25 : 0;
  if(c.key === 'private') return g >= 90 ? 0.6 : g >= 80 ? 0.35 : 0.1;
  return poor ? 0.75 : g >= 92 ? 0.3 : 0.1;

// ---------- Retirement & pension ----------
// Long lives need a plan for the later decades: retire from 60, auto-retire at 70, and a pension that tracks the cost of living.
function pensionFor(){
  const floor = 16000 * state.econ.cumInflation;                         // basic state pension, indexed to living costs
  const earned = state.peakSalary * 0.40 * Math.min(1, state.workYears / 35);   // what a full career adds
  return Math.round(Math.max(floor, floor * 0.6 + earned) / 100) * 100;
}
function retire(silent){
  if(state.retired || state.age < 60) return;
  leaveRoleFor('retirement');
  const early = state.age < 65;
  const cut = early ? 1 - 0.06 * (65 - state.age) : 1;                    // taking it early costs 6% per year
  state.retired = true;
  const j = state.job;
  if(j){ convertCoworkersToFriends(); state.job = null; }
  state.pension = Math.round(pensionFor() * cut / 100) * 100;
  pushEntry(state.age, `${state.name} retires${early ? ' early' : ''}${j ? ' from their job as ' + j.title : ''}, settling into a pension of ${fmt(state.pension)} a year.`, {happy:8});
  if(!silent) render();
}

function workYear(a){
  const j = state.job;
  const boost = state.boost; state.boost = false;
  if(!j) return;
  j.years++; state.workYears++;
  j.salary = Math.round(j.salary * (1 + Math.max(0, yrInfl()) * 0.9 + wfx().raise + trackFx(j.track).pay * 0.3) / 100) * 100;   // wages track prices and the times
  if((state.world.laws || []).includes('fourDay')) applyDelta({happy:1});
  state.peakSalary = Math.max(state.peakSalary, j.salary);
  if(a >= 70 && j.track !== 'Politics'){ retire(true); return; }           // elected officials serve out their terms
  const track = CAREERS[j.track], rank = track[j.rank];
  const stressHealth = rank.stress >= 70 ? -3 : rank.stress >= 50 ? -2 : rank.stress >= 30 ? -1 : 0;
  const stressHappy = rank.stress >= 70 ? -2 : rank.stress >= 50 ? -1 : 0;
  if(stressHealth || stressHappy) applyDelta({health:stressHealth, happy:stressHappy});
  const info = TRACK_INFO[j.track] || {};
  if(info.maxAge && a >= info.maxAge){
    convertCoworkersToFriends(); state.job = null;
    pushEntry(a, `${state.name}'s body can't keep up any more, and they retire from ${j.track.toLowerCase()} as ${rank.title}.`, {happy:-4});
    return;
  }
  if(info.risk && Math.random() < info.risk * (trackFx(j.track).danger ? 2.5 : 1)){
    const c = addCondition('bone', a);
    pushEntry(a, c ? `${state.name} is injured on the job as ${rank.title} and breaks a bone.` : `${state.name} is hurt on the job.`, {health:-6, happy:-3});
  }
  if(j.track === 'Military' && !state.mil && Math.random() < 0.15){
    const bonus = Math.round(j.salary * 0.15);
    pushEntry(a, `${state.name} is deployed overseas for part of the year.`, {money:bonus, happy:-4, family:-3});
  }
  if(info.elect && j.rank >= 1 && Math.random() < 0.06){
    pushEntry(a, `${state.name} is caught up in a political scandal.`, {happy:-6, rep:-10, image:-10});
    POL().scandal = a; POL().approval = Math.max(0, POL().approval - 15);
    if(Math.random() < 0.35){ convertCoworkersToFriends(); state.job = null; pushEntry(a, `${state.name} is forced to resign as ${rank.title}.`, {happy:-8}); return; }
  }

  if(!info.elect && j.track !== 'Military' && Math.random() < (state.econ.recession ? 0.09 : 0.03) + (hasMyTrait('Flaky') ? 0.02 : 0) + (state.world.fx.layoffs ? 0.04 : 0) + wfx().layoffs + trackFx(j.track).layoff){
    convertCoworkersToFriends();
    state.job = null;
    pushEntry(a, `${state.name} is laid off from their job as ${rank.title}.`, {happy:-6});
    return;
  }

  if(j.rank < track.length - 1 && !info.elect){              // politicians climb by winning elections, not promotions
    const next = track[j.rank + 1];
    const eligible = !rankGap(next, j.track);
    const chance = (rank.promo + state.stats.smarts/800 + (boost ? 0.2 : 0) + eduPromoBonus(j.track) + (hasMyTrait('Ambitious') ? 0.04 : 0) + (CAREER_FAME[j.track] && (TRACK_INFO[j.track] || {}).star ? state.fame.level / 600 : 0)) * (state.econ.recession ? 0.5 : 1);
    if(eligible && Math.random() < chance){
      j.rank++; j.title = j.track === 'Military' && state.mil ? milTitle(j.rank) : next.title;
      j.salary = Math.max(Math.round(j.salary * 1.12 / 100) * 100, startingSalary(j.track, j.rank));
      pushEntry(a, (TRACK_INFO[j.track] || {}).elect ? `${state.name} wins the election and becomes ${next.title} — salary now ${fmt(j.salary)}.` : `${state.name} earns a promotion to ${next.title} — salary now ${fmt(j.salary)}.`, {happy: (TRACK_INFO[j.track] || {}).star ? 12 : 6});
      return;
    }
  }
  if(Math.random() < (state.econ.recession ? 0.05 : 0.18)){
    const bonus = Math.round(j.salary * (0.03 + Math.random()*0.07));
    pushEntry(a, `${state.name} receives a year-end bonus of ${fmt(bonus)}.`, {money:bonus, happy:3});
  }
}

    delta = {money:-actCost(x)};
    if(Math.random() < 0.85){ delta.looks = rint(8, 14); delta.happy = 5; text += ' and loves the result.'; }

function practiceHobby(key){
  const h = HOBBY_LIST.find(x => x.key === key);
  if(!h || state.done['hob_'+key] || state.age < h.minAge || state.money < hobCost(h)) return;
  state.done['hob_'+key] = true;
  if(h.cost) state.money -= hobCost(h);
  if(!state.hobbies[key]) state.hobbies[key] = {level:0};
  const hb = state.hobbies[key];
  const gain = Math.max(2, Math.round(9 * (1 - hb.level/115)));
  const wasLevel = hb.level;
  hb.level = Math.min(100, hb.level + gain); hb.last = state.age;
  applyDelta(h.stat);
  if(h.gamble){
    const won = Math.random() < 0.35 + hb.level / 250, amt = inflR(rint(1, 8) * 100 * (1 + hb.level / 50), 10);
    pushEntry(state.age, won ? `${state.name} has a good night at the poker table and wins ${fmt(amt)}.` : `${state.name} has a rough night at the poker table and loses ${fmt(amt)}.`, {money: won ? amt : -amt, happy: won ? 3 : -2});

  const milestone = hobbyTier(hb.level) !== hobbyTier(wasLevel);

function activateStudentLoan(){
  const sl = state.loans.find(l => l.type === 'Student' && l.deferred);
  if(!sl) return;
  if(sl.balance > 0){
    const term = sl.balance > 100000 * state.econ.cumInflation ? 20 : 10;     // big balances get a longer repayment plan
    sl.deferred = false; sl.term = term; sl.yearsLeft = term; sl.startAge = state.age + 1;   // a year's grace after leaving school
    sl.yearlyPayment = Math.round(sl.balance * sl.apr / (1 - Math.pow(1+sl.apr, -term)));
  } else {
    state.loans = state.loans.filter(l => l.id !== sl.id);
  }
}

  const chance = Math.min(92, 40 + state.stats.smarts*0.3 + state.stats.looks*0.1 + (relevantDegree(trackName) ? 8 : 0) + Math.min(2, ED().internships || 0) * 4 + (state.world.fx.hiring ? 10 : 0) - (state.world.fx.layoffs ? 8 : 0) + wfx().hiring + trackFx(trackName).hire + networkPull(trackName) + (isVeteran() && ['Law Enforcement','Firefighting','Aviation','Politics'].includes(trackName) ? 12 : 0)) * (felonyCount() ? 0.55 : priorCount() ? 0.85 : 1);

  render();
