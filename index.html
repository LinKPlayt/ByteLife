function postSocial(typeKey, platKey){
  const sm = state.social;
  if(!sm.account) return;
  platKey = platKey || sm.sel || Object.keys(sm.platforms)[0];
  if(!platKey || sm.platforms[platKey] === undefined) return;
  const t = POST_TYPES.find(x => x.key === (typeKey || "vlog"));
  if(!t || postBlock(t, platKey)) return;
  const count = state.done.postCount || 0;
  if(count >= POST_LIMIT) return;
  state.done.postCount = count + 1;

  const plat = PLATFORMS[platKey], f = sm.platforms[platKey];
  const trendMult = sm.trend === t.key ? 1.5 : 1;
  const appeal = t.appeal() + (sm.gear ? 10 : 0);
  const base = Math.max(3, Math.round((f*0.02 + appeal*1.5 + rint(-15,35)) * plat.growth * affOf(t, platKey) * trendMult * (sm.verified ? 1.1 : 1) * (t.mult || 1)));
  const viralChance = (0.02 + t.viral + plat.viral + (sm.reputation > 70 ? 0.02 : 0) + (sm.verified ? 0.01 : 0)) * (trendMult > 1 ? 1.4 : 1);
  const backfireChance = (t.risk + plat.risk) * (sm.reputation < 30 ? 2 : sm.reputation > 75 ? 0.6 : 1);

  const r = Math.random(), delta = {};
  if(t.cost) delta.money = -inflR(t.cost, 10);
  let kind, gain, repDelta = 0;
  if(r < viralChance){
    kind = "viral"; gain = base * rint(8,30); repDelta = rint(1,6); delta.happy = 8;
  } else if(r < viralChance + backfireChance){
    kind = "bad"; gain = -(Math.round(f*0.05) + rint(5,60));
    repDelta = -rint(5, (t.key === "hottake" || t.key === "challenge") ? 20 : 14); delta.happy = -5;
  } else if(r < viralChance + backfireChance + 0.12){
    kind = "flop"; gain = Math.round(base*0.15); delta.happy = -1;
  } else {
    kind = "good"; gain = base; repDelta = rint(-1,2) + (t.repGood || 0); delta.happy = 2;
  }
  let text = stxt(pick(t.txt[kind]), platKey);
  if(t.pays){
    const pay = Math.max(50, Math.round(f*0.02*plat.spons*(0.5 + Math.random())));
    delta.money = (delta.money || 0) + pay; earnSocial(pay);
    repDelta -= rint(1,3);
    if(Math.random() < 0.08){ repDelta -= rint(5,10); text += " Followers notice it was an undisclosed ad."; }
    text += " It pays " + fmt(pay) + ".";
  }
  if(t.injury && kind === "bad" && Math.random() < 0.6){ delta.health = -rint(4,12); text += " It leaves a few bruises too."; }
  sm.platforms[platKey] = Math.max(0, f + gain);
  sm.reputation = clampRep(sm.reputation + repDelta);
  syncFollowers();
  text += " (" + (gain >= 0 ? "+" : "-") + fmtFollowers(Math.abs(gain)) + " followers)";
  pushEntry(state.age, text, delta);
  render();
}

  const pay = Math.max(100, Math.round(f * 0.04 * (0.6 + Math.random()*0.8)));
  if(r < 0.40) return {id, kind:"brand", brand, label: brand + " brand deal", body:"Pays " + fmt(pay) + ". A small authenticity cost.", pay};
  if(r < 0.60) return {id, kind:"collab", label:"Collab invite", body:"A bigger creator wants to team up. Big audience boost, some drama risk.", pay:0};
  if(r < 0.75) return {id, kind:"podcast", label:"Podcast interview", body:"Free exposure and a reputation lift.", pay:0};
  if(r < 0.87) return {id, kind:"charity", label:"Charity livestream", body:"Costs " + fmt(mediaCost("charity")) + " to host. Big reputation gain.", pay:0};
  if(f >= 5000) return {id, kind:"shady", brand, label: brand + ", a questionable sponsor", body:"Pays " + fmt(pay*3) + ", but it could blow up in your face.", pay: pay*3};
  return {id, kind:"brand", brand, label: brand + " brand deal", body:"Pays " + fmt(pay) + ". A small authenticity cost.", pay};
}

function socialMediaYear(a){
  state.done.postCount = 0;
  const sm = state.social;
  if(!sm.account) return;
  sm.reputation = clampRep(sm.reputation + (50 - sm.reputation) * 0.05);
  for(const k in sm.platforms) sm.platforms[k] = Math.max(0, Math.round(sm.platforms[k] * 0.97));
  syncFollowers();
  if(sm.canceled && a >= sm.canceledUntilAge) sm.canceled = false;
  sm.trend = Math.random() < 0.7 ? pick(POST_TYPES).key : null;

  const P = sm.platforms;
  let gross = 0;
  if(P.vid !== undefined && P.vid >= 1000) gross += P.vid * 0.015;
  if(P.live !== undefined && P.live >= 500) gross += P.live * 0.012;
  if(P.clip !== undefined && P.clip >= 10000) gross += P.clip * 0.004;
  if(sm.merch) gross += sm.followers * 0.01 * (sm.reputation / 60);
  if(sm.canceled) gross *= 0.3;
  gross = Math.round(gross);
  const fee = sm.pr ? mediaCost("prFee") : 0;
  if(gross > 0 || fee > 0){
    if(gross > 0) earnSocial(gross);
    pushEntry(a, gross > 0
      ? state.name + "'s channels pay out " + fmt(gross) + " in creator income" + (fee ? ", minus " + fmt(fee) + " for the PR manager." : ".")
      : state.name + " pays " + fmt(fee) + " for the PR manager.", {money: gross - fee});
  }

  if(!sm.verified && sm.followers >= 100000 && sm.reputation >= 50 && !sm.canceled){
    sm.verified = true; pushEntry(a, state.name + " earns a verified badge.", {happy:6});
  }
  if(sm.verified && (sm.reputation < 25 || sm.canceled)) sm.verified = false;
  if(!sm.influencer && sm.followers >= 50000 && sm.reputation >= 40 && !sm.canceled){
    sm.influencer = true; pushEntry(a, state.name + " officially becomes a recognized influencer!", {happy:10});
  }
  if(sm.influencer && (sm.followers < 20000 || sm.canceled)) sm.influencer = false;

  if(sm.followers >= 300 && Math.random() < 0.35) socialDrama(a);

  const cancelChance = sm.reputation < 20 ? (sm.pr ? 0.12 : 0.3) : 0;
  if(!sm.canceled && Math.random() < cancelChance){
    for(const k in sm.platforms) sm.platforms[k] = Math.round(sm.platforms[k] * 0.6);
    syncFollowers();
    sm.influencer = false; sm.verified = false; sm.canceled = true; sm.canceledUntilAge = a + 3;
    pushEntry(a, state.name + " gets canceled online after major backlash. Followers and sponsors vanish.", {happy:-15});
  }

  sm.offers = [];
  if(!sm.canceled && sm.followers >= 1000){
    const n = sm.followers >= 100000 ? rint(2,3) : sm.followers >= 10000 ? rint(1,2) : rint(0,1);
    for(let i = 0; i < n + (sm.pr ? 1 : 0); i++) sm.offers.push(makeOffer());
  }
}

// ---------- Retirement & pension ----------
// Long lives need a plan for the later decades: retire from 60, auto-retire at 70, and a pension that tracks the cost of living.
function pensionFor(){
  const floor = 11000 * state.econ.cumInflation;                         // basic state pension, indexed to living costs
  const earned = state.peakSalary * 0.40 * Math.min(1, state.workYears / 35);   // what a full career adds
  return Math.round(Math.max(floor, floor * 0.6 + earned) / 100) * 100;
}
function retire(silent){
  if(state.retired || state.age < 60) return;
  const early = state.age < 65;
  const cut = early ? 1 - 0.06 * (65 - state.age) : 1;                    // taking it early costs 6% per year
  state.retired = true;
  const j = state.job;
  if(j){ convertCoworkersToFriends(); state.job = null; }
  state.pension = Math.round(pensionFor() * cut / 100) * 100;
  pushEntry(state.age, `${state.name} retires${early ? ' early' : ''}${j ? ' from their job as ' + j.title : ''}, settling into a pension of ${fmt(state.pension)} a year.`, {happy:8});
  if(!silent) render();
}

function workYear(a){
  const j = state.job;
  const boost = state.boost; state.boost = false;
  if(!j) return;
  j.years++; state.workYears++;
  j.salary = Math.round(j.salary * (1 + Math.max(0, state.econ.inflation) * 0.9) / 100) * 100;   // wages track prices
  state.peakSalary = Math.max(state.peakSalary, j.salary);
  if(a >= 70){ retire(true); return; }
  const track = CAREERS[j.track], rank = track[j.rank];
  const stressHealth = rank.stress >= 70 ? -3 : rank.stress >= 50 ? -2 : rank.stress >= 30 ? -1 : 0;
  const stressHappy = rank.stress >= 70 ? -2 : rank.stress >= 50 ? -1 : 0;
  if(stressHealth || stressHappy) applyDelta({health:stressHealth, happy:stressHappy});

  if(Math.random() < (state.econ.recession ? 0.09 : 0.03)){
    convertCoworkersToFriends();
    state.job = null;
    pushEntry(a, `${state.name} is laid off from their job as ${rank.title}.`, {happy:-6});
    return;
  }

  if(j.rank < track.length - 1){
    const next = track[j.rank + 1];
    const eligible = state.age >= next.minAge && EDU_RANK[state.edu.level] >= EDU_RANK[next.edu] && state.stats.smarts >= next.minSmarts;
    const chance = (rank.promo + state.stats.smarts/800 + (boost ? 0.2 : 0) + (state.edu.level === 'Master' ? 0.05 : 0)) * (state.econ.recession ? 0.5 : 1);
    if(eligible && Math.random() < chance){
      j.rank++; j.title = next.title;
      j.salary = Math.max(Math.round(j.salary * 1.12 / 100) * 100, inflR(next.salary, 100));
      pushEntry(a, `${state.name} earns a promotion to ${next.title} — salary now ${fmt(j.salary)}.`, {happy:6});
      return;
    }
  }
  if(Math.random() < (state.econ.recession ? 0.05 : 0.18)){
    const bonus = Math.round(j.salary * (0.03 + Math.random()*0.07));
    pushEntry(a, `${state.name} receives a year-end bonus of ${fmt(bonus)}.`, {money:bonus, happy:3});
  }
}

  {key:'fishing', name:'Fishing', minAge:6, cost:0, stat:{happy:4,health:1}},
  {key:'gym', name:'Gym', minAge:13, cost:20, stat:{health:4,looks:2}},
  {key:'running', name:'Running', minAge:8, cost:0, stat:{health:5,happy:1}},
  {key:'photography', name:'Photography', minAge:10, cost:30, stat:{happy:3,smarts:2}, career:'Freelance Photographer'},
  {key:'music', name:'Music', minAge:8, cost:20, stat:{happy:4,smarts:1}, career:'Gigging Musician'},
  {key:'cooking', name:'Cooking', minAge:8, cost:25, stat:{happy:3,health:1}, career:'Private Chef'},
  {key:'art', name:'Art', minAge:6, cost:15, stat:{happy:3,looks:1}, career:'Commissioned Artist'},
  {key:'reading', name:'Reading', minAge:5, cost:0, stat:{smarts:4}},
  {key:'golf', name:'Golf', minAge:10, cost:60, stat:{happy:2,looks:1}},
  {key:'cars', name:'Cars', minAge:12, cost:40, stat:{smarts:2,happy:2}, career:'Custom Mechanic'},
  {key:'hiking', name:'Hiking', minAge:6, cost:0, stat:{health:4,happy:2}},
  {key:'traveling', name:'Traveling', minAge:16, cost:400, stat:{happy:6,smarts:1}},
  {key:'collecting', name:'Collecting', minAge:6, cost:50, stat:{happy:3}},

function hobbyLevel(key){ return (state.hobbies[key] && state.hobbies[key].level) || 0; }
function hobbyTier(lvl){ return lvl >= 90 ? 'Master' : lvl >= 70 ? 'Expert' : lvl >= 35 ? 'Skilled' : lvl > 0 ? 'Beginner' : 'Untried'; }
function practiceHobby(key){
  const h = HOBBY_LIST.find(x => x.key === key);
  if(!h || state.done['hob_'+key] || state.age < h.minAge || state.money < hobCost(h)) return;
  state.done['hob_'+key] = true;
  if(h.cost) state.money -= hobCost(h);
  if(!state.hobbies[key]) state.hobbies[key] = {level:0};
  const hb = state.hobbies[key];
  const gain = Math.max(2, Math.round(9 * (1 - hb.level/115)));
  const wasLevel = hb.level;
  hb.level = Math.min(100, hb.level + gain);
  applyDelta(h.stat);
  const milestone = hobbyTier(hb.level) !== hobbyTier(wasLevel);
  pushEntry(state.age, milestone
    ? `${state.name} keeps at ${h.name.toLowerCase()} and levels up to ${hobbyTier(hb.level)}.`
    : `${state.name} spends time on ${h.name.toLowerCase()}.`, {});
  render();
}
const compFee = () => inflR(100, 5);
function enterCompetition(key){
  const h = HOBBY_LIST.find(x => x.key === key), hb = state.hobbies[key];
  if(!h || !hb || hb.level < 50 || state.done['comp_' + key] || state.money < compFee()) return;
  state.done['comp_' + key] = true; state.money -= compFee();
  const r = Math.random(), win = (hb.level - 30) / 110;
  if(r < win * 0.35){
    const prize = inflR(1000 + hb.level * 60, 50);
    pushEntry(state.age, `${state.name} wins first place in a ${h.name.toLowerCase()} competition and takes home ${fmt(prize)}.`, {money:prize, happy:10, fans:8});
  } else if(r < win){
    pushEntry(state.age, `${state.name} places in a ${h.name.toLowerCase()} competition.`, {money:inflR(200 + hb.level * 10, 10), happy:5});
  } else pushEntry(state.age, `${state.name} enters a ${h.name.toLowerCase()} competition but doesn't place.`, {happy:-2});
  hb.level = Math.min(100, hb.level + 2);
  render();
}
function freelanceGig(key){
  const h = HOBBY_LIST.find(x => x.key === key);
  const hb = state.hobbies[key];
  if(!h || !h.career || state.done['free_'+key] || !hb || hb.level < 35) return;
  state.done['free_'+key] = true;
  const pay = inflR(200 + hb.level*15 + Math.random()*300, 10);
  pushEntry(state.age, `${state.name} picks up freelance work as a ${h.career.toLowerCase()}.`, {money:pay, happy:3});
  render();
}

function study(){
  if(state.done.study) return;
  state.done.study = true;
  state.edu.gpa = clamp(state.edu.gpa + 6);
  pushEntry(state.age, `${state.name} hits the books hard.`, {smarts:3,happy:-1});
  render();
}
function skipClass(){
  if(state.done.skip) return;
  state.done.skip = true;
  state.edu.gpa = clamp(state.edu.gpa - 5);
  pushEntry(state.age, `${state.name} skips class for the day.`, {happy:3});
  render();
}
function activateStudentLoan(){
  const sl = state.loans.find(l => l.type === 'Student' && l.deferred);
  if(!sl) return;
  if(sl.balance > 0){
    sl.deferred = false; sl.term = 10; sl.yearsLeft = 10;
    sl.yearlyPayment = Math.round(sl.balance * sl.apr / (1 - Math.pow(1+sl.apr, -10)));
  } else {
    state.loans = state.loans.filter(l => l.id !== sl.id);
  }
}
function dropOut(){
  const was = state.edu.school;
  state.edu.school = null; state.edu.endAge = 0;
  activateStudentLoan();
  pushEntry(state.age, `${state.name} drops out of ${was}${state.loans.some(l=>l.type==='Student') ? ' — the student loan payments start regardless' : ''}.`, {happy:-4});
  render();
}
function enrollCollege(method){
  const e = state.edu;
  e.school = 'College'; e.gpa = 60; e.endAge = state.age + 4; e.financeMethod = method || 'cash';
  const how = {loan:', financed with student loans', paid:' on a full scholarship', half:' on a half scholarship'}[method] || ', paying tuition out of pocket';
  pushEntry(state.age, `${state.name} enrolls in college${how}.`, {happy: method === 'paid' ? 6 : 3});
}
function enrollGrad(method){
  const e = state.edu;
  if(e.school || e.level !== 'Bachelor' || state.age < 21) return;
  if(state.job){ convertCoworkersToFriends(); state.job = null; }
  e.school = 'Graduate School'; e.gpa = Math.max(60, e.gpa); e.endAge = state.age + 2; e.financeMethod = method;
  pushEntry(state.age, `${state.name} starts a two-year Master's program${method === 'loan' ? ' on student loans' : ''}.`, {happy:3});
  render();
}
function applyJob(trackName){
  const track = CAREERS[trackName];
  if(!track || (state.job && state.job.track === trackName) || state.done['app_'+trackName]) return;
  const rank0 = track[0];
  if(state.retired || state.age > 66) return;
  if(state.age < rank0.minAge || EDU_RANK[state.edu.level] < EDU_RANK[rank0.edu] || state.stats.smarts < rank0.minSmarts) return;
  state.done['app_'+trackName] = true;
  const chance = Math.min(90, 40 + state.stats.smarts*0.3 + state.stats.looks*0.1);
  if(Math.random()*100 < chance){
    if(state.job){
      convertCoworkersToFriends();
      pushEntry(state.age, `${state.name} leaves their job as ${state.job.title} for a new career.`, {});
    }
    state.job = {track:trackName, rank:0, title:rank0.title, salary:inflR(rank0.salary * (state.edu.level === 'Master' ? 1.1 : 1), 100), years:0};
    if(Math.random() < 0.5) newRel('Coworker', {age:Math.max(0, state.age+rint(-8,8)), closeness:35+rint(0,20), origin:'through work'});
    pushEntry(state.age, `${state.name} lands an entry-level role as ${rank0.title} in ${trackName}.`, {happy:6});
  } else {
    pushEntry(state.age, `${state.name} applies for ${rank0.title} in ${trackName} but doesn't get it.`, {happy:-3});
  }
  render();
}
function quitJob(){
  const j = state.job; if(!j) return;
  state.job = null;
  convertCoworkersToFriends();
  pushEntry(state.age, `${state.name} quits their job as ${j.title}.`, {happy:2});
  render();
}
function jobHunt(){
  const j = state.job; if(!j || state.done.hunt || j.years < 1) return;
  state.done.hunt = true;
  if(Math.random() < (state.econ.recession ? 0.2 : 0.4) + state.stats.smarts / 400 + (state.edu.level === 'Master' ? 0.08 : 0)){
    const raise = Math.round(j.salary * (0.08 + Math.random() * 0.14) / 100) * 100;
    convertCoworkersToFriends();
    j.salary += raise; j.years = 0;
    if(Math.random() < 0.5) newRel('Coworker', {age:Math.max(18, state.age + rint(-8, 8)), closeness:35 + rint(0, 15), origin:'through work'});
    pushEntry(state.age, `${state.name} lands a ${j.title} role at a new company, with a ${fmt(raise)} raise.`, {happy:6});
  } else pushEntry(state.age, `${state.name} interviews around but no better offer comes through.`, {happy:-2});
  render();
}
function workHarder(){
  if(state.done.work) return;
  state.done.work = true; state.boost = true;
  pushEntry(state.age, `${state.name} puts in extra hours to get noticed.`, {health:-2,happy:-2});
  render();
}

function renderPanel(){
  const p = document.getElementById('panel');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.panel === state.panel));
  if(!state.panel){ p.innerHTML = ''; return; }
  const a = state.age, e = state.edu, s = state.stats;
  const opt = (label, meta, fn, dis) => `<button class="opt" ${dis?'disabled':''} onclick="${fn}"><span>${label}</span><span class="meta">${meta}</span></button>`;
  let h = '';
  if(state.panel === 'act'){
    if(a >= 18) h += `<div class="btnrow-social"><button onclick="buyLottery()" ${(state.done.lotto || state.money < lottoCost()) ? 'disabled' : ''}>Buy Lottery Ticket (${fmt(lottoCost())})</button></div>`;
    ACTIVITIES.forEach((x,i) => {
      if(a < x.min) return;
      const done = state.done[x.key];
      h += opt(x.label, done ? 'done ✓' : (x.cost ? fmt(actCost(x)) : 'free'), `doActivity(${i})`, done || state.money < actCost(x));
    });
  } else if(state.panel === 'edu'){
    if(e.school){
      h += `<div class="status">Enrolled: <b>${e.school}</b> · GPA <b>${Math.round(e.gpa)}</b></div>`;
      h += opt('Study hard', '+smarts', 'study()', state.done.study);
      h += opt('Skip class', '−GPA', 'skipClass()', state.done.skip);
      h += opt('Drop out', '', 'dropOut()', false);
    } else {
      h += `<div class="status">${a < 5 ? 'Too young for school.' : 'Education: <b>' + (e.level === 'None' ? 'no diploma' : e.level) + '</b>. Not currently enrolled.'}</div>`;
      if(a >= 18 && a < 45 && EDU_RANK[e.level] === 1){
        h += opt('Enroll in college (pay cash)', fmt(Math.round(9000*state.econ.cumInflation))+'/yr', `enrollCollege('cash');render()`, false);
        h += opt('Enroll in college (student loans)', 'repay after graduating', `enrollCollege('loan');render()`, false);
      }
      if(a >= 21 && a < 55 && e.level === 'Bachelor'){
        h += opt("Master's degree (pay cash)", fmt(Math.round(15000*state.econ.cumInflation))+'/yr · 2 years, leaves your job', `enrollGrad('cash')`, false);
        h += opt("Master's degree (student loans)", '2 years, leaves your job', `enrollGrad('loan')`, false);
      }
      if(e.level === 'Master') h += '<div class="status">A Master\'s degree raises starting salaries by 10% and helps with every promotion.</div>';
    }
  } else if(state.panel === 'inv'){
    if(a < 16){ h = '<div class="status">Too young to invest yet — come back at 16.</div>'; }
    else {
      const pv = portfolioValue(), upl = unrealizedPL();
      h += `<div class="status">Cash <b>${fmt(state.money)}</b> &nbsp;·&nbsp; Portfolio <b>${fmt(pv)}</b> &nbsp;·&nbsp; Net worth <b>${fmt(netWorth())}</b><br>Unrealized <span class="${upl >= 0 ? 'up' : 'down'}">${upl >= 0 ? '+' : '-'}${fmt(Math.abs(upl))}</span> &nbsp;·&nbsp; Realized <span class="${state.realized >= 0 ? 'up' : 'down'}">${state.realized >= 0 ? '+' : '-'}${fmt(Math.abs(state.realized))}</span></div>`;
      if(state.orders.length) h += ordersHtml();
      h += '<div class="plabel">AUTO-INVEST</div><div class="invrow"><div class="owned">Each year, put part of what is left over after bills into the Total Market Index Fund.' + (state.lastAutoInvested ? ' Last year: ' + fmt(state.lastAutoInvested) + '.' : '') + '</div><div class="sortrow">' +
        [0, 0.1, 0.25, 0.5].map(p => `<button class="sortbtn${state.autoInvest === p ? ' active' : ''}" onclick="setAutoInvest(${p})">${p ? Math.round(p * 100) + '%' : 'Off'}</button>`).join('') + '</div></div>';
      h += '<div class="plabel">SORT</div><div class="sortrow">' +
        [['default','Default'],['gainers','Gainers'],['losers','Losers'],['name','A–Z']]
          .map(([m,l]) => `<button class="sortbtn${state.invSort===m?' active':''}" onclick="setSort('${m}')">${l}</button>`).join('') +
        '</div>';
      h += '<div class="plabel">STOCKS</div>';
      sortedList(STOCKS).forEach(x => h += investRow(x));
      h += '<div class="plabel">CRYPTO</div>';
      sortedList(CRYPTO).forEach(x => h += investRow(x));
    }
  } else if(state.panel === 'ast'){
    const av = assetsValue();
    h += `<div class="status">Cash <b>${fmt(state.money)}</b> &nbsp;·&nbsp; Assets <b>${fmt(av)}</b> &nbsp;·&nbsp; Debt <b>${fmt(totalDebt())}</b><br>Net worth <b>${fmt(netWorth())}</b></div>`;
    if(state.assets.length){
      h += '<div class="plabel">YOUR ASSETS</div>';
      state.assets.forEach(x => h += ownedAssetRow(x));
    }
    for(const cat in ASSET_CATALOG){
      h += `<div class="plabel">${cat.toUpperCase()}${a < CAT_MIN[cat] ? ' · unlocks at ' + CAT_MIN[cat] : ''}</div>`;
      ASSET_CATALOG[cat].forEach(t => h += assetCatalogRow(t, cat));
    }
  } else if(state.panel === 'soc'){
    h += socialPanelHtml();
  } else if(state.panel === 'bank'){
    const econ = state.econ, c = state.creditCard;
    h += `<div class="status">Checking <b>${fmt(state.money)}</b> &nbsp;·&nbsp; Savings <b>${fmt(state.savings)}</b>${state.cds.length ? ' &nbsp;·&nbsp; CDs <b>' + fmt(cdTotal()) + '</b>' : ''}<br>
      Credit Score <b>${state.creditScore}</b> (${creditTier(state.creditScore)})${state.bankrupt ? ' · <span style="color:var(--red)">bankrupt</span>' : ''}<br>
      Interest Rate ${(econ.rate*100).toFixed(1)}% · Inflation ${(econ.inflation*100).toFixed(1)}%${econ.recession ? ' · <span style="color:var(--red)">Recession</span>' : ''}</div>`;

    h += trustHtml() + savingsPanelHtml();
    if(a >= 16) h += retirementHtml();

    h += '<div class="plabel">CREDIT CARD</div>';
    if(!c){
      h += bankRow('No credit card', a < 18 ? 'Too young to apply.' : 'Approval depends on your credit score.', a >= 18 ? `<button onclick="applyCard()" ${(state.bankrupt || state.done.cardApp) ? 'disabled' : ''}>Apply</button>` : '');
    } else {
      const step = inflR(500, 50);
      h += bankRow(`Limit ${fmt(c.limit)}`, `Balance ${fmt(c.balance)} · ${(c.apr*100).toFixed(1)}% APR${state.cardAutopay ? ' · autopay on: the balance is paid in full each year, so no interest' : ''}`, `
        <button onclick="chargeCard(${step})" ${c.balance + step > c.limit ? 'disabled' : ''}>Charge ${fmt(step)}</button>
        <button onclick="payCard(${step})" ${c.balance <= 0 || state.money <= 0 ? 'disabled' : ''}>Pay ${fmt(Math.min(step, Math.max(c.balance, 0)))}</button>
        <button onclick="payCard('all')" ${c.balance <= 0 || state.money < c.balance ? 'disabled' : ''}>Pay in full</button>
        <button onclick="state.cardAutopay=!state.cardAutopay;render()">${state.cardAutopay ? 'Turn autopay off' : 'Turn on autopay'}</button>`);
    }

    h += '<div class="plabel">LOANS</div>';
    h += bankRow('Personal Loan', a < 18 ? 'Too young to apply.' : 'Amount depends on your credit score.', a >= 18 ? `<button onclick="applyPersonalLoan()" ${(state.bankrupt || state.done.personalLoan) ? 'disabled' : ''}>Apply</button>` : '');
    if(a >= 18 && !state.loans.some(l => l.type === 'Builder'))
      h += bankRow('Credit Builder Loan', '$500, low rate, always approved — rebuilds credit fast when paid on time.', `<button onclick="applyBuilderLoan()">Take Loan</button>`);
    state.loans.forEach(l => {
      h += bankRow(`${l.type} Loan`, `Balance ${fmt(l.balance)} · ${(l.apr*100).toFixed(1)}% APR · ${l.deferred ? 'deferred while in school' : fmt(l.yearlyPayment)+'/yr · '+l.yearsLeft+'yr left'}`,
        !l.deferred ? `<button onclick="payoffLoan('${l.id}')" ${state.money < l.balance ? 'disabled' : ''}>Pay Off ${fmt(l.balance)}</button>` : '');
    });

    h += '<div class="plabel">INSURANCE</div><div class="sortrow">' +
      ['health','auto','home'].map(k => `<button class="sortbtn${state.insurance[k] ? ' active' : ''}" onclick="toggleInsurance('${k}')">${k[0].toUpperCase()+k.slice(1)} ${state.insurance[k] ? '✓' : ''}</button>`).join('') +
      '</div>';
    h += estatePlanHtml();

    if(state.money <= -3000 && !state.bankrupt){
      h += '<div class="plabel">DEBT RELIEF</div>';
      h += bankRow('Deep in debt', 'Bankruptcy discharges unsecured debt but wrecks your credit for years.', `<button onclick="fileBankruptcy()">File for Bankruptcy</button>`);
    }
  } else if(state.panel === 'media'){
    h += mediaPanelHtml();
  } else if(state.panel === 'biz'){
    const b = state.business;
    if(a < 21){ h = '<div class="status">Too young to start a business. Come back at 21.</div>'; }
    else if(!b){
      h += '<div class="status">Pick a business to start. Each requires upfront capital.</div>';
      BUSINESS_TYPES.forEach(t => h += opt(t.name, fmt(bizCost(t)) + ' to start', `startBusiness('${t.key}')`, state.money < bizCost(t)));
    } else {
      const t = bizType(b.type);
      const cum = state.econ.cumInflation, overhead = (b.employees*BIZ_OVERHEAD_PER_EMP + b.locations*BIZ_OVERHEAD_PER_LOC) * cum;
      h += `<div class="status"><b>${t.name}</b><br>
        ${b.employees} employee${b.employees===1?'':'s'} · ${b.locations} location${b.locations===1?'':'s'}<br>
        Price: ${b.price} · Reputation ${b.reputation}/100${b.marketing>0?' · Marketing boost active':''}<br>
        Est. yearly overhead ${fmt(overhead)} · Business valuation ${fmt(Math.round(b.value))}${b.lastProfit !== null && b.lastProfit !== undefined ? `<br>Last year: <span class="${b.lastProfit >= 0 ? 'up' : 'down'}">${b.lastProfit >= 0 ? 'profit' : 'loss'} of ${fmt(Math.abs(b.lastProfit))}</span>` : ''}${b.employees === 0 ? '<br>Hire staff to start bringing in revenue.' : ''}</div>`;

      h += '<div class="plabel">STAFF & LOCATIONS</div>';
      h += bankRow('Employees', `${b.employees} on payroll — each costs ~${fmt(BIZ_OVERHEAD_PER_EMP * cum)}/yr and brings in about ${fmt(t.revPerEmp * cum * (0.5 + b.reputation/100))} at normal prices.`, `
        <button onclick="hireEmployee()">Hire</button>
        <button onclick="hireEmployee(5)">Hire 5</button>
        <button onclick="fireEmployee()" ${b.employees<=0?'disabled':''}>Fire</button>`);
      h += bankRow('Locations', `${b.locations} open — more locations scale revenue and overhead together.`, `<button onclick="expandLocation()" ${state.money < expandCost(b) ? 'disabled':''}>Open New Location (${fmt(expandCost(b))})</button>`);

      h += '<div class="plabel">STRATEGY</div><div class="sortrow">' +
        ['low','normal','high'].map(p => `<button class="sortbtn${b.price===p?' active':''}" onclick="setBizPrice('${p}')">${p[0].toUpperCase()+p.slice(1)} Prices</button>`).join('') + '</div>';
      h += bankRow('Advertise', `Spend ${fmt(adCost())} on a campaign to boost revenue and reputation.`, `<button onclick="advertiseBiz()" ${state.money<adCost()?'disabled':''}>Run Campaign</button>`);
      h += bankRow('Business Loan', 'Finance expansion — survives even if the business fails.', `<button onclick="applyBusinessLoan()" ${state.bankrupt?'disabled':''}>Apply</button>`);

      h += '<div class="plabel">EXIT</div>';
      if(b.value >= ipoMin() && b.employees >= 5)
        h += bankRow('Take Public (IPO)', 'Sell 40% to the public for cash, keep 60% as tradeable stock in your portfolio.', `<button onclick="ipoBusiness()">IPO</button>`);
      else
        h += bankRow('IPO Not Yet Available', `Needs a ${fmt(ipoMin())} valuation and at least 5 employees.`, '');
      h += bankRow('Sell the Business', 'Cash out now at a discount to its full valuation.', `<button onclick="closeBusiness()">Sell for ${fmt(Math.round(b.value*0.7))}</button>`);
    }
  } else if(state.panel === 'hob'){
    HOBBY_LIST.forEach(hobby => {
      if(a < hobby.minAge) return;
      const lvl = hobbyLevel(hobby.key);
      const tier = hobbyTier(lvl);
      const linkedBizKey = hobby.career ? HOBBY_BUSINESS[hobby.key] : null;
      let actions = `<button onclick="practiceHobby('${hobby.key}')" ${(state.done['hob_'+hobby.key] || state.money < hobCost(hobby)) ? 'disabled' : ''}>Practice${hobby.cost ? ' ('+fmt(hobCost(hobby))+')' : ''}</button>`;
      if(hobby.career) actions += `<button onclick="freelanceGig('${hobby.key}')" ${(state.done['free_'+hobby.key] || lvl < 35) ? 'disabled' : ''}>Freelance Gig</button>`;
      if(lvl >= 50) actions += `<button onclick="enterCompetition('${hobby.key}')" ${(state.done['comp_'+hobby.key] || state.money < compFee()) ? 'disabled' : ''}>Compete (${fmt(compFee())})</button>`;
      const unlockNote = hobby.career
        ? (lvl >= 70
            ? ` · Mastery unlocks a founding bonus if you start a ${BUSINESS_TYPES.find(t=>t.key===linkedBizKey).name} in Business`
            : lvl >= 35
              ? ` · Freelancing as a ${hobby.career} is open`
              : ` · Reach level 35 to freelance as a ${hobby.career}`)
        : '';
      h += `<div class="invrow">
        <div class="itop"><span><b>${hobby.name}</b></span><span class="price">${tier}${lvl > 0 ? ' · '+lvl+'/100' : ''}</span></div>
        <div class="owned">${hobby.career ? hobby.career + ' path' : 'Just for fun'}${unlockNote}</div>
        <div class="assetbuy">${actions}</div>
      </div>`;
    });
  } else {
    if(a < 12){ h = '<div class="status">Too young to work.</div>'; }
    else {
      const j = state.job;
      if(j){
        const track = CAREERS[j.track], rank = track[j.rank];
        const coworkers = state.relationships.filter(r => r.type === 'Coworker');
        h += `<div class="status"><b>${rank.title}</b> · ${j.track}<br>${fmt(j.salary)}/yr · ${rank.hours}hrs/wk · Stress ${rank.stress}/100 · ${j.years}yr on the job${coworkers.length ? `<br>Coworkers: ${coworkers.map(c=>c.name).join(', ')}` : ''}</div>`;
        h += '<div class="plabel">CAREER LADDER</div>';
        h += `<div class="invrow"><div class="owned">${track.map((r,i) => i === j.rank ? `<b>→ ${r.title}</b>` : (i < j.rank ? `✓ ${r.title}` : r.title)).join(' &nbsp;→&nbsp; ')}</div></div>`;

}
function updateMusic(){
  if(!AUDIO.ctx || !AUDIO.musicOn || typeof state === "undefined" || !state) return;
  const k = musicStyleKey();
  if(k !== AUDIO.style){ AUDIO.style = k; AUDIO.bar = 0; AUDIO.phrase = []; applyStyleParams(); }
}

// ---- life hooks (every one is wrapped so audio can never break the game) ----
function audioAfterRender(){ try{ audioFlush(); updateMusic(); } catch(e){} }
function audioStartLife(){ try{ AUDIO.dead = false; AUDIO.blue = false; AUDIO.queue = []; if(AUDIO.ctx && AUDIO.prefs.music){ stopMusic(0.01); startMusic(); } } catch(e){} }
function audioDeath(){ try{ AUDIO.dead = true; AUDIO.queue = []; stopMusic(3); sfxNow("somber"); } catch(e){} }

// ---- settings ----
const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6"/><path d="m21 9-5 6"/></svg>';
function audioSyncUI(){
  try{
    const P = AUDIO.prefs, el = id => document.getElementById(id);
    const m = el("musicOn"), s = el("sfxOn"), mv = el("musicVol"), sv = el("sfxVol"), b = el("audioBtn"), sb = el("audioSetupBtn");
    if(m) m.checked = P.music; if(s) s.checked = P.sfx; if(mv) mv.value = Math.round(P.musicVol * 100); if(sv) sv.value = Math.round(P.sfxVol * 100);
    if(b) b.innerHTML = (P.music || P.sfx) ? ICON_ON : ICON_OFF;
    if(sb) sb.textContent = (P.music || P.sfx) ? "Sound: on" : "Sound: off";
  } catch(e){}
}
function setMusic(on){
  AUDIO.prefs.music = !!on; audioSavePrefs();
  if(on){ audioUnlock(); if(AUDIO.ctx && state && state.alive) startMusic(); } else stopMusic(0.6);
  audioSyncUI();
}
function setSfx(on){ AUDIO.prefs.sfx = !!on; audioSavePrefs(); if(on){ audioUnlock(); sfxNow("tap"); } audioSyncUI(); }
function setVol(kind, v){
  const x = Math.max(0, Math.min(1, Number(v) / 100)); if(!isFinite(x)) return;
  const now = AUDIO.ctx ? AUDIO.ctx.currentTime : 0;
  if(kind === "music"){
    AUDIO.prefs.musicVol = x;
    if(AUDIO.musicBus && AUDIO.musicOn){            // drop any pending fade so it cannot overwrite the new level later
      const g = AUDIO.musicBus.gain; g.cancelScheduledValues(now); g.setValueAtTime(Math.max(0.0001, g.value), now); g.setTargetAtTime(Math.max(0.0001, musicLevel()), now, 0.1);
    }
  }
  else { AUDIO.prefs.sfxVol = x; if(AUDIO.sfxBus) AUDIO.sfxBus.gain.setTargetAtTime(Math.max(0.0001, sfxLevel()), now, 0.05); }
  audioSavePrefs();
}
function toggleAllAudio(){ const on = !(AUDIO.prefs.music || AUDIO.prefs.sfx); setSfx(on); setMusic(on); }
function toggleAudioPanel(){ const p = document.getElementById("audioPanel"); if(p) p.hidden = !p.hidden; audioUnlock(); audioSyncUI(); }
function audioWire(){
  audioLoadPrefs(); audioSyncUI();
  if(typeof document === "undefined" || typeof document.addEventListener !== "function") return;
  const unlock = () => audioUnlock();
  ["pointerdown", "touchstart", "keydown"].forEach(ev => document.addEventListener(ev, unlock, {passive:true}));
  document.addEventListener("click", e => {
    const b = e.target && e.target.closest ? e.target.closest("button") : null;
    if(b) sfxNow(b.id === "ageBtn" ? "ageup" : "tap");
  });
  document.addEventListener("visibilitychange", () => {
    if(!AUDIO.ctx) return;
    try{ if(document.hidden) AUDIO.ctx.suspend(); else AUDIO.ctx.resume(); } catch(e){}
  });
}

function die(){
  state.alive = false;
  audioDeath();
  const a = state.age;
  const causes = a < 18 ? ['after a sudden illness','in a tragic accident']
    : a < 55 ? ['after a sudden illness','in an unexpected accident']
    : a < 80 ? ['after a long illness','peacefully, after a good life']
    : ['peacefully, in their sleep','surrounded by family','after a remarkably long and full life'];
  state.obit = {title: `${state.name}'s record closes at ${state.age}${state.generation > 1 ? ' (generation ' + state.generation + ')' : ''}`,
    text: `They passed ${pick(causes)}${a >= 90 ? ', having lived to a remarkable age' : ''}. Final net worth: ${fmt(netWorth())} (about ${fmt(netWorth() / state.econ.cumInflation)} in today's money). ${legacyText()} Health: ${state.stats.health}, Happiness: ${state.stats.happy}.`};
  document.getElementById('choices').innerHTML = '';
  showGameOver();
  saveGame();
}
function showGameOver(){
  showScreen("gameover");
  document.getElementById('goTitle').textContent = state.obit ? state.obit.title : state.name + "'s record closes";
  document.getElementById('goText').textContent = state.obit ? state.obit.text : legacyText();
  showHeirs();
}

function render(){
  document.getElementById('avatarBox').innerHTML = drawAvatar();
  document.getElementById('ageNum').textContent = state.age;
  const ed = state.edu;
  const partner = state.relationships.find(r => r.type === 'Partner' || r.type === 'Spouse');
  document.getElementById('tags').innerHTML =
    `<span class="money${state.money < 0 ? ' neg' : ''}">${fmt(state.money)}</span><br>` +
    `${ed.school || (ed.level === 'None' ? 'No diploma' : ed.level)}${state.job ? ' · ' + state.job.title : ''}${state.retired ? ' · retired' : ''}${partner ? ' · ' + (partner.type === 'Spouse' ? 'married to ' : 'dating ') + partner.name : ''}`;
  renderPanel();
  document.getElementById('stageLabel').textContent = stageFor(state.age);
  for(const k of ['health','happy','smarts','looks']){
    document.getElementById(`fill-${k}`).style.width = state.stats[k] + '%';
    document.getElementById(`val-${k}`).textContent = state.stats[k];
  }
  queueSave();
  const log = document.getElementById('log');
  log.innerHTML = state.log.slice().reverse().slice(0,25).map(e =>
    `<div class="entry"><span class="eage">AGE ${e.age}</span>${e.text} ${e.dtext}</div>`
  ).join('');
  audioAfterRender();
}

audioWire();
resumeGame();
document.addEventListener("visibilitychange", () => { if(document.hidden) saveGame(); });
window.addEventListener("pagehide", saveGame);
// keyboard: Space or Enter ages up, 1-4 picks an answer
document.addEventListener("keydown", e => {
  if(!state || !state.alive || e.target.closest("input, textarea, select") || e.ctrlKey || e.metaKey || e.altKey) return;
  const opts = document.querySelectorAll('#choices .choice-btn');
  if(opts.length && /^[1-9]$/.test(e.key) && opts[+e.key - 1]){ e.preventDefault(); opts[+e.key - 1].click(); return; }
  if((e.key === " " || e.key === "Enter") && !e.target.closest("button")){
    const b = document.getElementById('ageBtn'); if(!b.disabled){ e.preventDefault(); b.click(); }
  }
});
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
