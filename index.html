<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger — A Life</title>
<meta name="theme-color" content="#EEF0E8">
<meta name="description" content="Ledger — a life simulation game. Live a whole life, one year at a time.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF0E8;
    --surface:#FFFFFF;
    --surface-2:#F5F6EF;
    --ink:#232A24;
    --muted:#707C72;
    --line:rgba(35,42,36,0.11);
    --accent:#2C4A42;
    --accent-soft:rgba(44,74,66,0.09);
    --gold:#B9842C;
    --red:#BD524F;
    --green:#3E8F63;
    --blue:#3E73AC;
    --pink:#AD6A91;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    display:flex;
    justify-content:center;
    min-height:100%;
    -webkit-font-smoothing:antialiased;
  }
  .sheet{ width:100%; max-width:460px; padding:30px 18px 40px; }

  header{ text-align:center; margin-bottom:22px; }
  .brandmark{
    width:40px; height:40px; margin:0 auto 10px;
    border-radius:12px; background:var(--accent);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:700; font-size:19px; color:#fff;
  }
  h1{
    font-family:'Fraunces',serif; font-size:28px; font-weight:700;
    margin:0 0 4px; color:var(--ink);
  }
  .sub{ font-size:14.5px; color:var(--muted); }

  /* Setup screen */
  #setup{ text-align:center; }
  #setup p.lead{ color:var(--muted); font-size:15px; margin:4px 0 22px; line-height:1.5; }
  #nameInput{
    width:100%;
    padding:14px 16px;
    font-family:'Manrope',sans-serif;
    font-size:16px;
    background:var(--surface);
    border:1.5px solid var(--line);
    color:var(--ink);
    border-radius:14px;
    margin-bottom:14px;
    box-shadow:0 1px 2px rgba(35,42,36,0.04);
  }
  #nameInput::placeholder{ color:#A8B2A2; }
  #nameInput:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  button{
    font-family:'Manrope',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    border-radius:12px;
    border:none;
    transition:transform .12s ease, background .12s ease, border-color .12s ease;
  }
  button:active{ transform:scale(0.97); }
  button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .btn-primary{
    background:var(--accent);
    color:#fff;
    padding:15px 20px;
    width:100%;
    font-weight:700;
    font-size:15px;
    border-radius:14px;
    box-shadow:0 4px 14px rgba(44,74,66,0.22);
  }
  .btn-primary:hover{ background:#24392f; }

  /* Game screen */
  #game{ display:none; }
  .id-row{
    display:flex; gap:16px; align-items:center; margin-bottom:20px;
    background:var(--surface); border-radius:18px; padding:14px;
    box-shadow:0 2px 10px rgba(35,42,36,0.06); border:1px solid var(--line);
  }
  .photo-frame{
    width:92px; height:92px; flex:none; border-radius:14px;
    overflow:hidden; background:var(--surface-2);
    box-shadow:inset 0 0 0 1px var(--line);
  }
  .photo-frame svg{ width:100%; height:100%; display:block; }
  .id-info{ flex:1; min-width:0; }
  .age-num{ font-family:'Fraunces',serif; font-size:34px; font-weight:700; line-height:1; color:var(--ink); }
  .age-label{
    display:inline-block; font-size:11.5px; font-weight:700; color:var(--accent);
    background:var(--accent-soft); padding:2px 9px; border-radius:99px; margin-top:5px;
    text-transform:lowercase;
  }
  .age-label::first-letter{ text-transform:uppercase; }
  .stage{ font-size:15px; font-weight:700; margin-top:6px; word-break:break-word; color:var(--ink); }

  .stats{
    display:grid; gap:11px; margin-bottom:18px;
    background:var(--surface); border-radius:18px; padding:16px;
    box-shadow:0 2px 10px rgba(35,42,36,0.06); border:1px solid var(--line);
  }
  .stat-row{ display:grid; grid-template-columns:62px 1fr 30px; align-items:center; gap:10px; }
  .stat-name{ font-size:12px; font-weight:700; color:var(--muted); text-transform:lowercase; }
  .stat-name::first-letter{ text-transform:uppercase; }
  .stat-track{ height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden; box-shadow:inset 0 0 0 1px var(--line); }
  .stat-fill{ height:100%; border-radius:99px; transition:width .4s ease; }
  .stat-val{ font-size:12.5px; font-weight:700; text-align:right; color:var(--ink); }

  .tags{ font-size:12.5px; color:var(--muted); margin-top:7px; line-height:1.55; }
  .money{ color:var(--gold); font-weight:800; font-size:15.5px; }
  .money.neg{ color:var(--red); }
  .actions-row{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-bottom:0; }
  .actions-row .tab-btn{ font-size:10.5px; padding:8px 2px; letter-spacing:-0.01em; }

  .pinned-top{
    position:sticky; top:0; z-index:30;
    background:var(--bg);
    margin:-30px -18px 14px;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 12px;
    border-bottom:1px solid var(--line);
  }
  .pinned-top .id-row{ margin-bottom:10px; }
  .pinned-top .stats{ margin-bottom:12px; }
  .scroll-area{ min-height:120px; padding-bottom:8px; }
  .invrow{
    display:flex; flex-direction:column; gap:7px; background:var(--surface);
    border:1px solid var(--line); padding:13px 14px; margin-bottom:9px;
    border-radius:14px; box-shadow:0 1px 4px rgba(35,42,36,0.05);
  }
  .invrow .itop{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .invrow .tick{
    font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--accent);
    background:var(--accent-soft); padding:1px 6px; border-radius:6px; letter-spacing:.02em;
  }
  .invrow .price{ font-family:'JetBrains Mono',monospace; font-size:13.5px; font-weight:500; white-space:nowrap; color:var(--ink); }
  .invrow .price.up{ color:var(--green); }
  .invrow .price.down{ color:var(--red); }
  .invrow .owned{ font-size:12px; color:var(--muted); line-height:1.5; }
  .invrow .steprow{ display:flex; align-items:center; gap:6px; }
  .invrow .steprow button{ padding:9px 11px; font-size:13px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink); border-radius:10px; }
  .invrow .steprow .qtyval{ flex:1; text-align:center; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); }
  .invrow .steprow .buybtn{ flex:none; padding:9px 16px; background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700; border-radius:10px; }
  .invrow .steprow button:disabled{ opacity:.4; cursor:not-allowed; }
  .invrow .steprow button:hover:not(:disabled){ border-color:var(--accent); }
  .invrow .steprow .buybtn:hover:not(:disabled){ background:#24392f; }
  .invrow .sellrow{ display:flex; gap:6px; }
  .invrow .sellrow button{ flex:1; padding:8px; font-size:11px; background:transparent; border:1px solid rgba(189,82,79,0.4); color:var(--red); border-radius:9px; }
  .invrow .sellrow button:hover{ border-color:var(--red); background:rgba(189,82,79,0.08); }
  .invrow .assetbuy{ display:flex; gap:6px; }
  .invrow .assetbuy button{ flex:1; padding:10px; font-size:12.5px; background:var(--accent); color:#fff; border:1px solid var(--accent); font-weight:700; border-radius:10px; }
  .invrow .assetbuy button:disabled{ background:transparent; color:var(--muted); border-color:var(--line); opacity:.7; cursor:not-allowed; font-weight:600; }
  .btnrow-social{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:9px; }
  .btnrow-social button{ padding:8px 12px; font-size:12px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink); border-radius:10px; }
  .btnrow-social button:disabled{ opacity:.4; cursor:not-allowed; }
  .btnrow-social button:hover:not(:disabled){ border-color:var(--accent); background:var(--accent-soft); }
  #heirBox{ margin:6px 0 18px; text-align:left; }
  .audio-btn{ position:absolute; top:calc(env(safe-area-inset-top,0px) + 26px); right:26px; width:34px; height:34px; padding:0; display:grid; place-items:center; border-radius:50%; background:var(--surface); color:var(--ink); border:1px solid var(--line); z-index:6; cursor:pointer; }
  .audio-btn svg{ width:18px; height:18px; }
  .audio-panel{ position:absolute; top:calc(env(safe-area-inset-top,0px) + 68px); right:22px; width:236px; padding:14px; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:0 10px 30px rgba(20,30,25,0.18); z-index:40; display:flex; flex-direction:column; gap:8px; }
  .audio-panel[hidden]{ display:none; }
  .aud-row{ display:flex; align-items:center; justify-content:space-between; font-size:13.5px; font-weight:600; }
  .audio-panel input[type=range]{ width:100%; accent-color:var(--accent); margin:0 0 6px; }
  .audio-hint{ margin:14px 0 0; font-size:12.5px; color:var(--ink-dim, #6b756d); text-align:center; }
  .audio-link{ display:block; margin:2px auto 0; background:none; border:none; color:var(--accent); font-size:12.5px; padding:6px 10px; text-decoration:underline; cursor:pointer; }
  .ticket{ display:flex; flex-direction:column; gap:8px; margin-top:4px; padding-top:11px; border-top:1px solid var(--line); }
  .amt-input{
    width:100%; padding:12px 14px; font-family:'Manrope',sans-serif; font-size:15px;
    background:var(--surface-2); border:1.5px solid var(--line); color:var(--ink); border-radius:12px;
  }
  .amt-input:focus{ outline:none; border-color:var(--accent); background:var(--surface); }
  .sortrow{ display:flex; gap:6px; margin-bottom:5px; flex-wrap:wrap; }
  .sortbtn{ background:var(--surface-2); color:var(--muted); border:1px solid var(--line); padding:7px 12px; font-size:12px; border-radius:99px; }
  .sortbtn.active{ background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700; }
  .tab-btn{ background:var(--surface); color:var(--ink); border:1px solid var(--line); padding:11px 6px; font-weight:600; border-radius:12px; box-shadow:0 1px 3px rgba(35,42,36,0.05); }
  .tab-btn:hover{ border-color:var(--accent); }
  .tab-btn.active{ background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700; box-shadow:0 3px 10px rgba(44,74,66,0.25); }
  .panel{ display:grid; gap:8px; margin-bottom:14px; }
  .panel:empty{ display:none; }
  .opt{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:var(--surface); color:var(--ink); border:1px solid var(--line);
    padding:13px 14px; text-align:left; font-size:14.5px; font-weight:500;
    border-radius:14px; box-shadow:0 1px 4px rgba(35,42,36,0.05);
  }
  .opt:hover:not(:disabled){ border-color:var(--accent); }
  .opt:disabled{ opacity:0.45; cursor:not-allowed; }
  .opt .meta{ font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--gold); white-space:nowrap; font-weight:500; }
  .status{ background:var(--accent-soft); border-left:3px solid var(--accent); padding:12px 14px; font-size:14px; line-height:1.55; border-radius:0 12px 12px 0; color:var(--ink); }
  .plabel{
    font-size:11.5px; font-weight:800; letter-spacing:.02em; color:var(--muted);
    margin-top:6px; text-transform:lowercase;
  }
  .plabel::first-letter{ text-transform:uppercase; }
  #log{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    padding:15px 17px;
    min-height:150px;
    max-height:280px;
    overflow-y:auto;
    margin-bottom:18px;
    box-shadow:0 2px 10px rgba(35,42,36,0.06);
  }
  .entry{ font-size:14.5px; line-height:1.55; margin-bottom:11px; padding-bottom:11px; border-bottom:1px solid var(--line); color:var(--ink); }
  .entry:last-child{ border-bottom:none; margin-bottom:0; padding-bottom:0; }
  .entry .eage{
    color:var(--accent); font-weight:700; font-size:11.5px; margin-right:7px;
    background:var(--accent-soft); padding:2px 7px; border-radius:99px;
  }
  .entry .delta{ font-family:'JetBrains Mono',monospace; font-size:11.5px; margin-left:6px; font-weight:500; }
  .up{ color:var(--green); }
  .down{ color:var(--red); }

  .choices{ display:grid; gap:8px; margin-bottom:14px; }
  .choice-btn{
    background:var(--surface);
    color:var(--ink);
    border:1.5px solid var(--line);
    padding:13px 15px;
    text-align:left;
    font-size:14.5px;
    font-weight:500;
    border-radius:14px;
    box-shadow:0 1px 4px rgba(35,42,36,0.05);
  }
  .choice-btn:hover{ border-color:var(--accent); background:var(--accent-soft); }

  #ageBtn{
    font-size:15.5px; padding:17px; position:sticky; bottom:12px;
    box-shadow:0 0 0 10px var(--bg), 0 6px 18px rgba(44,74,66,0.3);
    border-radius:16px;
  }
  #ageBtn:disabled{ opacity:0.4; cursor:not-allowed; }

  #gameover{ display:none; text-align:center; }
  #gameover h2{ font-family:'Fraunces',serif; font-size:25px; font-weight:700; color:var(--ink); margin-bottom:8px; }
  #gameover .epitaph{ color:var(--muted); font-style:italic; font-family:'Fraunces',serif; margin-bottom:22px; font-size:15.5px; line-height:1.5; }
</style>
</head>
<body>
<div class="sheet">
  <header>
    <div class="masthead">EST. TODAY — VOL. I</div>
    <h1>LEDGER</h1>
    <div class="sub">a record kept of one life</div>
  </header>

  <section id="setup">
    <p class="lead">Every entry starts blank. Name the subject of this record.</p>
    <input id="nameInput" type="text" placeholder="Their name" maxlength="24" onkeydown="if(event.key==='Enter')startLife()">
    <button class="btn-primary" onclick="startLife()">Begin the record</button>
    <p class="audio-hint">Sound and music start when you begin.</p>
    <button class="audio-link" id="audioSetupBtn" onclick="toggleAllAudio()">Sound: on</button>
  </section>

  <section id="game">
    <div class="pinned-top">
      <button class="audio-btn" id="audioBtn" onclick="toggleAudioPanel()" aria-label="Sound settings" title="Sound settings"></button>
      <div class="audio-panel" id="audioPanel" hidden>
        <label class="aud-row"><span>Music</span><input type="checkbox" id="musicOn" onchange="setMusic(this.checked)"></label>
        <input type="range" id="musicVol" min="0" max="100" value="55" oninput="setVol('music', this.value)" aria-label="Music volume">
        <label class="aud-row"><span>Sound effects</span><input type="checkbox" id="sfxOn" onchange="setSfx(this.checked)"></label>
        <input type="range" id="sfxVol" min="0" max="100" value="70" oninput="setVol('sfx', this.value)" aria-label="Sound effects volume">
        <button class="audio-link" onclick="restartLife()">Start a new life</button>
      </div>
      <div class="id-row">
        <div class="photo-frame" id="avatarBox"></div>
        <div class="id-info">
          <div class="age-num" id="ageNum">0</div>
          <div class="age-label" id="stageLabel">INFANT</div>
          <div class="stage" id="nameTag"></div>
          <div class="tags" id="tags"></div>
        </div>
      </div>

      <div class="stats">
        <div class="stat-row">
          <div class="stat-name">HEALTH</div>
          <div class="stat-track"><div class="stat-fill" id="fill-health" style="background:var(--red)"></div></div>
          <div class="stat-val" id="val-health"></div>
        </div>
        <div class="stat-row">
          <div class="stat-name">HAPPY</div>
          <div class="stat-track"><div class="stat-fill" id="fill-happy" style="background:var(--gold)"></div></div>
          <div class="stat-val" id="val-happy"></div>
        </div>
        <div class="stat-row">
          <div class="stat-name">SMARTS</div>
          <div class="stat-track"><div class="stat-fill" id="fill-smarts" style="background:var(--blue)"></div></div>
          <div class="stat-val" id="val-smarts"></div>
        </div>
        <div class="stat-row">
          <div class="stat-name">LOOKS</div>
          <div class="stat-track"><div class="stat-fill" id="fill-looks" style="background:var(--pink)"></div></div>
          <div class="stat-val" id="val-looks"></div>
        </div>
      </div>

      <div class="actions-row">
        <button class="tab-btn" data-panel="act" onclick="togglePanel('act')">Activities</button>
        <button class="tab-btn" data-panel="edu" onclick="togglePanel('edu')">School</button>
        <button class="tab-btn" data-panel="job" onclick="togglePanel('job')">Career</button>
        <button class="tab-btn" data-panel="inv" onclick="togglePanel('inv')">Invest</button>
        <button class="tab-btn" data-panel="ast" onclick="togglePanel('ast')">Assets</button>
        <button class="tab-btn" data-panel="soc" onclick="togglePanel('soc')">Social</button>
        <button class="tab-btn" data-panel="bank" onclick="togglePanel('bank')">Bank</button>
        <button class="tab-btn" data-panel="media" onclick="togglePanel('media')">Media</button>
        <button class="tab-btn" data-panel="biz" onclick="togglePanel('biz')">Business</button>
        <button class="tab-btn" data-panel="hob" onclick="togglePanel('hob')">Hobbies</button>
      </div>
    </div>

    <div class="scroll-area">
      <div class="choices" id="choices"></div>
      <div class="panel" id="panel"></div>
      <div class="plabel" style="margin-top:4px;">LOG</div>
      <div id="log"></div>
    </div>
    <button class="btn-primary" id="ageBtn" onclick="ageUp()">Age Up →</button>
  </section>

  <section id="gameover">
    <h2 id="goTitle">The record ends here</h2>
    <p class="epitaph" id="goText"></p>
    <div id="heirBox"></div>
    <button class="btn-primary" onclick="newRecord()">Begin a new record</button>
  </section>
</div>

<script>
let state = null;

const STAGES = [
  [0,2,'INFANT'],[3,5,'TODDLER'],[6,12,'CHILD'],[13,17,'TEENAGER'],
  [18,25,'YOUNG ADULT'],[26,45,'ADULT'],[46,64,'MIDDLE AGE'],[65,199,'ELDER']
];

function stageFor(age){
  return STAGES.find(s => age >= s[0] && age <= s[1])[2];
}

function freshState(name){
  const SKINS = ['#f1c8a0','#e0ab7d','#c68a5c','#9c6a41','#6e4a2c'];
  const HAIRS = ['#1b1410','#3d2a1a','#6b4423','#9c7a3c','#c9a227','#7a7a7a','#2b2b2b'];
  return {
    name, age:0,
    stats:{
      health: 60 + Math.floor(Math.random()*30),
      happy: 60 + Math.floor(Math.random()*30),
      smarts: 40 + Math.floor(Math.random()*40),
      looks: 40 + Math.floor(Math.random()*40),
    },
    appearance:{
      skin: SKINS[Math.floor(Math.random()*SKINS.length)],
      hair: HAIRS[Math.floor(Math.random()*HAIRS.length)],
      hairStyle: Math.floor(Math.random()*3)
    },
    log:[], alive:true,
    money:0, edu:{level:'None', school:null, gpa:60, endAge:0},
    job:null, done:{}, panel:null, boost:false,
    market: buildMarket(), portfolio:{}, tradeQty:{}, invSort:'default', basis:{}, realized:0, orders:[], orderSeq:0,
    ticket:{key:null, side:'buy', unit:'usd', amount:'', order:'market', trigger:'', all:false},
    assets:[], assetSeq:0,
    relationships:[], relSeq:0,
    savings:0, cds:[], cdSeq:0, autoSave:0, lastAutoSaved:0, savingsGoal:null, xfer:{dir:'in', amount:'', all:false}, creditScore:650, creditCard:null, loans:[], loanSeq:0,
    insurance:{health:false, auto:false, home:false}, business:null,
    econ:{rate:0.045, inflation:0.028, cumInflation:1, recession:false, recessionLeft:0},
    bankrupt:false, bankruptUntilAge:0, bankruptcies:0, movedOut:false,
    social:freshSocial(),
    hobbies:{}, retired:false, pension:0, peakSalary:0, workYears:0, recent:[],
    estates:[], estateSeq:0, will:'family', trust:false, famEstate:0, inheritedTotal:0, evTarget:null, openRel:null, socMenu:null,
    generation:1, lineage:[], traits:[], trustFund:0, willSplit:'equal', willHeir:null,
    ipos:[], retirement:{balance:0, pct:0, contributed:0}, autoInvest:0, cardAutopay:false, obit:null
  };
}
function startLife(heir){
  const name = heir ? heir.kid.name : (document.getElementById('nameInput').value.trim() || 'Unnamed');
  state = freshState(name);
  if(heir) state.ipos = (heir.old.ipos || []).slice();
  syncIpos();
  if(heir){ applyHeir(heir); state.appearance.skin = heir.old.appearance.skin; }
  else state.relationships = initFamily();
  document.getElementById('setup').style.display = 'none';
  document.getElementById('game').style.display = 'block';

    const p = heir.pkg;
    pushEntry(state.age, `${name} steps into a new chapter at ${state.age}, carrying the family line forward as generation ${state.generation}.`, {});
    pushEntry(state.age, inheritText(name, p), {});
  } else pushEntry(0, `${name} is born. The record begins.`, {});

// ---------- Saving: the record survives closing the app ----------
const SAVE_KEY = "ledger-save-v1";
let saveTimer = null, yearStart = null;
const serialize = () => JSON.stringify(state, (k, v) => (k === "recent" || k === "evTarget") ? undefined : v);
function saveGame(){
  clearTimeout(saveTimer); saveTimer = null;
  if(!state) return;
  // a decision can't be stored mid-way, so while one is open the save holds the start of this year instead
  const data = document.querySelector('#choices .choice-btn') ? yearStart : serialize();
  if(data) try{ localStorage.setItem(SAVE_KEY, data); } catch(e){}
}
function queueSave(){ if(!saveTimer) saveTimer = setTimeout(saveGame, 300); }
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); } catch(e){} }
// fill in anything a save from an older version of the game does not have yet
function upgradeSave(saved){
  const base = freshState(saved.name);
  for(const k in base){
    const b = base[k], v = saved[k];
    if(v === undefined) continue;
    base[k] = (b && v && typeof b === "object" && !Array.isArray(b) && typeof v === "object" && !Array.isArray(v)) ? Object.assign(b, v) : v;
  }
  base.recent = [];
  return base;
}
function showScreen(id){
  ["setup", "game", "gameover"].forEach(x => document.getElementById(x).style.display = x === id ? "block" : "none");
}
function resumeGame(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); } catch(e){}
  if(!saved || typeof saved.name !== "string" || !saved.stats || !Array.isArray(saved.relationships)) return false;
  try{
    state = upgradeSave(saved);
    syncIpos();
    document.getElementById('nameTag').textContent = state.name + (state.generation > 1 ? ' · generation ' + state.generation : '');
    if(state.alive){
      showScreen("game");
      document.getElementById('choices').innerHTML = ''; document.getElementById('ageBtn').disabled = false;
      render();
    } else showGameOver();
    return true;
  } catch(e){ state = null; showScreen("setup"); return false; }
}
function newRecord(){ clearSave(); state = null; location.reload(); }
function restartLife(){
  if(state && state.alive && !confirm("Start over? " + state.name + "'s life will be lost.")) return;
  newRecord();
}

function clamp(v){ return Math.max(0, Math.min(100, v)); }

// Beyond money and the four stats, events can nudge the other systems in your life.
// Each handler returns the amount actually applied (0 when it does not apply to you, so nothing is shown).
const bondDelta = (types, n) => {
  const rels = state.relationships.filter(r => types.includes(r.type));
  if(!rels.length) return 0;
  rels.forEach(r => { r.closeness = FAMILY_TYPES.includes(r.type) ? Math.max(10, Math.min(100, r.closeness + n)) : clamp(r.closeness + n); });
  return n;
};
const SPECIAL_DELTAS = {
  biz:     n => { const b = state.business; if(!b) return 0; b.value = Math.max(500, Math.round(b.value * (1 + n/100))); return n; },
  fans:    n => { const sm = state.social; if(!sm.account || sm.followers <= 0) return 0; for(const k in sm.platforms) scalePlat(k, n/100); syncFollowers(); return n; },
  rep:     n => { const sm = state.social; if(!sm.account) return 0; sm.reputation = clampRep(sm.reputation + n); return n; },
  partner: n => bondDelta(['Partner','Spouse'], n),
  family:  n => bondDelta(['Mother','Father','Sibling','Child','Grandchild'], n),
  friends: n => bondDelta(['Friend','Coworker'], n),
  credit:  n => { if(state.age < 18) return 0; adjustCredit(n); return n; },
  gpa:     n => { if(!state.edu.school) return 0; state.edu.gpa = clamp(state.edu.gpa + n); return n; },
  bond:    n => { const t = state.evTarget && findRel(state.evTarget.id); if(!t) return 0; bump(t, n); return n; },
};
const DELTA_LABEL = {biz:'business', fans:'followers', rep:'reputation', partner:'partner bond', family:'family bond', friends:'friend bond', credit:'credit', gpa:'GPA', bond:'bond'};
const PCT_DELTAS = ['biz','fans'];
function applyDelta(delta){
  const applied = {};
  for(const k in delta){
    if(k === 'money'){ state.money += delta[k]; applied[k] = delta[k]; continue; }
    if(SPECIAL_DELTAS[k]){ const got = SPECIAL_DELTAS[k](delta[k]); if(got) applied[k] = got; continue; }
    const before = state.stats[k];
    state.stats[k] = clamp(state.stats[k] + delta[k]);
    applied[k] = state.stats[k] - before;
  }
  return applied;
}

function deltaText(applied){
  const parts = [];
  for(const k in applied){
    if(applied[k] === 0) continue;
    const sign = applied[k] > 0 ? '+' : '';
    const cls = applied[k] > 0 ? 'up' : 'down';
    const val = k === 'money' ? (applied[k] > 0 ? '+' : '-') + fmt(Math.abs(applied[k])) : sign + applied[k] + (PCT_DELTAS.includes(k) ? '%' : '');
    parts.push(`<span class="delta ${cls}">${DELTA_LABEL[k] || k} ${val}</span>`);
  }
  return parts.join(' ');
}

// Prices, wages and costs are written in today's dollars; these scale them to the year you are living in.
const infl = n => Math.round(n * state.econ.cumInflation);
const inflR = (n, step) => Math.round(n * state.econ.cumInflation / step) * step;
function scaleMoneyDelta(d){ if(!d || !d.money) return d; const c = Object.assign({}, d); c.money = inflR(d.money, 10); return c; }
const scaleLabel = t => t.replace(/\$([0-9][0-9,]*)/g, (m, n) => fmt(inflR(parseInt(n.replace(/,/g, ''), 10), 10)));
const actCost = x => x.cost ? inflR(x.cost, 5) : 0;
const hobCost = h => h.cost ? inflR(h.cost, 5) : 0;
// Overdraft protection: a negative checking balance is covered from savings before it becomes debt.
function ensureCash(amount){
  if(state.money < amount && state.savings > 0){ const m = Math.min(state.savings, amount - state.money); state.money += m; state.savings -= m; }
  return state.money >= amount;
}
function coverOverdraft(){ if(state.money < 0) ensureCash(0); }

function pushEntry(age, text, delta){
  const applied = applyDelta(delta);
  state.log.push({age, text, dtext: deltaText(applied)});
  if(state.log.length > 400) state.log.splice(0, state.log.length - 400);
  coverOverdraft();
  audioEntry(text, delta);
}

// Events that fit your actual life (job, home, partner, business...) come up more often, and nothing repeats for a while.
function pickWeighted(pool, weightOf){
  let total = 0; const w = pool.map(e => { const x = weightOf(e) * (e.c || (Array.isArray(e) && e[5]) ? 1.6 : 1); total += x; return x; });
  let r = Math.random() * total;
  for(let i = 0; i < pool.length; i++){ r -= w[i]; if(r <= 0) return pool[i]; }
  return pool[pool.length - 1];
}
function remember(e){ state.recent = state.recent || []; state.recent.push(e); if(state.recent.length > 24) state.recent.shift(); }
function freshOnly(pool){ const seen = state.recent || []; const f = pool.filter(e => seen.indexOf(e) < 0); return f.length ? f : pool; }

function generateEvent(a){
  state.evTarget = null;
  const pool = BANK.filter(e => a >= e.a && a <= e.b && ok(e.c) && (!e.rt || hasRel(...e.rt)));
  if(!pool.length) return {text: fill('{n} has a quiet, uneventful year.'), delta:{}};
  const e = pickWeighted(freshOnly(pool), x => x.w), r = pick(e.r);
  remember(e);
  if(e.rt) state.evTarget = pick(state.relationships.filter(x => e.rt.includes(x.type)));
  const text = fill(e.t + ', ' + r[0] + '.');
  return {text: text.charAt(0).toUpperCase() + text.slice(1), delta: scaleMoneyDelta(r[1])};
}

function weightedEvent(pool, age){
  const eligible = pool.filter(e => age >= e[0] && age <= e[1] && ok(e[5]));
  if(eligible.length === 0) return null;
  const e = pickWeighted(freshOnly(eligible), x => x[6] || 1);
  remember(e);
  return e;
}

// ---------- Mortality ----------
// Yearly death risk follows a Gompertz curve (it roughly doubles every ~9 years after midlife),
// then health scales it: great health halves the risk, poor health more than doubles it.
const MORT = {scale:0.026, rate:0.078, pivot:80, floor:0.0004, child:0.0003, lo:0.8, hi:2.0, slope:80};
function baseHazard(age){
  if(age < 18) return MORT.child;
  return Math.min(0.5, Math.max(MORT.floor, MORT.scale * Math.exp(MORT.rate * (age - MORT.pivot))));
}
function mortalityChance(age, health){
  const mult = Math.max(age >= 100 ? 1 : MORT.lo, Math.min(MORT.hi, MORT.lo + (100 - health) / MORT.slope));   // past 100, good health stops helping
  return Math.min(0.6, baseHazard(age) * mult);
}

function ageUp(){
  if(!state.alive) return;
  yearStart = serialize();
  state.age += 1;
  const a = state.age;

  // death chance: negligible through childhood, then a realistic curve that rises with age and falls with good health
  if(Math.random() < mortalityChance(a, state.stats.health)){
    die();
    return;
  }

  // slow, uneven physical aging
  if(a > 55 && Math.random() < (a > 75 ? 0.9 : 0.55)) applyDelta({health: -1});
  document.getElementById('choices').innerHTML = '';
  state.done = {};
  updateEconomy(a);
  trustYear(a);
  const prompted = schoolYear(a);
  yearlyFinances(a);
  workYear(a);
  loansYear(a);
  creditCardYear(a);
  creditScoreYear(a);
  emergencyYear(a);
  socialMediaYear(a);
  updateMarket(a);
  payDividends(a);
  assetsYear(a);
  const relPrompted = relationshipsYear(a, prompted);
  if(prompted || relPrompted){ render(); return; }

  // some years carry a second, smaller moment alongside the main one
  if(Math.random() < 0.35){ const extra = generateEvent(a); pushEntry(a, extra.text, extra.delta); }

  const useChoice = Math.random() < (a < 18 ? 0.55 : 0.35);
  if(useChoice){
    const ev = weightedEvent(CHOICE_EVENTS, a);
    if(ev){
      presentChoice(ev);
      render();
      return;
    }
  }

  const gen = generateEvent(a);
  pushEntry(a, gen.text, gen.delta);
  render();
}

let choiceSeq = 0;
function presentCustom(promptText, opts){
  const box = document.getElementById('choices'), seq = ++choiceSeq;
  box.innerHTML = `<div class="entry" style="margin-bottom:4px;"><span class="eage">AGE ${state.age}</span>${promptText}</div>` +
    opts.map((o,i)=>`<button class="choice-btn" data-idx="${i}">${o.label}</button>`).join('');
  document.getElementById('ageBtn').disabled = true;
  audioPrompt();
  box.querySelectorAll('.choice-btn').forEach(btn=>{
    btn.onclick = () => {
      opts[+btn.dataset.idx].run();
      if(choiceSeq === seq){            // only close the prompt if this choice did not open a follow-up one
        box.innerHTML = '';
        document.getElementById('ageBtn').disabled = false;
      }
      render();
    };
  });
}

function presentChoice(ev){
  const [,, promptFn, optA, optB] = ev;
  const promptText = promptFn(state.name);
  presentCustom(promptText, [optA, optB].map(o => ({
    label: scaleLabel(o.label),
    run:()=>pushEntry(state.age, `${promptText} — ${state.name} chose: ${o.label.toLowerCase()}.`, scaleMoneyDelta(o.delta))
  })));
}

// companies taken public live in the save; this keeps the instrument lists in step with the current life
function syncIpos(){
  for(const list of [STOCKS, ALL_INSTR]) for(let i = list.length - 1; i >= 0; i--) if(list[i].sector === 'IPO' && !state.ipos.some(x => x.key === list[i].key)){ delete state.market[list[i].key]; list.splice(i, 1); }
  state.ipos.forEach(x => {
    if(!STOCKS.some(y => y.key === x.key)){ STOCKS.push(x); ALL_INSTR.push(Object.assign({type:'stock'}, x)); }
    if(!state.market[x.key]) state.market[x.key] = {price:x.base, prev:x.base};
  });
}

function buildMarket(){
  const m = {};
  ALL_INSTR.forEach(x => m[x.key] = {price:x.base, prev:x.base});
  return m;
}
function riskLabel(v){ return v < 0.15 ? 'Low risk' : v < 0.35 ? 'Med risk' : v < 0.8 ? 'High risk' : 'Extreme risk'; }
function pctChange(key){ const m = state.market[key]; return (m.price - m.prev) / m.prev; }

function portfolioValue(){
  let v = 0;
  for(const k in state.portfolio){ if(state.market[k]) v += state.portfolio[k] * state.market[k].price; }
  return v;
}

function updateMarket(a){
  const roll = Math.random();
  const bias = roll < 0.07 ? -0.32 : roll > 0.93 ? 0.28 : 0;
  ALL_INSTR.forEach(x => {
    const m = state.market[x.key];
    m.prev = m.price;
    const noise = (Math.random()+Math.random()+Math.random()-1.5) / 1.5; // roughly -1..1, centered
    const change = x.drift + bias + noise * x.vol;
    m.price = Math.max(0.0001, m.price * (1 + change));
  });
  if(bias !== 0 && portfolioValue() > 300){
    pushEntry(a, bias < 0
      ? `Markets tumble hard this year — ${state.name}'s portfolio takes a real hit.`
      : `Markets rally hard this year — ${state.name}'s portfolio surges.`,
      {happy: bias < 0 ? -4 : 5});
  }
  processOrders(a);
}

function payDividends(a){
  let total = 0;
  STOCKS.forEach(x => {
    if(x.div > 0){
      const owned = state.portfolio[x.key] || 0;
      if(owned > 0) total += owned * state.market[x.key].price * x.div;
    }
  });
  if(total <= 0) return;
  if(total >= 5) pushEntry(a, `${state.name} collects dividend payouts from their portfolio.`, {money: total});
  else applyDelta({money: total});
}

// ---------- Trading: order tickets, cost basis, fees, and conditional orders ----------
const FEE = {stock:0.001, crypto:0.005};
const ORDER_LABEL = {"buy-limit":"limit buy", "stop-loss":"stop-loss", "take-profit":"take-profit"};
function money2(n){ return (n < 0 ? "-" : "") + "$" + Math.abs(n).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtPrice(p){ return p < 1 ? "$" + p.toFixed(4) : money2(p); }
function fmtQty(n){ return n >= 1000 ? Math.round(n).toLocaleString() : String(parseFloat(n.toFixed(4))); }
function instrType(key){ const x = ALL_INSTR.find(i => i.key === key); return x ? x.type : "stock"; }
function tradeQty(key, type){ return state.tradeQty[key] || (type === "stock" ? 1 : 100); }

function execBuy(key, usd){
  const m = state.market[key];
  if(!m || !(usd > 0) || state.money < usd - 1e-6) return null;
  usd = Math.min(usd, state.money);
  const units = usd / (m.price * (1 + FEE[instrType(key)]));
  state.money -= usd;
  state.portfolio[key] = (state.portfolio[key] || 0) + units;
  state.basis[key] = (state.basis[key] || 0) + usd;
  return {units, usd, fee: usd - units * m.price};
}
function execSell(key, units){
  const m = state.market[key], owned = state.portfolio[key] || 0;
  if(!m || owned <= 1e-9) return null;
  units = Math.min(units, owned);
  if(!(units > 1e-9)) return null;
  const gross = units * m.price, net = gross * (1 - FEE[instrType(key)]);
  const costPart = (state.basis[key] || 0) * (units / owned);
  state.money += net;
  state.realized += net - costPart;
  state.basis[key] = Math.max(0, (state.basis[key] || 0) - costPart);
  state.portfolio[key] = owned - units;
  if(state.portfolio[key] <= 1e-8){ delete state.portfolio[key]; delete state.basis[key]; }
  return {units, net, fee: gross - net, pl: net - costPart};
}

// quick-trade wrappers (the old one-tap helpers, now fee- and basis-aware)
function buyStock(key, qty){ qty = qty || tradeQty(key, "stock"); if(execBuy(key, qty * state.market[key].price * (1 + FEE.stock))) render(); }
function sellStock(key, qty){ if(execSell(key, qty)) render(); }
function buyCrypto(key, dollarAmt){ dollarAmt = dollarAmt || tradeQty(key, "crypto"); if(execBuy(key, dollarAmt)) render(); }
function sellCrypto(key, qty){ if(execSell(key, qty)) render(); }
function buyMax(key, type){ if(state.money > 0 && execBuy(key, state.money)) render(); }
function sellPercent(key, type, frac){
  const owned = state.portfolio[key] || 0;
  if(owned <= 0) return;
  if(execSell(key, frac >= 1 ? owned : owned * frac)) render();
}
function unrealizedPL(){
  let pl = 0;
  for(const k in state.portfolio){ const b = state.basis[k]; if(b > 0 && state.market[k]) pl += state.portfolio[k] * state.market[k].price - b; }
  return pl;
}

// ---- the trade ticket ----
function openTicket(key){
  const t = state.ticket;
  if(t.key === key) t.key = null;
  else { t.key = key; t.amount = ""; t.trigger = ""; t.order = "market"; t.all = false; }
  renderPanel();
}
function ticketSet(field, val){
  const t = state.ticket;
  t[field] = val; t.all = false;
  if(field === "side"){ t.order = "market"; t.amount = ""; t.trigger = ""; }
  if(field === "unit") t.amount = "";
  renderPanel();
}
function ticketInput(field, val){
  state.ticket[field] = val;
  if(field === "amount") state.ticket.all = false;
  updateTicketPreview();
}
function ticketCalc(){
  const t = state.ticket, key = t.key;
  if(!key || !state.market[key]) return null;
  const price = state.market[key].price, rate = FEE[instrType(key)], owned = state.portfolio[key] || 0, buy = t.side === "buy";
  const c = {ok:false, msg:"", price, rate, owned, units:0, usd:0, fee:0, trigger:0};
  const amt = parseFloat(t.amount);
  if(!(amt > 0) && !(t.all && !buy)){ c.msg = "Enter an amount."; return c; }
  let units;
  if(buy){
    if(t.unit === "usd"){ c.usd = amt; units = amt / (price * (1 + rate)); }
    else { units = amt; c.usd = units * price * (1 + rate); }
    c.fee = c.usd - units * price;
  } else {
    if(t.all) units = owned;
    else if(t.unit === "usd") units = amt / (price * (1 - rate));
    else units = amt;
    c.usd = units * price * (1 - rate);
    c.fee = units * price - c.usd;
  }
  c.units = units;
  if(buy && c.usd > state.money + 1e-6){ c.msg = "Not enough cash for that."; return c; }
  if(!buy && units > owned + 1e-6){ c.msg = "You only hold " + fmtQty(owned) + " " + key + "."; return c; }
  if(t.order !== "market"){
    const trig = parseFloat(t.trigger);
    if(!(trig > 0)){ c.msg = "Enter a trigger price."; return c; }
    if((t.order === "limit" || t.order === "stop") && trig >= price){ c.msg = "The trigger has to be below the current price."; return c; }
    if(t.order === "take" && trig <= price){ c.msg = "The trigger has to be above the current price."; return c; }
    c.trigger = trig;
  }
  c.ok = true;
  return c;
}
function ticketPreviewHtml(c){
  if(!c) return "";
  const t = state.ticket, key = t.key, buy = t.side === "buy";
  let h = "Price " + fmtPrice(c.price) + " · trading fee " + (c.rate * 100).toFixed(1) + "%";
  if(c.units > 0 && isFinite(c.units)){
    const when = t.order === "market" ? "" : " once the price " + (t.order === "take" ? "rises to " : "falls to ") + (c.trigger ? fmtPrice(c.trigger) : "your trigger");
    h += "<br>" + (buy ? "You pay " + money2(c.usd) + " for about " + fmtQty(c.units) + " " + key : "You receive about " + money2(c.usd) + " for " + fmtQty(c.units) + " " + key) + when + " (fee " + money2(c.fee) + ")";
    if(!buy && c.owned > 0 && (state.basis[key] || 0) > 0){
      const pl = c.usd - state.basis[key] * Math.min(1, c.units / c.owned);
      h += "<br>Estimated " + (pl >= 0 ? "gain " : "loss ") + '<span class="' + (pl >= 0 ? "up" : "down") + '">' + money2(Math.abs(pl)) + "</span> on this sale";
    }
  }
  if(!c.ok && c.msg) h += '<br><span style="color:var(--red)">' + c.msg + "</span>";
  return h;
}
function updateTicketPreview(){
  const c = ticketCalc();
  const el = document.getElementById("ticketPreview"), go = document.getElementById("ticketGo");
  if(el && c) el.innerHTML = ticketPreviewHtml(c);
  if(go && c) go.disabled = !c.ok;
}
function ticketChip(mode, v){
  const t = state.ticket; if(!t.key) return;
  const m = state.market[t.key], rate = FEE[instrType(t.key)], owned = state.portfolio[t.key] || 0;
  t.all = false;
  if(t.side === "buy"){
    const usd = Math.max(0, Math.min(mode === "pct" ? state.money * v : v, state.money));
    t.amount = t.unit === "usd" ? String(Math.floor(usd * 100) / 100) : String(Math.floor(usd / (m.price * (1 + rate)) * 1e6) / 1e6);
  } else {
    const units = Math.min(owned * v, owned);
    if(v >= 1){ t.all = true; t.amount = t.unit === "usd" ? String(Math.floor(owned * m.price * (1 - rate) * 100) / 100) : String(owned); }
    else t.amount = t.unit === "usd" ? String(Math.floor(units * m.price * (1 - rate) * 100) / 100) : String(Math.floor(units * 1e6) / 1e6);
  }
  renderPanel();
}
function placeOrder(){
  const t = state.ticket, c = ticketCalc();
  if(!c || !c.ok) return;
  const key = t.key, buy = t.side === "buy";
  if(t.order === "market"){
    if(buy){
      const r = execBuy(key, c.usd); if(!r) return;
      pushEntry(state.age, state.name + " buys " + fmtQty(r.units) + " " + key + " at " + fmtPrice(c.price) + " (fee " + money2(r.fee) + ").", {});
    } else {
      const r = execSell(key, c.units); if(!r) return;
      pushEntry(state.age, state.name + " sells " + fmtQty(r.units) + " " + key + " at " + fmtPrice(c.price) + " for " + money2(r.net) + ", a " + (r.pl >= 0 ? "gain" : "loss") + " of " + money2(Math.abs(r.pl)) + ".", {});
    }
  } else {
    state.orderSeq++;
    const kind = t.order === "limit" ? "buy-limit" : t.order === "stop" ? "stop-loss" : "take-profit";
    state.orders.push({id:"ord" + state.orderSeq, key, kind, trigger:c.trigger, usd: buy ? c.usd : 0, units: buy ? 0 : c.units, all: !!t.all});
    pushEntry(state.age, state.name + " places a " + ORDER_LABEL[kind] + " on " + key + " at " + fmtPrice(c.trigger) + ".", {});
  }
  t.amount = ""; t.trigger = ""; t.all = false;
  render();
}
function cancelOrder(id){
  const i = state.orders.findIndex(o => o.id === id); if(i < 0) return;
  state.orders.splice(i, 1);
  render();
}
function processOrders(a){
  if(!state.orders || !state.orders.length) return;
  const keep = [];
  state.orders.forEach(o => {
    const m = state.market[o.key]; if(!m) return;
    const p = m.price, sell = o.kind !== "buy-limit";
    if(sell && !(state.portfolio[o.key] > 1e-9)) return;
    const hit = o.kind === "take-profit" ? p >= o.trigger : p <= o.trigger;
    if(!hit){ keep.push(o); return; }
    if(!sell){
      const r = state.money >= o.usd ? execBuy(o.key, o.usd) : null;
      pushEntry(a, r ? state.name + "'s limit order fills: " + fmtQty(r.units) + " " + o.key + " bought at " + fmtPrice(p) + "."
                     : state.name + "'s limit order for " + o.key + " triggers, but there is not enough cash to fill it.", {});
    } else {
      const owned = state.portfolio[o.key];
      const r = execSell(o.key, o.all ? owned : Math.min(o.units, owned));
      if(r) pushEntry(a, state.name + "'s " + ORDER_LABEL[o.kind] + " on " + o.key + " triggers at " + fmtPrice(p) + ", selling " + fmtQty(r.units) + " for " + money2(r.net) + ".", {});
    }
  });
  state.orders = keep;
}
function ordersHtml(){
  let h = '<div class="plabel">Open orders (checked once a year, when markets update)</div>';
  state.orders.forEach(o => {
    const sell = o.kind !== "buy-limit";
    const what = sell ? "sell " + (o.all ? "everything" : fmtQty(o.units)) : "spend " + money2(o.usd);
    h += bankRow(ORDER_LABEL[o.kind] + " · " + o.key, what + " if the price " + (o.kind === "take-profit" ? "reaches " : "drops to ") + fmtPrice(o.trigger), '<button onclick="cancelOrder(\'' + o.id + '\')">Cancel</button>');
  });
  return h;
}

function setSort(mode){ state.invSort = mode; renderPanel(); }
function sortedList(list){
  const arr = list.slice();
  if(state.invSort === "gainers") arr.sort((a,b) => pctChange(b.key) - pctChange(a.key));
  else if(state.invSort === "losers") arr.sort((a,b) => pctChange(a.key) - pctChange(b.key));
  else if(state.invSort === "name") arr.sort((a,b) => a.name.localeCompare(b.name));
  return arr;
}

function ticketHtml(x){
  const t = state.ticket, c = ticketCalc(), buy = t.side === "buy";
  const pill = (label, active, js) => '<button class="sortbtn' + (active ? " active" : "") + '" onclick="' + js + '">' + label + "</button>";
  let h = '<div class="ticket">';
  h += '<div class="sortrow">' + pill("Buy", buy, "ticketSet('side','buy')") + pill("Sell", !buy, "ticketSet('side','sell')") + "</div>";
  const types = buy ? [["market","Market"],["limit","Limit buy"]] : [["market","Market"],["stop","Stop-loss"],["take","Take-profit"]];
  h += '<div class="sortrow">' + types.map(o => pill(o[1], t.order === o[0], "ticketSet('order','" + o[0] + "')")).join("") + "</div>";
  h += '<div class="sortrow">' + pill("In dollars", t.unit === "usd", "ticketSet('unit','usd')") + pill("In units", t.unit === "units", "ticketSet('unit','units')") + "</div>";
  h += '<input class="amt-input" type="number" inputmode="decimal" step="any" min="0" placeholder="' + (t.unit === "usd" ? "Amount in dollars" : "Number of units") + '" value="' + t.amount + '" oninput="ticketInput(\'amount\', this.value)">';
  if(t.order !== "market") h += '<input class="amt-input" type="number" inputmode="decimal" step="any" min="0" placeholder="' + (t.order === "take" ? "Sell when price reaches" : t.order === "stop" ? "Sell if price falls to" : "Buy when price falls to") + '" value="' + t.trigger + '" oninput="ticketInput(\'trigger\', this.value)">';
  const chips = [["25%","pct",0.25],["50%","pct",0.5],["75%","pct",0.75],["Max","pct",1]];
  if(buy) chips.push(["$100","usd",100],["$1,000","usd",1000],["$10,000","usd",10000]);
  h += '<div class="sortrow">' + chips.map(k => pill(k[0], false, "ticketChip('" + k[1] + "'," + k[2] + ")")).join("") + "</div>";
  h += '<div class="owned" id="ticketPreview">' + ticketPreviewHtml(c) + "</div>";
  h += '<div class="assetbuy"><button id="ticketGo" onclick="placeOrder()" ' + (c && c.ok ? "" : "disabled") + ">" + (t.order === "market" ? (buy ? "Buy now" : "Sell now") : "Place order") + "</button></div>";
  return h + "</div>";
}

function investRow(x){
  const m = state.market[x.key], t = state.ticket;
  const pct = pctChange(x.key) * 100, dir = pct >= 0 ? "up" : "down", arrow = pct >= 0 ? "▲" : "▼";
  const owned = state.portfolio[x.key] || 0, basis = state.basis[x.key] || 0, val = owned * m.price;
  const tagText = (instrType(x.key) === "stock" ? x.sector : "Crypto") + " · " + riskLabel(x.vol) + (x.div > 0 ? " · " + (x.div*100).toFixed(1) + "% div" : "");
  let pos = "";
  if(owned > 0){
    pos = " · Holding " + fmtQty(owned) + " (" + fmt(val) + ")";
    if(basis > 0){ const pl = val - basis; pos += ' · <span class="' + (pl >= 0 ? "up" : "down") + '">' + (pl >= 0 ? "+" : "-") + fmt(Math.abs(pl)).replace("-","") + " (" + (pl >= 0 ? "+" : "") + (pl / basis * 100).toFixed(1) + "%)</span>"; }
  }
  const nOrd = state.orders.filter(o => o.key === x.key).length;
  const open = t.key === x.key;
  let h = '<div class="invrow">' +
    '<div class="itop"><span><b>' + x.name + '</b> <span class="tick">' + x.key + '</span></span><span class="price ' + dir + '">' + arrow + " " + Math.abs(pct).toFixed(1) + "% " + fmtPrice(m.price) + "</span></div>" +
    '<div class="owned">' + tagText + pos + (nOrd ? " · " + nOrd + " open order" + (nOrd > 1 ? "s" : "") : "") + "</div>" +
    '<div class="assetbuy"><button onclick="openTicket(\'' + x.key + '\')">' + (open ? "Close ticket" : "Trade") + "</button>" +
    (owned > 0 && !open ? '<button onclick="sellPercent(\'' + x.key + '\',\'' + instrType(x.key) + '\',1)">Sell all</button>' : "") + "</div>";
  if(open) h += ticketHtml(x);
  return h + "</div>";
}

    if(f) return Object.assign({category:cat}, f);

  return null;
}
function assetsValue(){
  return state.assets.reduce((s,x) => s + x.value, 0);
}
function buyAsset(key, financed){
  const t = findCatalog(key);
  if(!t || state.age < CAT_MIN[t.category]) return;
  const price = inflR(t.price, 100);
  if(financed && FINANCEABLE.includes(t.category)){
    if(state.bankrupt || state.creditScore < 580) return;
    const down = Math.round(price * 0.2);
    if(state.money < down) return;
    state.money -= down;
    state.assetSeq++;
    const id = 'a' + state.assetSeq;
    state.assets.push({id, key:t.key, name:t.name, category:t.category, value:price, boughtPrice:price, boughtAge:state.age});
    const term = t.category === 'Cars' ? 5 : 30;
    const spread = Math.max(0.005, (700 - state.creditScore) / 5000);
    const apr = Math.max(0.03, Math.min(0.15, state.econ.rate + spread));
    takeLoan(t.category === 'Cars' ? 'Car' : 'Mortgage', price - down, term, apr, {assetId:id});
    pushEntry(state.age, `${state.name} finances a ${t.name} with ${fmt(down)} down at ${(apr*100).toFixed(1)}% APR.`, CAT_BUY_DELTA[t.category]);
  } else {
    if(state.money < price) return;
    state.money -= price;
    state.assetSeq++;
    state.assets.push({id:'a'+state.assetSeq, key:t.key, name:t.name, category:t.category, value:price, boughtPrice:price, boughtAge:state.age});
    pushEntry(state.age, `${state.name} buys ${t.name} in cash.`, CAT_BUY_DELTA[t.category]);
  }
  render();
}
const renoCost = x => Math.round(x.value * 0.06 / 100) * 100;
function renovate(id){
  const x = state.assets.find(y => y.id === id); if(!x || (x.category !== 'Homes' && x.category !== 'Real Estate')) return;
  if(x.renovatedAge !== undefined && state.age - x.renovatedAge < 5) return;
  const cost = renoCost(x); if(!ensureCash(cost)) return;
  state.money -= cost; x.renovatedAge = state.age;
  const added = Math.round(x.value * (0.07 + Math.random() * 0.08));
  x.value += added;
  pushEntry(state.age, `${state.name} spends ${fmt(cost)} renovating the ${x.name}, adding about ${fmt(added)} in value.`, {happy: x.category === 'Homes' ? 5 : 1});
  render();
}
function sellAsset(id){
  const i = state.assets.findIndex(x => x.id === id);
  if(i < 0) return;
  const x = state.assets[i];
  const fee = (x.category === 'Homes' || x.category === 'Cars' || x.category === 'Real Estate') ? 0.05 : 0;
  let proceeds = x.value * (1 - fee);
  const li = state.loans.findIndex(l => l.assetId === id);
  let hadLoan = false;
  if(li >= 0){ proceeds -= state.loans[li].balance; state.loans.splice(li,1); hadLoan = true; }
  state.money += proceeds;
  state.assets.splice(i, 1);
  pushEntry(state.age, `${state.name} sells the ${x.name} for ${fmt(x.value)}${hadLoan ? ', paying off the loan,' : ''} netting ${fmt(proceeds)}.`, {});
  render();
}
function assetsYear(a){
  let upkeep = 0;
  state.assets.forEach(x => {
    const t = findCatalog(x.key) || legacyTemplate(x);
    const noise = (Math.random()+Math.random()+Math.random()-1.5) / 1.5;
    x.value = Math.max(1, x.value * (1 + t.appreciation + noise * t.vol));
    if(t.category === 'Homes' || t.category === 'Real Estate') upkeep += x.value * t.upkeepPct;
    if(t.category === 'Cars') upkeep += t.upkeepFlat * state.econ.cumInflation;
  });
  if(upkeep <= 0) return;
  if(upkeep >= 20) pushEntry(a, `${state.name} covers maintenance and upkeep on their property.`, {money:-upkeep});
  else applyDelta({money:-upkeep});
}

function assetCatalogRow(t, cat){
  const locked = state.age < CAT_MIN[cat];
  const price = inflR(t.price, 100);
  const afford = state.money >= price;
  const financeable = FINANCEABLE.includes(cat);
  const down = Math.round(price * 0.2);
  const canFinance = financeable && state.money >= down && state.creditScore >= 580 && !state.bankrupt;
  return `<div class="invrow">
    <div class="itop"><span><b>${t.name}</b></span><span class="price">${fmt(price)}</span></div>
    <div class="owned">${t.appreciation >= 0 ? 'Tends to appreciate' : 'Tends to depreciate'} · ${riskLabel(t.vol)}${t.rentalYield ? ` · ${(t.rentalYield*100).toFixed(1)}% rental yield` : ''}</div>
    <div class="assetbuy">
      <button onclick="buyAsset('${t.key}')" ${(locked || !afford) ? 'disabled' : ''}>${locked ? `Locked · age ${CAT_MIN[cat]}` : 'Buy Cash'}</button>
      ${financeable ? `<button onclick="buyAsset('${t.key}',true)" ${(locked || !canFinance) ? 'disabled' : ''}>Finance (${fmt(down)} down)</button>` : ''}
    </div>
  </div>`;
}
function ownedAssetRow(x){
  const gp = (x.value - x.boughtPrice) / x.boughtPrice * 100;
  const dir = gp >= 0 ? 'up' : 'down';
  const fee = (x.category === 'Homes' || x.category === 'Cars') ? 0.05 : 0;
  const sellVal = x.value * (1 - fee);
  return `<div class="invrow">
    <div class="itop"><span><b>${x.name}</b></span><span class="price ${dir}">${gp >= 0 ? '+' : ''}${gp.toFixed(0)}% ${fmt(x.value)}</span></div>

    <div class="assetbuy"><button onclick="sellAsset('${x.id}')">Sell for ${fmt(sellVal)}</button>${(x.category === 'Homes' || x.category === 'Real Estate') ? `<button onclick="renovate('${x.id}')" ${(x.renovatedAge !== undefined && state.age - x.renovatedAge < 5) || state.money + state.savings < renoCost(x) ? 'disabled' : ''}>${x.renovatedAge !== undefined && state.age - x.renovatedAge < 5 ? 'Renovated recently' : 'Renovate (' + fmt(renoCost(x)) + ')'}</button>` : ''}</div>
  </div>`;
}

// ---------- Social: family & friends ----------
const FAMILY_TYPES = ['Mother','Father','Sibling','Spouse','Child','Grandchild'];
function relId(){ state.relSeq++; return 'r' + state.relSeq; }
function findRel(id){ return state.relationships.find(r => r.id === id); }

// ---------- People: personalities, interactions, and inheritance ----------
const TRAITS = ["Loyal","Funny","Ambitious","Moody","Generous","Flaky","Adventurous","Wise"];
const TRAIT_BLURB = {Loyal:"bonds fade slowly", Funny:"makes outings happier", Ambitious:"boosts your career", Moody:"has off days", Generous:"gives back", Flaky:"cancels plans", Adventurous:"loves a trip", Wise:"gives great advice"};
const PEER = ["Friend","Coworker"], KIN = ["Mother","Father","Sibling"], LOVE = ["Partner","Spouse"];
const EVERYONE = ["Friend","Coworker","Mother","Father","Sibling","Partner","Spouse","Child","Grandchild"];
function rollTraits(){ const n = Math.random() < 0.5 ? 1 : 2, t = []; while(t.length < n){ const x = pick(TRAITS); if(!t.includes(x)) t.push(x); } return t; }
function hasTrait(r, t){ return !!(r.traits && r.traits.includes(t)); }
function makeRel(type, o){
  o = o || {};
  const r = {id:relId(), name:freeName(), type, age: o.age !== undefined ? o.age : Math.max(0, state.age + rint(-3,3)),
             closeness: o.closeness !== undefined ? o.closeness : 35, traits: o.traits || rollTraits(), origin: o.origin || ""};
  if(o.livingTogether) r.livingTogether = true;
  return r;
}
// avoid giving two people in the same family the same name
function freeName(){
  const taken = [state.name].concat(state.relationships.map(x => x.name), state.relationships.filter(x => x.spouse).map(x => x.spouse.name));
  const free = FRIENDS.filter(f => !taken.includes(f));
  return pick(free.length ? free : FRIENDS);
}
function newRel(type, o){ const r = makeRel(type, o); state.relationships.push(r); return r; }
function bump(r, n){ r.closeness = FAMILY_TYPES.includes(r.type) ? Math.max(10, Math.min(100, Math.round(r.closeness + n))) : clamp(Math.round(r.closeness + n)); }
function bondLabel(r){
  const c = r.closeness;
  if(r.type === "Partner") return c >= 70 ? "Devoted" : c >= 40 ? "Serious" : "Casual";
  if(r.type === "Spouse") return c >= 75 ? "Devoted" : c >= 45 ? "Steady" : "Strained";
  if(FAMILY_TYPES.includes(r.type)) return c >= 80 ? "Inseparable" : c >= 55 ? "Close" : c >= 30 ? "Cordial" : "Distant";
  return c >= 85 ? "Best friend" : c >= 70 ? "Close friend" : c >= 45 ? "Friend" : c >= 20 ? "Acquaintance" : "Fading";
}

function initFamily(){
  state.famEstate = rollFamilyEstate();
  const rels = [
    makeRel("Mother", {age: state.age + 27 + rint(0,6), closeness: 70 + rint(-10,15), livingTogether:true, origin:"family"}),
    makeRel("Father", {age: state.age + 29 + rint(0,6), closeness: 65 + rint(-10,15), livingTogether:true, origin:"family"}),
  ];
  if(Math.random() < 0.6) rels.push(makeRel("Sibling", {age: Math.max(0, state.age + rint(-4,4)), closeness: 55 + rint(-15,20), origin:"family"}));
  return rels;
}

// ---- yearly life of relationships ----
function relationshipsYear(a, prompted){
  const moments = [];
  state.relationships.slice().forEach(rel => {
    rel.age++;
    const isFamily = FAMILY_TYPES.includes(rel.type);
    let decay = isFamily ? rint(-2,2) : rint(-4,1);
    if(hasTrait(rel, "Loyal") && decay < 0) decay = Math.ceil(decay / 2);
    if(hasTrait(rel, "Moody")) decay += rint(-2,2);
    bump(rel, decay);
    if(!isFamily && rel.closeness <= 0){
      pushEntry(a, `${state.name} and ${rel.name} drift apart${rel.type === 'Partner' ? ' and go their separate ways' : ''}.`, {happy:-4});
      state.relationships = state.relationships.filter(r => r.id !== rel.id);
      return;
    }
    const careHealth = rel.care === "home" || rel.care === "you" ? 72 : rel.care === "other" ? 50 : 60;
    if(rel.age > 1 && Math.random() < mortalityChance(rel.age, careHealth)){
      pushEntry(a, `${rel.name}, ${state.name}'s ${rel.type.toLowerCase()}, passes away.`, {happy: -Math.round(4 + rel.closeness / 10)});
      state.relationships = state.relationships.filter(r => r.id !== rel.id);
      if(rel.type === "Mother" || rel.type === "Father") parentDied(rel);
      else if(rel.type === "Spouse") createEstate("spouse", rel);
      return;
    }
    if(rel.owes && Math.random() < (hasTrait(rel, "Flaky") ? 0.1 : hasTrait(rel, "Loyal") || hasTrait(rel, "Generous") ? 0.45 : 0.3)){
      pushEntry(a, `${rel.name} pays back the ${fmt(rel.owes)} ${state.name} lent them.`, {money: rel.owes});
      rel.owes = 0; bump(rel, 4);
    }
    if(rel.type === "Child") childYear(rel, a, moments);
    else if(rel.type === "Mother" || rel.type === "Father") parentYear(rel, a, moments);
    else if(rel.type === "Sibling" && rel.age >= 21 && state.age >= 18 && Math.random() < 0.025) moneyAsk(rel, moments);
  });
  loveYear(a, moments);
  // close bonds lift your mood; estranged family weighs on it
  const strong = state.relationships.filter(r => r.closeness >= 70).length;
  const estranged = state.relationships.filter(r => ["Mother","Father","Sibling","Child","Spouse","Partner"].includes(r.type) && r.closeness < 30).length;
  const lift = Math.min(3, strong) - Math.min(2, estranged);
  if(lift) applyDelta({happy: lift});
  growFamilyEstate();
  estatesYear(a);
  // at most one family moment asks for a decision each year; the rest play out on their own
  const shown = !prompted && moments.length && Math.random() < 0.75 ? pickWeighted(moments, m => m.w) : null;
  moments.forEach(m => { if(m !== shown && m.fallback) m.fallback(); });
  if(shown){ presentCustom(shown.prompt, shown.opts); return true; }
  return false;
}

const ixCost = ix => ix.cost ? inflR(ix.cost, 5) : 0;
function ixState(r, ix){
  if(!ix.who.includes(r.type)) return {show:false};
  if(ix.maxClose !== undefined && r.closeness > ix.maxClose) return {show:false};
  if(ix.needs && !ix.needs(r)) return {show:false};
  if(ix.minAge && state.age < ix.minAge) return {show:true, ok:false, why:"from age " + ix.minAge};
  if(ix.minClose !== undefined && r.closeness < ix.minClose) return {show:true, ok:false, why:"needs a closer bond"};
  if(state.done["ix_" + ix.key + "_" + r.id]) return {show:true, ok:false, why:"done this year"};
  if((state.done["ixn_" + r.id] || 0) >= 3) return {show:true, ok:false, why:"enough for this year"};
  const c = ixCost(ix);
  if(c && state.money + state.savings < c) return {show:true, ok:false, why:"costs " + fmt(c)};
  return {show:true, ok:true, why:""};
}
function interact(id, key){
  const r = findRel(id), ix = INTERACTIONS.find(x => x.key === key);
  if(!r || !ix || !ixState(r, ix).ok) return;
  state.done["ix_" + key + "_" + id] = true;
  state.done["ixn_" + id] = (state.done["ixn_" + id] || 0) + 1;
  const n = state.name, rn = r.name, cost = ixCost(ix);
  const T = s => s.replace(/\{n\}/g, n).replace(/\{r\}/g, rn);
  if(hasTrait(r, "Flaky") && key !== "call" && Math.random() < 0.2){
    pushEntry(state.age, rn + " cancels at the last minute, and " + n + " is left with a free evening.", {happy:-1});
    render(); return;
  }
  if(cost){ ensureCash(cost); state.money -= cost; }
  let gain = ix.gain ? rint(ix.gain[0], ix.gain[1]) : 0, happy = ix.happy ? rint(ix.happy[0], ix.happy[1]) : 0, smarts = ix.smarts ? rint(ix.smarts[0], ix.smarts[1]) : 0;
  const delta = {}; let text = "", extra = "";
  if(hasTrait(r, "Loyal")) gain = Math.round(gain * 1.15);
  if(ix.adv && hasTrait(r, "Adventurous")){ gain = Math.round(gain * 1.3); happy += 1; extra += " " + rn + " lives for this kind of thing."; }
  if(ix.fun && hasTrait(r, "Funny")){ happy += 1; extra += " " + rn + " keeps everyone laughing."; }
  if(ix.wise && hasTrait(r, "Wise")){ smarts *= 2; extra += " " + rn + " has real wisdom to share."; }
  if(hasTrait(r, "Moody") && Math.random() < 0.25){ gain = Math.round(gain * 0.4); happy -= 1; extra += " " + rn + " is in a mood, though."; }
  if(ix.kind === "gift" && hasTrait(r, "Generous")){
    gain = Math.round(gain * 1.2);
    if(cost && Math.random() < 0.3){ delta.money = Math.round(cost * 0.5); extra += " " + rn + " insists on paying part of it back."; }
  }
  if(ix.kind === "talk" && r.closeness < 50 && Math.random() < 0.25){
    gain = 2; happy = -1; text = n + " tries to open up to " + rn + ", but it comes out awkward.";
  } else if(ix.kind === "favor"){
    const p = r.closeness / 110 + (hasTrait(r, "Generous") ? 0.15 : 0);
    if(Math.random() < p){
      const roll = Math.random();
      if(roll < 0.45){ const amt = inflR(rint(150, 900), 10); delta.money = (delta.money || 0) + amt; text = rn + " helps " + n + " out with " + fmt(amt) + " when money is tight."; gain = 3; happy = 2; }
      else if(roll < 0.75 && state.job){ state.boost = true; text = rn + " puts in a good word for " + n + " at work, which should help the next promotion."; gain = 3; happy = 3; }
      else { text = rn + " lends a hand with something big, no questions asked."; gain = 4; happy = 3; smarts = 1; }
    } else { gain = -5; happy = -2; text = rn + " cannot help, and the ask leaves things a little strained."; }
  } else if(ix.kind === "intro"){
    if(Math.random() < 0.65 && state.relationships.length < 60){
      const p = newRel("Friend", {age: Math.max(0, r.age + rint(-5,5)), closeness: rint(30,45), origin: "through " + rn});
      text = rn + " introduces " + n + " to " + p.name + ", and they hit it off."; gain = 2; happy = 4;
    } else { text = rn + " tries to set up an introduction, but it fizzles."; gain = 2; happy = 0; }
  } else if(ix.kind === "collab"){
    state.boost = true;
    text = n + " and " + rn + " team up on a project, and leadership notices.";
    if(hasTrait(r, "Ambitious")){ extra += " " + rn + " pushes the work to another level."; smarts = 2; }
  } else if(ix.kind === "amends"){
    if(Math.random() < 0.7){ gain = rint(12,18); happy = 3; text = n + " makes amends with " + rn + ", and the air finally clears."; }
    else { gain = -2; happy = -2; text = n + " reaches out to " + rn + ", but the hurt runs deeper than one apology."; }
  }
  if(!text) text = T(pick(ix.texts));
  bump(r, gain);
  if(happy) delta.happy = happy;
  if(smarts) delta.smarts = smarts;
  pushEntry(state.age, text + extra, delta);
  render();
}

// ---- inheritance ----
function rollFamilyEstate(){            // the family's wealth, in today's dollars
  const r = Math.random();
  if(r < 0.52) return rint(15000, 90000);
  if(r < 0.82) return rint(110000, 420000);
  if(r < 0.96) return rint(550000, 2200000);
  return rint(3000000, 12000000);
}
function growFamilyEstate(){
  if(!state.famEstate) return;
  const parents = state.relationships.filter(r => r.type === "Mother" || r.type === "Father");
  if(!parents.length) return;
  const oldest = Math.max(...parents.map(p => p.age));
  state.famEstate = Math.max(0, Math.round(state.famEstate * (1 + rint(-1,4) / 100) * (oldest >= 78 ? 0.96 : 1)));
}
function estateTax(total){
  const threshold = 1500000 * state.econ.cumInflation;
  return Math.round(Math.max(0, total - threshold) * (state.trust ? 0.18 : 0.35));
}
const HEIRLOOMS = {
  Jewelry: ["a gold pocket watch", "a diamond ring", "a pearl necklace", "a silver locket"],
  Collectibles: ["a vintage record collection", "an antique clock", "a set of fine china", "a box of old family medals and photographs"],
};
function parentDied(rel){
  const other = state.relationships.find(r => r.type === "Mother" || r.type === "Father");
  if(other){ pushEntry(state.age, `${rel.name}'s estate passes to ${other.name}.`, {}); return; }
  createEstate("parents", rel);
}
function createEstate(kind, rel){
  const cum = state.econ.cumInflation;
  const base = kind === "parents" ? state.famEstate * (0.9 + Math.random() * 0.2)
                                  : rint(20000, 160000) * (1 + Math.max(0, netWorth() / cum) / 1e6 * 0.15);
  const total = Math.round(base * cum / 100) * 100;
  const sibs = kind === "parents" ? state.relationships.filter(r => r.type === "Sibling").length : 0;
  const tax = estateTax(total), net = total - tax, heirs = 1 + sibs;
  const homeValue = (kind === "parents" && total >= 200000 * cum && Math.random() < 0.6) ? Math.round(net * 0.55 / 100) * 100 : 0;
  const cashPool = net - homeValue;
  let heirloom = null;
  if(total >= 30000 * cum && Math.random() < 0.55){
    const cat = Math.random() < 0.5 ? "Jewelry" : "Collectibles";
    heirloom = {category: cat, name: pick(HEIRLOOMS[cat]), value: Math.round(rint(1500, 20000) * cum * (total > 500000 * cum ? 3 : 1) / 100) * 100};
  }
  state.estateSeq++;
  const e = {id:"e" + state.estateSeq, kind, from:rel.name, relType:rel.type, total, tax, heirs, sibs, cash: Math.round(cashPool / heirs),
             homeValue, homeShare: Math.round(homeValue / heirs), heirloom, deadline: state.age + 2};
  state.estates.push(e);
  if(kind === "parents") state.famEstate = 0;       // a spouse's death must not wipe out the parents' estate
  pushEntry(state.age, kind === "parents" ? `${rel.name}'s passing leaves an estate to settle.` : `${rel.name}'s passing leaves ${state.name} an inheritance to settle.`, {});
  if(state.age < 18) settleEstate(e.id, "cash"); else state.panel = "soc";
}
function addLegacyAsset(key, name, category, value){
  state.assetSeq++;
  state.assets.push({id:"a" + state.assetSeq, key, name, category, value, boughtPrice:value, boughtAge:state.age});
}
function settleEstate(id, how){
  const i = state.estates.findIndex(x => x.id === id); if(i < 0) return;
  const e = state.estates[i], n = state.name;
  let cash = e.cash + e.homeShare, happy = 3, msg = "", keepHome = false;
  if(how === "home"){
    if(!e.homeValue) return;
    const buyout = Math.round(e.homeValue * e.sibs / e.heirs);
    if(!ensureCash(buyout - e.cash)) return;
    cash = e.cash - buyout; keepHome = true; happy = 8;
    msg = `${n} keeps the family home${buyout ? ", buying out the siblings for " + fmt(buyout) : ""}`;
  } else if(how === "donate"){
    const half = Math.round(cash / 2);
    cash -= half; happy = 7;
    if(state.social.account) state.social.reputation = clampRep(state.social.reputation + 5);
    bondDelta(["Sibling"], 3);
    msg = `${n} donates ${fmt(half)} of the inheritance to charity`;
  } else if(how === "contest"){
    if(!e.sibs) return;
    const fee = inflR(4000, 100); if(!ensureCash(fee)) return;
    state.money -= fee;
    const win = Math.random() < 0.5;
    cash = Math.round(cash * (win ? 1.35 : 0.85)); happy = win ? 4 : -4;
    bondDelta(["Sibling"], win ? -12 : -20);
    msg = `${n} contests the will and ${win ? "wins a larger share" : "loses, with a smaller share"} after ${fmt(fee)} in legal fees`;
  } else {
    msg = e.homeValue ? `${n} sells the family home and settles the estate` : `${n} settles the estate`;
  }
  state.money += cash;
  state.inheritedTotal = (state.inheritedTotal || 0) + cash + (keepHome ? e.homeValue : 0);
  if(keepHome) addLegacyAsset("familyhome", "Family Home", "Homes", e.homeValue);

function heirLines(){

  const orphans = {};
  state.relationships.filter(g => g.type === "Grandchild" && !findRel(g.parentId)).forEach(g => (orphans[g.parentId] = orphans[g.parentId] || []).push(g));

function legacyPlan(){

  const lines = heirLines(), kids = lines.flatMap(l => l.members);

  if(state.will === "charity"){ charity = net; family = 0; }
  else if(state.will === "split"){ charity = Math.round(net / 2); family = net - charity; }
  let spouseShare = 0, kidsPool = family;
  if(spouse && kids.length){ spouseShare = Math.round(family / 2); kidsPool = family - spouseShare; }   // the surviving parent keeps half
  else if(spouse){ spouseShare = family; kidsPool = 0; }
  const chosen = state.willSplit === "one" && kids.find(k => k.id === state.willHeir);
  const weights = lines.map(l => chosen ? (l.members.includes(chosen) ? 1 : 0) : state.willSplit === "bond" ? Math.pow(Math.max(10, l.close), 2) : 1);
  const wsum = weights.reduce((t, w) => t + w, 0) || 1, shares = {};
  lines.forEach((l, i) => {

function heirCash(kid, plan){

    const loan = state.loans.find(l => l.assetId === x.id), net = x.value - (loan ? loan.balance : 0);
    if(net > 0 && net <= left){ assets.push(x.id); left -= net; assetValue += net; }

function savingsRateFor(bal){

function creditTier(s){ return s>=800?'Excellent': s>=740?'Very Good': s>=670?'Good': s>=580?'Fair':'Poor'; }
function adjustCredit(d){ state.creditScore = Math.max(300, Math.min(850, Math.round(state.creditScore + d))); }
function incomeTax(gross){
  const brackets = [[40000,0.12],[100000,0.22],[Infinity,0.32]];
  let tax = 0, lower = 0;
  for(const [cap,rate] of brackets){
    const amt = Math.max(0, Math.min(gross,cap) - lower);
    tax += amt * rate; lower = cap;
    if(gross <= cap) break;
  }
  return tax;
}
function updateEconomy(a){
  const e = state.econ;
  if(e.recession){
    e.recessionLeft--;
    if(e.recessionLeft <= 0){ e.recession = false; pushEntry(a, `The economy climbs out of recession.`, {happy:3}); }
  } else if(Math.random() < 0.06){
    e.recession = true; e.recessionLeft = rint(1,3);
    pushEntry(a, `A recession hits — jobs get scarcer and markets get shakier.`, {happy:-4});
  }
  e.rate = Math.max(0.01, Math.min(0.14, e.rate + (Math.random()+Math.random()-1)*0.01 + (0.04-e.rate)*0.1 + (e.recession?0.01:0)));
  e.inflation = Math.max(-0.01, Math.min(0.12, e.inflation + (Math.random()+Math.random()-1)*0.008 + (0.025-e.inflation)*0.1 + (e.recession?0.012:0)));
  e.cumInflation *= (1 + e.inflation);
}

function payoffLoan(id){

function loansYear(a){
  let missed = false;
  state.loans.slice().forEach(l => {
    if(l.deferred) return;
    const interest = l.balance * l.apr;
    const due = Math.min(l.yearlyPayment, l.balance + interest);
    if(ensureCash(due)){
      state.money -= due;
      l.balance = Math.max(0, l.balance + interest - due);
      l.yearsLeft--;
      adjustCredit(l.type === 'Builder' ? 8 : 2);
      if(l.balance <= 1 || l.yearsLeft <= 0){
        state.loans = state.loans.filter(x => x.id !== l.id);
        if(l.type === 'Builder') adjustCredit(25);
      }
    } else {
      l.balance += interest;
      missed = true;
    }
  });
  if(missed){ adjustCredit(-25); pushEntry(a, `${state.name} misses a loan payment this year — credit takes a hit.`, {}); }
}

function ipoBusiness(){
  const b = state.business; if(!b || b.value < ipoMin() || b.employees < 5) return;
  const t = bizType(b.type);
  const baseTicker = t.name.replace(/[^A-Za-z]/g,'').slice(0,4).toUpperCase();
  let ticker = baseTicker, n = 2;
  while(state.market[ticker]) ticker = baseTicker + (n++);
  const totalShares = 1000000, ipoPrice = +(b.value / totalShares).toFixed(2), sharesRetained = 600000;
  const cashRaised = Math.round((totalShares - sharesRetained) * ipoPrice);
  const newStock = {key:ticker, name:t.name + ' Inc.', sector:'IPO', base:ipoPrice, drift:0.07, vol:0.35, div:0};
  state.ipos.push(newStock);
  syncIpos();
  state.portfolio[ticker] = (state.portfolio[ticker] || 0) + sharesRetained;
  state.money += cashRaised;
  pushEntry(state.age, `${state.name} takes the business public! ${ticker} starts trading at ${fmt(ipoPrice)}/share, raising ${fmt(cashRaised)}.`, {happy:15});
  state.business = null;
  render();
}
function businessYear(a){
  const b = state.business; if(!b) return 0;
  const t = bizType(b.type);
  b.marketing = Math.max(0, b.marketing * 0.6);
  const priceMult = b.price === 'low' ? 0.85 : b.price === 'high' ? 1.25 : 1;
  const repDrift = b.price === 'low' ? 1 : b.price === 'high' ? -1 : 0;
  b.reputation = clampRep(b.reputation + repDrift + (Math.random()*4 - 2));
  const cum = state.econ.cumInflation;
  const revenue = b.employees * t.revPerEmp * cum * (1 + 0.15*(b.locations-1)) * priceMult * (1 + b.marketing) * (0.5 + b.reputation/100) * (state.econ.recession ? 0.85 : 1);
  const overhead = (b.employees * BIZ_OVERHEAD_PER_EMP + b.locations * BIZ_OVERHEAD_PER_LOC) * cum;
  const profit = Math.round(revenue - overhead);
  b.lastProfit = profit;
  b.value = Math.max(1000, b.value + profit * 0.6 + (Math.random()*0.1 - 0.05) * b.value);

  const leverage = totalDebt() > 0 ? Math.min(0.08, totalDebt() / Math.max(1,b.value) * 0.05) : 0;
  const failChance = t.risk * (state.econ.recession ? 1.8 : 1) * (b.reputation < 30 ? 1.6 : 1) + leverage;
  if(Math.random() < failChance){
    if(profit > 0 && b.reputation >= 60 && Math.random() < 0.6){
      pushEntry(a, `${state.name}'s business hits a rough patch but its loyal customers carry it through.`, {happy:-3, biz:-15});
      return profit;
    }
    pushEntry(a, `${state.name}'s business fails and shuts its doors.${totalDebt()>0 ? ' Any business loans remain due.' : ''}`, {happy:-12});
    state.business = null;
    return 0;
  }
  return profit;
}
function fileBankruptcy(){

  state.creditCard = null;
  state.loans = state.loans.filter(l => l.type === 'Mortgage' || l.type === 'Car' || l.type === 'Student');

function emergencyYear(a){

  const sev = pick(['medical','car','home','family']);
  const cost = inflR(rint(500,4000) * (sev === 'medical' ? 3 : 1), 10);

  pushEntry(a, `${state.name} deals with ${msgs[sev]}${covered > 0 ? ', largely covered by insurance' : ''}, costing ${fmt(out)}.`, {money:-out, happy:-3});
}
function negotiateRaise(){

const lottoCost = () => inflR(20, 1);
function buyLottery(){

function yearlyFinances(a){
  const e = state.edu, econ = state.econ;
  let income = 0;
  if(a >= 8 && a < 18) income += Math.round(300 * econ.cumInflation);
  if(state.job){
    // retirement contributions come out before tax, and the employer matches half of them up to 3% of salary
    const R = state.retirement, contrib = Math.round(state.job.salary * R.pct), match = Math.round(Math.min(contrib, state.job.salary * 0.06) / 2);
    const taxable = state.job.salary - contrib;
    income += Math.round(taxable - incomeTax(taxable));
    if(contrib > 0){ R.balance += contrib + match; R.contributed += contrib; }
  }
  retirementYear();
  state.assets.forEach(x => { if(x.category === 'Real Estate'){ const t = findCatalog(x.key); income += Math.round(x.value * (t.rentalYield || 0)); } });
  income += businessYear(a);
  if(a >= 65 && !state.job && !state.retired) retire(true);
  if(state.retired && state.pension > 0){
    income += Math.round(state.pension * 0.92);                          // after a modest tax
    state.pension = Math.round(state.pension * (1 + Math.max(0, econ.inflation)));   // yearly cost-of-living adjustment
  }
  if(state.savings > 0) state.savings += state.savings * savingsRate();
  state.cds = state.cds.filter(cd => {
    cd.value *= (1 + cd.rate); cd.yearsLeft--;
    if(cd.yearsLeft > 0) return true;
    state.savings += cd.value;
    pushEntry(a, `A ${cd.term}-year CD matures and ${fmt(cd.value)} lands in ${state.name}'s savings.`, {happy:2});
    return false;
  });
  checkGoal(a);

  let expenses = 0;
  const independent = a >= 20 || !!state.job;
  if(a >= 18 && independent && !state.movedOut){
    state.movedOut = true;
    pushEntry(a, `${state.name} moves out on their own — rent and bills are now their responsibility.`, {});
  }
  if(a >= 18 && independent){
    const ownsHome = state.assets.some(x => x.category === 'Homes');
    if(!ownsHome) expenses += Math.round(10000 * econ.cumInflation);
    if(state.insurance.health) expenses += Math.round(1200 * econ.cumInflation);
    if(state.insurance.auto && state.assets.some(x => x.category === 'Cars')) expenses += Math.round(900 * econ.cumInflation);
    if(state.insurance.home && ownsHome) expenses += Math.round(800 * econ.cumInflation);
    expenses += Math.round(1800 * econ.cumInflation);
  }
  if(a >= 65) expenses = Math.round(expenses * 0.85);                     // downsized, simpler living
  const net = income - expenses;
  if(net !== 0) pushEntry(a, net >= 0 ? 'A decent year financially — income covers the bills with some left over.' : 'Bills and living costs outpace income this year.', {money:net});
  state.lastAutoSaved = 0; state.lastAutoInvested = 0;
  if(state.autoSave > 0 && net > 0 && state.money > 0){
    const amt = Math.min(state.money, Math.round(net * state.autoSave));
    if(amt > 0){ state.money -= amt; state.savings += amt; state.lastAutoSaved = amt; checkGoal(a); }
  }

  if(state.autoInvest > 0 && net > 0 && state.money > 0 && a >= 18){
    const amt = Math.min(state.money, Math.round(net * state.autoInvest));
    if(amt >= 10 && execBuy('IDXF', amt)) state.lastAutoInvested = amt;
  }
  if(state.bankrupt && a >= state.bankruptUntilAge) state.bankrupt = false;
  if(state.money <= -20000 && !state.bankrupt){
    state.creditCard = null;
    state.loans = state.loans.filter(l => l.type === 'Mortgage' || l.type === 'Car' || l.type === 'Student');
    state.money = 0;
    adjustCredit(-130);
    state.bankrupt = true; state.bankruptUntilAge = a + 4; state.bankruptcies++;
    pushEntry(a, `${state.name}'s debts spiral out of control, forcing bankruptcy. Credit is wrecked for years.`, {happy:-15});
  }
}
