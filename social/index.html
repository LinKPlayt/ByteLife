<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Social Hub</title>
<meta name="description" content="Plan, schedule and track posts for all your social media accounts in one place.">
<meta name="theme-color" content="#F4F5F7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235B5BD6'/%3E%3Ccircle cx='22' cy='32' r='7' fill='white'/%3E%3Ccircle cx='44' cy='20' r='7' fill='white'/%3E%3Ccircle cx='44' cy='44' r='7' fill='white'/%3E%3Cpath d='M22 32L44 20M22 32L44 44' stroke='white' stroke-width='4'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #F4F5F7; --surface: #FFFFFF; --surface-2: #F0F1F4; --border: #E2E4EA;
  --text: #16181D; --muted: #626875; --accent: #5B5BD6; --accent-text: #FFFFFF;
  --danger: #D1343F; --warn: #B76E00; --ok: #18794E;
  --danger-bg: #FDECEC; --warn-bg: #FFF4DC; --ok-bg: #E6F6EC;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 12px rgba(16,24,40,.06);
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111216; --surface: #1A1C22; --surface-2: #23252D; --border: #2F323B;
    --text: #ECEDF0; --muted: #9AA0AC; --accent: #8E8EF5; --accent-text: #111216;
    --danger: #FF6B72; --warn: #F2B544; --ok: #4CC38A;
    --danger-bg: #3A1D20; --warn-bg: #3A2E14; --ok-bg: #16301F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111216; --surface: #1A1C22; --surface-2: #23252D; --border: #2F323B;
  --text: #ECEDF0; --muted: #9AA0AC; --accent: #8E8EF5; --accent-text: #111216;
  --danger: #FF6B72; --warn: #F2B544; --ok: #4CC38A;
  --danger-bg: #3A1D20; --warn-bg: #3A2E14; --ok-bg: #16301F;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-bottom: calc(80px + env(safe-area-inset-bottom));
}
button, input, textarea, select { font: inherit; color: inherit; }
/* 16px stops iOS from zooming into fields */
input, textarea, select { font-size: 16px; }
a { color: var(--accent); }
h1, h2, h3 { margin: 0; line-height: 1.2; }
h2 { font-size: 17px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

header.top {
  position: sticky; top: 0; z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.top-inner {
  max-width: 1100px; margin: 0 auto; padding: 10px 16px;
  display: flex; align-items: center; gap: 16px;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
.brand svg { width: 28px; height: 28px; }
nav.tabs { display: flex; gap: 4px; margin-left: auto; }
nav.tabs button {
  border: 0; background: none; padding: 8px 12px; border-radius: 10px; cursor: pointer;
  color: var(--muted); font-weight: 600;
}
nav.tabs button[aria-current="page"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

main { max-width: 1100px; margin: 0 auto; padding: 16px; }
.view[hidden] { display: none; }
.stack > * + * { margin-top: 16px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spacer { flex: 1; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 16px;
}
.section-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.section-head h2 { flex: 1; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px;
  text-decoration: none; white-space: nowrap; min-height: 38px;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 4px 10px; min-height: 30px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: none; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { padding: 14px 16px; }
.stat .num { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
.stat .lbl { color: var(--muted); font-size: 13px; }
.stat.alert .num { color: var(--danger); }

.acct-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.acct { display: flex; flex-direction: column; gap: 10px; padding: 14px; }
.acct-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.acct-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct-meta { min-width: 0; flex: 1; }
.acct .links { display: flex; gap: 6px; flex-wrap: wrap; }
.followers { display: flex; align-items: baseline; gap: 8px; }
.followers b { font-size: 18px; }
.delta.up { color: var(--ok); } .delta.down { color: var(--danger); }

.pico {
  flex: none; width: 36px; height: 36px; border-radius: 10px; color: #fff;
  display: inline-grid; place-items: center; font-weight: 800; font-size: 13px; letter-spacing: -.02em;
}
.pico.sm { width: 22px; height: 22px; border-radius: 6px; font-size: 10px; }

.empty { text-align: center; padding: 28px 16px; color: var(--muted); }
.empty .btn { margin-top: 10px; }

/* Posts */
.post-list { display: grid; gap: 10px; }
.post { padding: 14px; display: grid; gap: 10px; }
.post-head { display: flex; align-items: center; gap: 8px; }
.post-when { min-width: 0; }
.post-when { font-weight: 700; }
.post-text {
  white-space: pre-wrap; word-break: break-word;
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
}
.badge { white-space: nowrap; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.badge.overdue { background: var(--danger-bg); color: var(--danger); }
.badge.soon { background: var(--warn-bg); color: var(--warn); }
.badge.done { background: var(--ok-bg); color: var(--ok); }
.targets { display: flex; flex-wrap: wrap; gap: 6px; }
.target {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 4px;
  border: 1px solid var(--border); border-radius: 99px; background: var(--surface-2); font-size: 13px;
}
.target .h { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.target.posted { background: var(--ok-bg); border-color: transparent; }
.target button {
  border: 0; border-radius: 99px; padding: 3px 10px; font-size: 12px; font-weight: 700; cursor: pointer;
  background: var(--accent); color: var(--accent-text);
}
.target.posted button { background: none; color: var(--ok); }
.target .over { color: var(--danger); font-weight: 700; font-size: 12px; }

.filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--muted); font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.search { flex: 1; min-width: 160px; }

input[type=text], input[type=url], input[type=number], input[type=datetime-local], input[type=search], textarea, select {
  width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface); outline: none;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
label.field { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
label.field .hint { font-weight: 400; color: var(--muted); font-size: 13px; }

/* Calendar */
.cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.cal-head h2 { flex: 1; font-size: 19px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .dow { text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); padding: 4px 0; }
.day {
  min-height: 104px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 6px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; min-width: 0; text-align: left;
}
.day:hover { border-color: var(--accent); }
.day.out { opacity: .45; }
.day.today .dnum { background: var(--accent); color: var(--accent-text); }
.dnum { font-size: 12px; font-weight: 700; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 99px; }
.pill {
  font-size: 12px; padding: 2px 6px; border-radius: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  border-left: 3px solid var(--c, var(--accent)); background: var(--surface-2); cursor: pointer;
}
.pill.done { opacity: .55; text-decoration: line-through; }
.more { font-size: 12px; color: var(--muted); }
.dots { display: none; gap: 3px; flex-wrap: wrap; }
.dots i { width: 7px; height: 7px; border-radius: 99px; background: var(--c, var(--accent)); }
@media (max-width: 640px) {
  .day { min-height: 56px; padding: 4px; align-items: center; }
  .pill, .more { display: none; }
  .dots { display: flex; justify-content: center; }
}
.day-list { margin-top: 16px; }

/* Dialog */
dialog {
  border: 0; padding: 0; border-radius: 18px; background: var(--surface); color: var(--text);
  width: min(640px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); box-shadow: 0 20px 60px rgba(0,0,0,.35);
}
dialog::backdrop { background: rgba(10,12,20,.5); }
.dlg { display: flex; flex-direction: column; max-height: calc(100dvh - 24px); }
.dlg-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.dlg-head h2 { flex: 1; }
.dlg-body { padding: 16px; overflow: auto; display: grid; gap: 16px; }
.dlg-foot { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }
textarea { resize: vertical; min-height: 140px; }
.choose { display: flex; flex-wrap: wrap; gap: 6px; }
.choose label {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 99px;
  border: 1px solid var(--border); cursor: pointer; font-size: 14px; user-select: none;
}
.choose input { position: absolute; opacity: 0; pointer-events: none; }
.choose label:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.choose label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.limits { display: grid; gap: 4px; }
.limit { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.limit .bar { flex: 1; height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.limit .bar i { display: block; height: 100%; background: var(--ok); }
.limit.over .bar i { background: var(--danger); }
.limit.near .bar i { background: var(--warn); }
.limit .n { font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
.limit.over .n { color: var(--danger); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px dashed var(--border); background: none; border-radius: 99px; padding: 3px 10px; font-size: 13px; cursor: pointer; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 520px) { .two { grid-template-columns: 1fr; } }

.snip { display: flex; gap: 8px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--border); }
.snip:first-child { border-top: 0; }
.snip .t { flex: 1; white-space: pre-wrap; word-break: break-word; }

.banner {
  display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px;
  background: var(--warn-bg); color: var(--text); flex-wrap: wrap;
}
.banner b { color: var(--warn); }

#toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px;
  opacity: 0; pointer-events: none; transition: .2s; z-index: 50; max-width: calc(100vw - 32px); text-align: center;
}
#toast.show { opacity: 1; transform: translateX(-50%); }

.fab {
  position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 20;
  border-radius: 99px; padding: 14px 20px; box-shadow: 0 8px 24px rgba(0,0,0,.25); font-size: 15px;
}

@media (max-width: 720px) {
  .top-inner { flex-wrap: wrap; gap: 6px; }
  nav.tabs { margin-left: 0; width: 100%; overflow-x: auto; }
  nav.tabs button { flex: 1; padding: 8px 6px; }
  #toast { bottom: calc(84px + env(safe-area-inset-bottom)); }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#5B5BD6"/><circle cx="22" cy="32" r="7" fill="#fff"/><circle cx="44" cy="20" r="7" fill="#fff"/><circle cx="44" cy="44" r="7" fill="#fff"/><path d="M22 32L44 20M22 32L44 44" stroke="#fff" stroke-width="4"/></svg>
      Social Hub
    </div>
    <nav class="tabs" aria-label="Sections">
      <button data-view="home" aria-current="page">Home</button>
      <button data-view="calendar">Calendar</button>
      <button data-view="posts">Posts</button>
      <button data-view="settings">Settings</button>
    </nav>
  </div>
</header>

<main>
  <section class="view stack" id="view-home"></section>
  <section class="view" id="view-calendar" hidden></section>
  <section class="view stack" id="view-posts" hidden></section>
  <section class="view stack" id="view-settings" hidden></section>
</main>

<button class="btn primary fab" id="fab">+ New post</button>

<dialog id="post-dlg"></dialog>
<dialog id="acct-dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ---------- Platforms ---------- */
const enc = encodeURIComponent;
// limit: caption/text length; compose: where to go to post (gets the text when the site accepts it in the URL)
const PLATFORMS = {
  instagram: { name: "Instagram", abbr: "IG", color: "#E1306C", limit: 2200, hashtags: 30,
    compose: () => "https://www.instagram.com/", inbox: "https://www.instagram.com/direct/inbox/",
    profile: (h) => `https://www.instagram.com/${h}/` },
  facebook: { name: "Facebook", abbr: "FB", color: "#1877F2", limit: 63206,
    compose: () => "https://www.facebook.com/", inbox: "https://business.facebook.com/latest/inbox",
    profile: (h) => `https://www.facebook.com/${h}` },
  tiktok: { name: "TikTok", abbr: "TT", color: "#111111", limit: 4000,
    compose: () => "https://www.tiktok.com/upload", inbox: "https://www.tiktok.com/messages",
    profile: (h) => `https://www.tiktok.com/@${h}` },
  x: { name: "X", abbr: "X", color: "#000000", limit: 280, countUrlsAs: 23,
    compose: (t) => `https://x.com/intent/post?text=${enc(t)}`, inbox: "https://x.com/messages",
    profile: (h) => `https://x.com/${h}` },
  youtube: { name: "YouTube", abbr: "YT", color: "#FF0033", limit: 5000,
    compose: () => "https://studio.youtube.com/", inbox: "https://studio.youtube.com/",
    profile: (h) => `https://www.youtube.com/@${h}` },
  linkedin: { name: "LinkedIn", abbr: "in", color: "#0A66C2", limit: 3000,
    compose: (t) => `https://www.linkedin.com/feed/?shareActive=true&text=${enc(t)}`, inbox: "https://www.linkedin.com/messaging/",
    profile: (h) => `https://www.linkedin.com/in/${h}/` },
  threads: { name: "Threads", abbr: "@", color: "#333333", limit: 500,
    compose: (t) => `https://www.threads.net/intent/post?text=${enc(t)}`, inbox: "https://www.threads.net/activity",
    profile: (h) => `https://www.threads.net/@${h}` },
  bluesky: { name: "Bluesky", abbr: "BS", color: "#1185FE", limit: 300,
    compose: (t) => `https://bsky.app/intent/compose?text=${enc(t)}`, inbox: "https://bsky.app/notifications",
    profile: (h) => `https://bsky.app/profile/${h}` },
  pinterest: { name: "Pinterest", abbr: "P", color: "#E60023", limit: 500,
    compose: () => "https://www.pinterest.com/pin-creation-tool/", inbox: "https://www.pinterest.com/",
    profile: (h) => `https://www.pinterest.com/${h}/` },
};

/* ---------- State ---------- */
const KEY = "socialhub.v1";
const blank = () => ({ accounts: [], posts: [], snippets: [], theme: "auto", notify: false });
let S = load();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return { ...blank(), ...JSON.parse(raw) };
  } catch (e) { /* storage blocked or corrupt: start fresh */ }
  return blank();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast("Couldn't save — your browser is blocking storage"); }
}
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const acctById = (id) => S.accounts.find((a) => a.id === id);

/* ---------- Helpers ---------- */
const $ = (sel, el = document) => el.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const localISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const dayKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fmtNum = (n) => Intl.NumberFormat(undefined, { notation: n >= 10000 ? "compact" : "standard", maximumFractionDigits: 1 }).format(n);

function fmtWhen(iso) {
  if (!iso) return "No date";
  const d = new Date(iso), now = new Date();
  const time = d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - t0) / 86400000);
  if (diff === 0) return `Today, ${time}`;
  if (diff === 1) return `Tomorrow, ${time}`;
  if (diff === -1) return `Yesterday, ${time}`;
  const opts = { weekday: "short", month: "short", day: "numeric" };
  if (d.getFullYear() !== now.getFullYear()) opts.year = "numeric";
  return `${d.toLocaleDateString(undefined, opts)}, ${time}`;
}

function picon(platform, sm) {
  const p = PLATFORMS[platform] || { abbr: "?", color: "#888", name: platform };
  return `<span class="pico${sm ? " sm" : ""}" style="background:${p.color}" title="${esc(p.name)}" aria-hidden="true">${esc(p.abbr)}</span>`;
}

function cleanHandle(h) {
  h = String(h || "").trim();
  // Accept a pasted profile link and keep just the handle
  try {
    if (/^https?:\/\//i.test(h)) {
      const parts = new URL(h).pathname.split("/").filter(Boolean).filter((s) => !["in", "profile", "channel", "c"].includes(s));
      if (parts.length) h = parts[0];
    }
  } catch (e) { /* not a URL */ }
  return h.replace(/^@/, "");
}
const profileUrl = (a) => a.url || PLATFORMS[a.platform]?.profile(enc(a.handle).replace(/%40/g, "@")) || "#";

// Length the way each site counts it (X counts every link as 23 characters)
function textLength(text, platform) {
  const p = PLATFORMS[platform];
  let t = text;
  let extra = 0;
  if (p?.countUrlsAs) {
    t = t.replace(/https?:\/\/\S+/g, () => { extra += p.countUrlsAs; return ""; });
  }
  return [...t].length + extra;
}
const hashtagCount = (text) => (text.match(/(^|\s)#[\p{L}\p{N}_]+/gu) || []).length;

function problems(text, platform) {
  const p = PLATFORMS[platform];
  if (!p) return [];
  const out = [];
  const len = textLength(text, platform);
  if (len > p.limit) out.push(`${len - p.limit} over the ${fmtNum(p.limit)} limit`);
  if (p.hashtags && hashtagCount(text) > p.hashtags) out.push(`more than ${p.hashtags} hashtags`);
  return out;
}

/* ---------- Post status ---------- */
const liveTargets = (post) => post.targets.filter((id) => acctById(id));
const isPosted = (post) => { const t = liveTargets(post); return t.length > 0 && t.every((id) => post.done[id]); };
function status(post) {
  if (isPosted(post)) return "posted";
  if (!post.when) return "draft";
  const ms = new Date(post.when) - Date.now();
  if (ms <= 0) return "overdue";
  if (ms < 24 * 3600 * 1000) return "soon";
  return "scheduled";
}
const STATUS_LABEL = { posted: "Posted", draft: "Draft", overdue: "Due now", soon: "Next 24h", scheduled: "Scheduled" };
const sortByWhen = (a, b) => (a.when || "9999").localeCompare(b.when || "9999") || a.created - b.created;

/* ---------- Publishing ---------- */
function copyText(text) {
  if (navigator.clipboard?.writeText) {
    return navigator.clipboard.writeText(text).then(() => true, () => fallbackCopy(text));
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { /* unsupported */ }
  ta.remove();
  return ok;
}

// Copy the caption and open the site, all inside the same tap so pop-up blockers allow it
function publish(postId, acctId) {
  const post = S.posts.find((p) => p.id === postId), a = acctById(acctId);
  if (!post || !a) return;
  const p = PLATFORMS[a.platform];
  const text = post.text + (post.link && !post.text.includes(post.link) ? `\n\n${post.link}` : "");
  const copied = copyText(text);
  window.open(p.compose(text), "_blank", "noopener");
  copied.then((ok) => toast(ok ? `Caption copied — paste it into ${p.name}, then tick it off here` : `Opened ${p.name}. Copy the caption from the post to paste it.`));
}

function toggleDone(postId, acctId) {
  const post = S.posts.find((p) => p.id === postId);
  if (!post) return;
  if (post.done[acctId]) delete post.done[acctId];
  else post.done[acctId] = Date.now();
  save(); render();
  if (isPosted(post)) toast("All done for this post 🎉");
}

function postCard(post) {
  const st = status(post);
  const badgeCls = { overdue: "overdue", soon: "soon", posted: "done" }[st] || "";

    const done = !!post.done[a.id];
    const issues = problems(post.text, a.platform);
    return `<span class="target${done ? " posted" : ""}">
      ${picon(a.platform, true)}<span class="h">${esc(a.handle)}</span>
      ${issues.length && !done ? `<span class="over" title="${esc(issues.join(", "))}">too long</span>` : ""}
      ${done
        ? `<button data-act="undo" data-post="${post.id}" data-acct="${a.id}" title="Mark as not posted">✓ Posted</button>`
        : `<button data-act="publish" data-post="${post.id}" data-acct="${a.id}" title="Copy caption and open ${esc(PLATFORMS[a.platform].name)}">Post</button>
           <button data-act="done" data-post="${post.id}" data-acct="${a.id}" title="Mark as posted" style="background:none;color:var(--muted)">✓</button>`}
    </span>`;
  }).join("");
  return `<article class="card post">

    <div class="targets">${targets || '<span class="small muted">No accounts picked — edit to choose where this goes.</span>'}</div>
  </article>`;
}

function followerInfo(a) {
  const h = a.history || [];
  if (!h.length) return `<div class="followers"><span class="muted small">No follower count yet</span></div>`;
  const cur = h[h.length - 1];
  // Compare with the last reading from at least 30 days ago (or the oldest one we have)
  const cutoff = Date.now() - 30 * 86400000;
  let base = h[0];
  for (const r of h) if (r.t <= cutoff) base = r;
  const d = cur.n - base.n;
  const days = Math.max(1, Math.round((cur.t - base.t) / 86400000));
  const delta = base === cur ? "" : `<span class="delta ${d >= 0 ? "up" : "down"} small">${d >= 0 ? "+" : ""}${fmtNum(d)} in ${days}d</span>`;
  return `<div class="followers"><b>${fmtNum(cur.n)}</b><span class="muted small">followers</span>${delta}</div>`;
}

function renderPosts() {
  const el = $("#view-posts");
  const q = postSearch.toLowerCase();
  const match = (p) => {
    const st = status(p);
    const okFilter = postFilter === "all" || (postFilter === "upcoming" && ["soon", "scheduled", "overdue"].includes(st))
      || (postFilter === "drafts" && st === "draft") || (postFilter === "posted" && st === "posted") || (postFilter === "overdue" && st === "overdue");
    if (!okFilter) return false;
    if (!q) return true;
    return [p.title, p.text, p.notes, ...p.targets.map((id) => acctById(id)?.handle)].join(" ").toLowerCase().includes(q);
  };
  let list = S.posts.filter(match).sort(sortByWhen);
  if (postFilter === "posted") list = list.reverse();
  const f = (k, label) => `<button data-filter="${k}" aria-pressed="${postFilter === k}">${label}</button>`;
  el.innerHTML = `
    <div class="filters">
      <div class="seg">${f("upcoming", "Upcoming")}${f("overdue", "Due now")}${f("drafts", "Drafts")}${f("posted", "Posted")}${f("all", "All")}</div>
      <input type="search" class="search" id="post-search" placeholder="Search posts" value="${esc(postSearch)}">

}

function renderCalendar() {
  const el = $("#view-calendar");
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const start = new Date(y, m, 1 - new Date(y, m, 1).getDay());
  const byDay = {};
  for (const p of S.posts) if (p.when) (byDay[p.when.slice(0, 10)] ||= []).push(p);
  Object.values(byDay).forEach((l) => l.sort(sortByWhen));
  const today = dayKey(new Date());
  let cells = "";
  for (let i = 0; i < 42; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const k = dayKey(d), list = byDay[k] || [];
    const color = (p) => PLATFORMS[acctById(p.targets[0])?.platform]?.color || "var(--accent)";
    cells += `<div class="day${d.getMonth() !== m ? " out" : ""}${k === today ? " today" : ""}" data-day="${k}" role="button" tabindex="0" aria-label="${d.toDateString()}, ${list.length} posts">
      <span class="dnum">${d.getDate()}</span>
      ${list.slice(0, 3).map((p) => `<span class="pill${isPosted(p) ? " done" : ""}" style="--c:${color(p)}" data-post="${p.id}" title="${esc(p.text.slice(0, 120))}">${esc(p.when.slice(11))} ${esc(p.title || p.text.slice(0, 40) || "Untitled")}</span>`).join("")}
      ${list.length > 3 ? `<span class="more">+${list.length - 3} more</span>` : ""}
      <span class="dots">${list.slice(0, 6).map((p) => `<i style="--c:${color(p)}"></i>`).join("")}</span>
    </div>`;
  }
  const dayPosts = calDay ? (byDay[calDay] || []) : [];
  el.innerHTML = `
    <div class="cal-head">
      <h2>${calMonth.toLocaleDateString(undefined, { month: "long", year: "numeric" })}</h2>
      <button class="btn sm" data-cal="-1" aria-label="Previous month">‹</button>
      <button class="btn sm" data-cal="0">Today</button>

    <div class="cal">
      ${["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map((d) => `<div class="dow">${d}</div>`).join("")}
      ${cells}
    </div>
    ${calDay ? `<div class="day-list">
      <div class="section-head"><h2>${new Date(calDay + "T00:00").toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" })}</h2>
        <button class="btn sm primary" data-act="new-on" data-day="${calDay}">+ Post on this day</button></div>
      ${dayPosts.length ? `<div class="post-list">${dayPosts.map(postCard).join("")}</div>` : `<div class="card empty">Nothing planned this day.</div>`}
    </div>` : `<p class="small muted">Tap a day to see or plan its posts.</p>`}`;
}

/* ---------- Post editor ---------- */
function openPost(id, preset = {}) {
  const editing = id ? S.posts.find((p) => p.id === id) : null;
  const post = editing ? structuredClone(editing) : { id: uid(), title: "", text: "", notes: "", link: "", when: "", targets: [], done: {}, created: Date.now(), ...preset };
  const dlg = $("#post-dlg");
  dlg.innerHTML = `<form class="dlg" method="dialog" id="post-form">
    <div class="dlg-head"><h2>${editing ? "Edit post" : "New post"}</h2><button type="button" class="btn sm ghost" data-close aria-label="Close">✕</button></div>
    <div class="dlg-body">
      <div>
        <div class="field" style="font-weight:600;font-size:14px;margin-bottom:6px">Post to</div>
        ${S.accounts.length ? `<div class="choose">${S.accounts.map((a) => `<label>
            <input type="checkbox" name="targets" value="${a.id}" ${post.targets.includes(a.id) ? "checked" : ""}>
            ${picon(a.platform, true)} ${esc(a.label || "@" + a.handle)}</label>`).join("")}</div>`
          : `<div class="small muted">No accounts yet. <button type="button" class="btn sm" data-act="add-acct">+ Add account</button></div>`}
      </div>
      <label class="field">Caption
        <textarea name="text" id="post-text" placeholder="What do you want to say?">${esc(post.text)}</textarea>
      </label>
      ${S.snippets.length ? `<div class="chips">${S.snippets.map((s, i) => `<button type="button" class="chip" data-snip="${i}" title="${esc(s)}">+ ${esc(s.length > 28 ? s.slice(0, 28) + "…" : s)}</button>`).join("")}</div>` : ""}
      <div class="limits" id="limits"></div>
      <div class="two">
        <label class="field">When <span class="hint">Leave empty to keep it as a draft</span>
          <input type="datetime-local" name="when" value="${esc(post.when)}">
        </label>
        <label class="field">Link <span class="hint">Added to the end when you post</span>
          <input type="url" name="link" placeholder="https://" value="${esc(post.link)}">
        </label>
      </div>
      <div class="two">
        <label class="field">Title <span class="hint">Only for you, or a YouTube title</span>
          <input type="text" name="title" value="${esc(post.title)}" maxlength="100">
        </label>
        <label class="field">Media & notes <span class="hint">e.g. "reel_final.mp4 in Drive"</span>
          <input type="text" name="notes" value="${esc(post.notes)}">
        </label>
      </div>
    </div>
    <div class="dlg-foot">
      ${editing ? `<button type="button" class="btn danger" data-act="del-post">Delete</button><button type="button" class="btn" data-act="dup-post">Duplicate</button>` : ""}
      <span class="spacer"></span>
      <button type="button" class="btn" data-close>Cancel</button>
      <button class="btn primary">Save</button>
    </div>
  </form>`;

  const form = $("#post-form", dlg);
  const text = $("#post-text", dlg);
  const updateLimits = () => {
    const chosen = [...form.querySelectorAll('input[name=targets]:checked')].map((i) => acctById(i.value)).filter(Boolean);
    const plats = [...new Set(chosen.map((a) => a.platform))];
    const t = text.value;
    $("#limits", dlg).innerHTML = plats.map((pl) => {
      const p = PLATFORMS[pl], n = textLength(t, pl), r = n / p.limit;
      const tags = p.hashtags ? hashtagCount(t) : 0;
      const tagOver = p.hashtags && tags > p.hashtags;
      return `<div class="limit${r > 1 || tagOver ? " over" : r > .9 ? " near" : ""}">${picon(pl, true)}<span style="min-width:72px">${esc(p.name)}</span>
        <span class="bar"><i style="width:${Math.min(100, r * 100)}%"></i></span>
        <span class="n">${fmtNum(n)} / ${fmtNum(p.limit)}${tagOver ? ` · ${tags} tags (max ${p.hashtags})` : ""}</span></div>`;
    }).join("") || (S.accounts.length ? `<div class="small muted">Pick accounts to see each site's length limit.</div>` : "");
  };
  updateLimits();
  form.addEventListener("input", updateLimits);
  form.addEventListener("change", updateLimits);

  dlg.onclick = (e) => {
    const b = e.target.closest("button");
    if (!b) { if (e.target === dlg) dlg.close(); return; }
    if (b.hasAttribute("data-close")) dlg.close();
    else if (b.dataset.snip != null) {
      const s = S.snippets[+b.dataset.snip], st = text.selectionStart ?? text.value.length, en = text.selectionEnd ?? st;
      const before = text.value.slice(0, st), sep = before && !/\s$/.test(before) ? (s.startsWith("#") ? " " : "\n\n") : "";
      text.value = before + sep + s + text.value.slice(en);
      text.focus(); text.selectionStart = text.selectionEnd = st + sep.length + s.length;
      updateLimits();
    } else if (b.dataset.act === "del-post") {
      if (!confirm("Delete this post?")) return;
      S.posts = S.posts.filter((p) => p.id !== post.id); save(); dlg.close(); render(); toast("Post deleted");
    } else if (b.dataset.act === "dup-post") {
      dlg.close();
      openPost(null, { title: editing.title, text: editing.text, notes: editing.notes, link: editing.link, targets: [...editing.targets], when: "" });
    } else if (b.dataset.act === "add-acct") { dlg.close(); openAccount(); }
  };

  form.onsubmit = (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const whenChanged = post.when !== fd.get("when");
    Object.assign(post, {
      title: fd.get("title").trim(), text: fd.get("text"), notes: fd.get("notes").trim(), link: fd.get("link").trim(),
      when: fd.get("when"), targets: fd.getAll("targets"),
    });
    // Keep "posted" ticks only for accounts still on the post
    post.done = Object.fromEntries(Object.entries(post.done).filter(([k]) => post.targets.includes(k)));
    if (whenChanged) delete post.notified;
    const i = S.posts.findIndex((p) => p.id === post.id);
    if (i >= 0) S.posts[i] = post; else S.posts.push(post);
    save(); dlg.close(); render();
    toast(post.when ? `Scheduled for ${fmtWhen(post.when)}` : "Saved as draft");
  };
  dlg.showModal();
  if (!editing) text.focus();
}

    else if (b.dataset.act === "del-acct") {
      const n = S.posts.filter((p) => p.targets.includes(a.id) && !isPosted(p)).length;
      if (!confirm(`Remove @${a.handle}?${n ? ` It will be taken off ${n} planned post${n > 1 ? "s" : ""}.` : ""}`)) return;
      S.accounts = S.accounts.filter((x) => x.id !== a.id);
      for (const p of S.posts) { p.targets = p.targets.filter((t) => t !== a.id); delete p.done[a.id]; }
      save(); dlg.close(); render(); toast("Account removed");
    }
  };
  form.onsubmit = (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const handle = cleanHandle(fd.get("handle"));
    if (!handle) { form.handle.focus(); return; }
    const data = { platform: fd.get("platform"), handle, label: fd.get("label").trim(), url: fd.get("url").trim() };
    if (a) Object.assign(a, data);
    else {
      const f = parseInt(fd.get("followers"), 10);
      S.accounts.push({ id: uid(), ...data, history: Number.isFinite(f) && f >= 0 ? [{ t: Date.now(), n: f }] : [] });
    }
    save(); dlg.close(); render();
    toast(a ? "Account saved" : `Added @${handle}`);
  };
  dlg.showModal();
  form.handle.focus();
}

function updateFollowers(id) {
  const a = acctById(id);
  const cur = a.history?.length ? a.history[a.history.length - 1].n : "";
  const v = prompt(`How many followers does @${a.handle} have now?`, cur);
  if (v == null) return;
  const n = parseInt(String(v).replace(/[,\s.]/g, ""), 10);
  if (!Number.isFinite(n) || n < 0) { toast("That doesn't look like a number"); return; }
  a.history ||= [];
  // Replace today's reading rather than stacking several per day
  const last = a.history[a.history.length - 1];
  if (last && dayKey(new Date(last.t)) === dayKey(new Date())) last.n = n, last.t = Date.now();
  else a.history.push({ t: Date.now(), n });
  if (a.history.length > 400) a.history.splice(0, a.history.length - 400);
  save(); render();
}

/* ---------- Events ---------- */
document.addEventListener("click", (e) => {
  const tab = e.target.closest("nav.tabs button");
  if (tab) { view = tab.dataset.view; render(); window.scrollTo(0, 0); return; }

  if (e.target.closest("dialog")) return; // dialogs handle their own clicks

  const pill = e.target.closest(".pill[data-post]");
  if (pill) { openPost(pill.dataset.post); return; }
  const day = e.target.closest(".day[data-day]");
  if (day) { calDay = calDay === day.dataset.day ? null : day.dataset.day; renderCalendar(); return; }

  const f = e.target.closest("[data-filter]");
  if (f) { postFilter = f.dataset.filter; renderPosts(); return; }
  const cal = e.target.closest("[data-cal]");
  if (cal) {
    const step = +cal.dataset.cal;
    const now = new Date();
    calMonth = step ? new Date(calMonth.getFullYear(), calMonth.getMonth() + step, 1) : new Date(now.getFullYear(), now.getMonth(), 1);
    if (!step) calDay = dayKey(now);
    renderCalendar(); return;
  }
  const th = e.target.closest("[data-theme-set]");
  if (th) { S.theme = th.dataset.themeSet; save(); applyTheme(); renderSettings(); return; }

  const b = e.target.closest("[data-act]");
  if (!b) return;
  const { act, post, acct } = b.dataset;
  switch (act) {
    case "publish": publish(post, acct); break;
    case "done": case "undo": toggleDone(post, acct); break;
    case "edit": openPost(post); break;
    case "copy": {
      const p = S.posts.find((x) => x.id === post);
      copyText(p.text + (p.link && !p.text.includes(p.link) ? `\n\n${p.link}` : "")).then((ok) => toast(ok ? "Caption copied" : "Couldn't copy — select the text instead"));
      break;
    }
    case "new": openPost(); break;
    case "new-for": openPost(null, { targets: [acct] }); break;
    case "new-on": openPost(null, { when: `${b.dataset.day}T12:00` }); break;
    case "add-acct": openAccount(); break;
    case "edit-acct": openAccount(acct); break;
    case "followers": updateFollowers(acct); break;
    case "del-snip": S.snippets.splice(+b.dataset.i, 1); save(); renderSettings(); break;
    case "export": exportData(); break;
    case "wipe":
      if (confirm("Delete all accounts, posts and snippets from this browser? Export a backup first if you might want them back.")) {
        S = blank(); save(); applyTheme(); render(); toast("Everything deleted");
      }
      break;
  }
});

document.addEventListener("keydown", (e) => {
  const day = e.target.closest?.(".day[data-day]");
  if (day && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); day.click(); }
});

document.addEventListener("input", (e) => {
  if (e.target.id === "post-search") {
    postSearch = e.target.value;
    const pos = e.target.selectionStart;
    renderPosts();
    const s = $("#post-search"); s.focus(); s.setSelectionRange(pos, pos);
  }
});

document.addEventListener("submit", (e) => {
  if (e.target.id !== "snip-form") return;
  e.preventDefault();
  const v = $("#snip-text").value.trim();
  if (!v) return;
  S.snippets.push(v); save(); renderSettings(); $("#snip-text").focus();
});

document.addEventListener("change", async (e) => {
  if (e.target.id === "notify-toggle") {
    if (e.target.checked && Notification.permission !== "granted") {
      const perm = await Notification.requestPermission();
      if (perm !== "granted") { S.notify = false; save(); renderSettings(); return; }
    }
    S.notify = e.target.checked; save();
    toast(S.notify ? "Reminders on — keep this tab open" : "Reminders off");
  } else if (e.target.id === "import-file") {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!Array.isArray(data.accounts) || !Array.isArray(data.posts)) throw new Error("bad");
      if (!confirm(`Replace what's here with ${data.accounts.length} accounts and ${data.posts.length} posts from the backup?`)) return;
      S = { ...blank(), ...data };
      S.posts.forEach((p) => { p.targets ||= []; p.done ||= {}; p.text ??= ""; });
      save(); applyTheme(); render(); toast("Backup imported");
    } catch (err) { toast("That file isn't a Social Hub backup"); }
    e.target.value = "";
  }
});

$("#fab").addEventListener("click", () => openPost(null, view === "calendar" && calDay ? { when: `${calDay}T12:00` } : {}));

function exportData() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `social-hub-backup-${dayKey(new Date())}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
}

function applyTheme() {
  if (S.theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", S.theme);
}

/* ---------- Reminders ---------- */
function checkDue() {
  let changed = false;
  for (const p of S.posts) {
    if (status(p) !== "overdue" || p.notified) continue;
    p.notified = true; changed = true;
    const names = liveTargets(p).filter((id) => !p.done[id]).map((id) => PLATFORMS[acctById(id).platform].name);
    if (S.notify && "Notification" in window && Notification.permission === "granted") {
      try {
        const n = new Notification("Time to post", { body: `${names.join(", ")}: ${(p.title || p.text).slice(0, 100)}`, tag: p.id });
        n.onclick = () => { window.focus(); openPost(p.id); n.close(); };
      } catch (e) { /* some mobile browsers only allow notifications from a service worker */ }
    }
  }
  if (changed) { save(); if (!document.querySelector("dialog[open]")) render(); }
}

/* ---------- Start ---------- */
applyTheme();
render();
checkDue();
// Refresh "due now" badges each minute (not on Posts or Settings, where it would steal focus from typing)
setInterval(() => { checkDue(); if (!document.querySelector("dialog[open]") && (view === "home" || view === "calendar")) render(); }, 60000);
window.addEventListener("storage", (e) => { if (e.key === KEY) { S = load(); render(); } });
</script>
</body>
